on decisions. Temporarily mute social media, save long messages as drafts, and address practical matters such as keys, housing, medication, or pets. Intense emotion does not require immediate clarity. Risk of self-harm, harm to others, violence, or inability to stay safe requires immediate contact with local emergency services, crisis or medical professionals, and a trusted person."}, "keywords": ["分手急救", "基本照顾", "危机安全", "breakup first aid", "basic care", "crisis safety", "breakup", "break", "up", "separation", "split", "分手", "离开", "结束"], "children": ["faq-032", "faq-080"], "cluster": 6}, {"id": "faq-247", "q": {"zh": "睡眠、运动和饮食能解决情感问题吗？", "en": "Can sleep, exercise, and nutrition solve relationship or emotional problems?"}, "a": {"zh": "它们不能替代关系协商、心理治疗或医疗，但能影响注意力、冲动控制和承受压力的能力，因此是重要基础。可从规律起床、温和活动、稳定进食和减少过量酒精等小步骤开始，不必把健康习惯变成自责或伴侣控制的工具。持续失眠、显著体重变化、躯体不适或情绪功能下降应咨询合资格医疗专业人员。若存在自伤、他伤或暴力危险，应使用当地紧急与危机资源，而不是只靠生活方式建议。", "en": "They do not replace relationship negotiation, psychotherapy, or medical care, but they affect attention, impulse control, and capacity for stress, making them useful foundations. Start with small steps such as a regular wake time, gentle activity, steady meals, and less excessive alcohol, without turning health habits into self-blame or partner control. Persistent insomnia, substantial weight change, physical symptoms, or declining emotional function warrants advice from a qualified medical professional. Danger of self-harm, harm to others, or violence requires local emergency and crisis resources, not lifestyle advice alone."}, "keywords": ["生活习惯", "情绪基础", "医疗转介", "lifestyle habits", "emotional foundation", "medical referral"], "children": ["faq-232", "faq-009"], "cluster": 0}, {"id": "faq-248", "q": {"zh": "如何建立不把所有情绪都压在伴侣身上的支持网络？", "en": "How can someone build a support network without placing every emotional need on a partner?"}, "a": {"zh": "可绘制支持地图，把不同需要分给合适来源：陪伴可找朋友，实际协助可找家人或社区，专业困扰找合资格人员，兴趣与归属感通过团体活动获得。先从一两个低压力联系开始，提出具体请求，例如“一起散步二十分钟”，并尊重他人的时间和保密界限。支持网络不是公开伴侣隐私的许可，分享时应去除不必要细节。多元支持能减轻单一关系压力，也让个人在关系变化时更有韧性。", "en": "Map different needs to suitable sources: companionship from friends, practical help from family or community, professional concerns from qualified providers, and belonging through interest groups. Start with one or two low-pressure contacts and make a specific request, such as “Could we walk for twenty minutes?”, while respecting others’ time and privacy limits. A support network is not permission to expose a partner’s private information; omit unnecessary details when sharing. Diverse support reduces pressure on one relationship and strengthens resilience when circumstances change."}, "keywords": ["支持网络", "社会联结", "关系韧性", "support network", "social connection", "relationship resilience", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-079", "faq-265"], "cluster": 0}, {"id": "faq-249", "q": {"zh": "应该选择个人咨询还是伴侣共同咨询？", "en": "Should someone choose individual counseling or joint couple counseling?"}, "a": {"zh": "若目标主要是梳理个人情绪、边界和决定，或另一方不愿参加，个人形式可能更合适；若双方都自愿、关系基本安全，目标是改变互动模式，共同咨询可能有帮助。存在暴力、恐吓、报复、强制控制或无法自由表达时，常规共同咨询可能增加风险，应先进行独立安全评估并联系当地专业机构。两种形式也可能阶段性搭配，但谁是来访者、记录和私下信息规则必须事先明确。最终选择取决于需求、风险、人员资质与正式服务安排。", "en": "Individual work may fit when the goal is to process personal emotions, boundaries, and decisions, or when the other person will not attend. Joint work may help when both participate voluntarily, the relationship has basic safety, and the goal is to change interaction patterns. With violence, intimidation, retaliation, coercive control, or inability to speak freely, routine couple sessions may increase risk; seek an independent safety assessment and local specialist support first. Formats can sometimes be combined in stages, but the identity of the client, record handling, and rules for private disclosures must be clear in advance. The choice depends on need, risk, credentials, and formal service arrangements."}, "keywords": ["个人咨询", "伴侣咨询", "形式选择", "individual counseling", "couple counseling", "format selection", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-215", "faq-140"], "cluster": 0}, {"id": "faq-250", "q": {"zh": "小组课程或关系工作坊适合哪些人？", "en": "Who may benefit from a group program or relationship workshop?"}, "a": {"zh": "小组或工作坊适合希望学习通用沟通、边界、分手恢复或约会技能，并愿意遵守团体保密和互动规则的人。它通常不是个别危机处理或深度治疗的替代品，也无法保证其他参与者绝不泄密，因此参加者应谨慎分享可识别细节。报名之前应了解主持人资质、课程目标、人数与形式、录制政策、退出方式和费用。处于暴力、自伤或他伤即时危险的人应联系当地紧急服务和专业机构，而不是等待下一次小组活动。", "en": "Groups and workshops may suit people who want general communication, boundary, breakup-recovery, or dating skills and can follow group confidentiality and interaction rules. They are not usually substitutes for individual crisis care or intensive treatment, and no organizer can guarantee that every participant will keep information private, so identifiable details should be shared cautiously. Before enrolling, review facilitator credentials, goals, size and format, recording policy, withdrawal process, and fees. Anyone in immediate danger from violence, self-harm, or harm to others should contact local emergency and specialist services rather than wait for a group session."}, "keywords": ["小组课程", "关系工作坊", "团体保密", "group program", "relationship workshop", "group confidentiality"], "children": ["faq-003", "faq-002"], "cluster": 0}, {"id": "faq-251", "q": {"zh": "婚前咨询通常会讨论哪些现实议题？", "en": "What practical topics are commonly discussed in premarital counseling?"}, "a": {"zh": "常见议题包括承诺定义、冲突方式、金钱与债务、家务和情绪劳动、生育与育儿、亲密与同意、职业搬迁、宗教文化、双方家庭界限、健康照护及数字隐私。目的不是通过测试决定“能不能结婚”，而是让隐含期待变得可见，并辨识尚未解决的重大分歧。双方可形成书面讨论清单和后续复盘安排；涉及婚前协议、资产、医疗或遗传问题时，应另咨询合资格法律或医疗专业人士。", "en": "Common topics include the meaning of commitment, conflict patterns, money and debt, household and emotional labor, children and parenting, intimacy and consent, career relocation, religion and culture, family boundaries, healthcare, and digital privacy. The goal is not a test that declares whether the couple “may marry,” but to make hidden expectations visible and identify major unresolved differences. The partners can create a written discussion list and follow-up reviews. Prenuptial agreements, assets, medical issues, or genetics require appropriately qualified legal or healthcare professionals."}, "keywords": ["婚前咨询", "现实规划", "期待澄清", "premarital counseling", "practical planning", "expectation clarification"], "children": ["faq-059", "faq-062"], "cluster": 18}, {"id": "faq-252", "q": {"zh": "没有明显危机的伴侣也需要做“关系体检”吗？", "en": "Can couples without an obvious crisis benefit from a “relationship check-in”?"}, "a": {"zh": "可以把定期复盘视为预防性沟通，而非证明关系有问题。双方可每月或按适合自己的节奏讨论近期欣赏、压力来源、未解决的小摩擦、时间与家务分配、亲密和个人空间，以及下一阶段的一项共同调整。频率无需追求统一标准，重要的是双方自愿、可暂停且不把复盘变成打分审判。若每次复盘都升级为恐吓或暴力，应停止共同练习，优先联系当地安全与专业资源。", "en": "A periodic review can be preventive communication rather than evidence that something is wrong. At a cadence that fits them, partners can discuss recent appreciation, stressors, small unresolved frictions, time and household allocation, intimacy and personal space, and one shared adjustment for the next period. There is no universal frequency; participation should be voluntary, pausable, and free from scorekeeping or trial-like judgment. If every review escalates into intimidation or violence, stop the joint exercise and prioritize local safety and specialist resources."}, "keywords": ["关系体检", "预防沟通", "定期复盘", "relationship check-in", "preventive communication", "periodic review", "safety", "crisis", "emergency", "self", "harm", "suicide", "domestic", "violence"], "children": ["faq-003", "faq-037"], "cluster": 0}, {"id": "faq-253", "q": {"zh": "单身来访者如何在约会前澄清自己的核心价值和底线？", "en": "How can a single client clarify core values and boundaries before dating?"}, "a": {"zh": "可分别列出希望拥有的关系品质、不能接受的行为和可以协商的偏好，并用具体行为定义，例如把“尊重”写成“拒绝后停止施压”“争执时不辱骂”。同时检视关于年龄、收入、性别角色或“灵魂伴侣”的外部脚本是否真属于自己。底线用于指导自己的选择和退出，不是控制别人改变。实际约会中还需逐步观察一致性，保留朋友、财务和生活节奏，不因早期承诺放弃安全验证。", "en": "Make separate lists of desired relationship qualities, unacceptable behavior, and negotiable preferences, defining each in observable terms—for example, respect means “stops pressuring after a no” and “does not insult during conflict.” Examine whether external scripts about age, income, gender roles, or “the one” genuinely reflect personal values. A boundary guides one’s own choice and exit; it does not force another person to change. In dating, observe consistency over time, maintain friendships, finances, and routine, and do not abandon safety checks because of early promises."}, "keywords": ["约会价值", "个人底线", "自主选择", "dating values", "personal boundaries", "autonomous choice", "boundary", "boundaries", "limits", "边界", "底线", "分寸"], "children": ["faq-243", "faq-069"], "cluster": 51}, {"id": "faq-254", "q": {"zh": "线上约会第一次见面有哪些基本安全建议？", "en": "What basic safety practices help for a first in-person meeting from online dating?"}, "a": {"zh": "在不暴露过多隐私的前提下先核验基本身份；选择公开、熟悉且方便离开的地点，自行安排往返，不让对方首次就掌握住址。把对象资料、地点和预计结束时间告知可信赖的人，约定报平安方式，并保持手机可用、饮品在视线内。任何人都可以随时结束见面，不欠对方亲密或第二次机会。若被跟踪、威胁或处于即时危险，应进入有人场所并联系当地紧急服务、可信赖的人和专业机构。", "en": "Verify basic identity without oversharing private information. Meet in a public, familiar place with an easy exit, arrange independent transport, and do not reveal a home address on the first meeting. Tell a trusted person the profile, location, and expected end time, agree on check-ins, keep the phone usable, and keep drinks in sight. Anyone may end the meeting at any time and owes neither intimacy nor another chance. If followed, threatened, or in immediate danger, move to a populated place and contact local emergency services, a trusted person, and specialist support."}, "keywords": ["线上约会", "初次见面", "人身安全", "online dating", "first meeting", "personal safety", "安全", "紧急", "自伤", "自杀", "家暴", "危机", "暴力"], "children": ["faq-139", "faq-020"], "cluster": 37}, {"id": "faq-255", "q": {"zh": "健康的同意包含哪些要素？", "en": "What are the elements of healthy consent?"}, "a": {"zh": "同意应当自愿、知情、具体、在当下表达，并可随时撤回。沉默、僵住、醉酒或失去相应能力、过去曾同意、已经恋爱结婚、收过礼物，都不自动构成本次同意；同意一种行为也不等于同意另一种。双方应能无惩罚地说“不”或“停”，并主动确认模糊信号。若发生未经同意的行为，应优先确保安全、联系可信赖的人以及当地医疗、性暴力支持或紧急专业机构；是否报告由当事人在法律与安全建议下自主决定。", "en": "Consent is voluntary, informed, specific, expressed in the present, and revocable at any time. Silence, freezing, intoxication or lack of relevant capacity, prior consent, marriage or dating, or receipt of gifts does not automatically establish consent now. Consent to one act is not consent to another. Both people must be able to say “no” or “stop” without punishment, and ambiguous signals should be actively checked. After nonconsensual conduct, prioritize safety and contact trusted people and local medical, sexual-violence, or emergency specialists; reporting remains the survivor’s choice informed by legal and safety advice."}, "keywords": ["自愿同意", "亲密边界", "性暴力支持", "consent", "intimate boundaries", "sexual-violence support"], "children": ["faq-140", "faq-101"], "cluster": 52}, {"id": "faq-256", "q": {"zh": "健康冲突与有害冲突有什么区别？", "en": "What distinguishes healthy conflict from harmful conflict?"}, "a": {"zh": "健康冲突仍允许双方表达不同意见、暂停、拒绝和回到议题，重点针对行为而非人格，事后能承担责任与修复。有害冲突常见羞辱、威胁、破坏物品、经济惩罚、阻止离开、跟踪、性胁迫或让一方因害怕而顺从。不能只用“我们都会吵架”把权力与安全差异抹平。出现暴力或强制控制时，不宜把改善责任平均分配；应联系当地紧急服务、可信赖的人及家暴或专业机构进行独立安全评估。", "en": "Healthy conflict still permits both people to disagree, pause, refuse, and return to the topic. It addresses behavior rather than attacking identity and allows accountability and repair. Harmful conflict may involve humiliation, threats, property destruction, financial punishment, blocking exits, stalking, sexual coercion, or compliance driven by fear. “All couples argue” must not erase differences in power and safety. With violence or coercive control, responsibility should not be evenly assigned; contact local emergency services, trusted people, and domestic-violence or specialist organizations for an independent safety assessment."}, "keywords": ["健康冲突", "有害冲突", "强制控制", "healthy conflict", "harmful conflict", "coercive control", "沟通", "吵架", "争吵", "冲突", "矛盾"], "children": ["faq-096", "faq-043"], "cluster": 53}, {"id": "faq-257", "q": {"zh": "一个有效的道歉通常包含什么？", "en": "What does an effective apology usually include?"}, "a": {"zh": "有效道歉应具体指出行为及影响，不夹带“但你也……”或把责任推给对方感受；承认责任，表达真诚遗憾，询问可行修复，并通过可观察的改变防止重复。被伤害者有权需要时间，也不必立即原谅或恢复信任。道歉不是索取复合、亲密或撤回投诉的交易。对于暴力、胁迫或反复严重伤害，单一道歉不能替代安全措施、责任承担和专业介入。", "en": "An effective apology names the behavior and its impact without adding “but you also…” or shifting responsibility to the other person’s feelings. It accepts responsibility, expresses genuine regret, asks about workable repair, and follows with observable change that reduces repetition. The harmed person may need time and is not required to forgive or restore trust immediately. An apology is not a transaction for reconciliation, intimacy, or withdrawal of a complaint. In cases of violence, coercion, or repeated serious harm, one apology cannot replace safety measures, accountability, and specialist intervention."}, "keywords": ["有效道歉", "责任承担", "行为改变", "effective apology", "accountability", "behavior change"], "children": ["faq-045", "faq-194"], "cluster": 14}, {"id": "faq-258", "q": {"zh": "原谅是否意味着忘记、复合或取消界限？", "en": "Does forgiveness mean forgetting, reconciling, or removing boundaries?"}, "a": {"zh": "不意味着。原谅对不同人可指放下部分情绪负担、停止报复或重新理解经历，也有人不使用这个概念。它不自动恢复信任、不要求继续联系，更不能抹去后果或法律责任。来访者可以在不原谅的情况下疗愈，也可以原谅后仍选择分开和维持界限。咨询师不应以宗教、家庭或“为了自己好”为由强迫原谅；安全、正义和个人自主应被尊重。", "en": "No. Forgiveness may mean releasing some emotional burden, declining revenge, or making new meaning, and some people do not use the concept at all. It does not automatically restore trust, require continued contact, erase consequences, or remove legal accountability. A person can heal without forgiving, or forgive while remaining separated and maintaining boundaries. A counselor should not pressure forgiveness through religion, family expectations, or claims that it is “for your own good.” Safety, justice, and personal autonomy remain valid."}, "keywords": ["原谅", "复合区别", "自主界限", "forgiveness", "reconciliation distinction", "autonomous boundaries", "cancel", "cancellation", "reschedule", "no", "show", "reconcile", "reconciliation", "get"], "children": ["faq-264", "faq-234"], "cluster": 54}, {"id": "faq-259", "q": {"zh": "破裂后的信任可以怎样逐步重建？", "en": "How can trust be rebuilt gradually after a rupture?"}, "a": {"zh": "信任通常来自持续可验证的行为，而非要求对方“翻篇”。可先明确破裂是什么、伤害者承担哪些责任、需要哪些有限且对等的透明措施，以及何时复盘。修复可从小承诺开始，例如如期沟通、诚实报告变化、尊重问题和接受合理后果；受伤者也可保留不继续的选择。无限监控、交出全部隐私或快速原谅并非必要条件。若破裂涉及暴力或强制控制，安全评估优先，不能把共同修复当作默认目标。", "en": "Trust usually grows from sustained, verifiable behavior, not a demand to “move on.” Clarify what the rupture was, what responsibility the person who caused harm accepts, which limited and reciprocal transparency measures are useful, and when progress will be reviewed. Repair can begin with small commitments—communicating as agreed, reporting changes honestly, tolerating questions, and accepting reasonable consequences. The harmed person retains the option not to continue. Unlimited surveillance, total surrender of privacy, or rapid forgiveness is not required. When the rupture involves violence or coercive control, safety assessment comes first and joint repair is not the default goal."}, "keywords": ["信任重建", "持续行动", "透明边界", "trust rebuilding", "sustained action", "transparency boundaries", "trust", "jealousy", "checking", "phone", "insecure", "信任", "安全感", "查手机"], "children": ["faq-035", "faq-257"], "cluster": 8}, {"id": "faq-260", "q": {"zh": "分开后怎样把共同养育从伴侣冲突中分离出来？", "en": "After separation, how can co-parenting be separated from former-partner conflict?"}, "a": {"zh": "可把沟通限制在孩子的健康、教育、日程与必要费用，使用简短、中性、可记录的方式，并设固定交接和紧急联络规则。不要让孩子传话、刺探、保密成人事务或承受对另一位家长的贬低。重大决定与费用分担应遵守有效协议、法院命令和适用法律；高冲突时可考虑平行养育或合资格家庭专业支持。若交接伴随威胁、跟踪或暴力，应联系当地紧急服务、可信赖的人、家暴或法律专业机构，优先设计安全交接。", "en": "Limit communication to the child’s health, education, schedule, and necessary expenses, using brief, neutral, traceable messages and clear handover and emergency-contact rules. Do not use the child as a messenger, investigator, keeper of adult secrets, or audience for criticism of the other parent. Major decisions and cost sharing must follow valid agreements, court orders, and applicable law. High-conflict families may consider parallel parenting or qualified family support. If handovers involve threats, stalking, or violence, contact local emergency services, trusted people, and domestic-violence or legal specialists and design safer exchanges first."}, "keywords": ["分居养育", "儿童中心", "安全交接", "post-separation parenting", "child-centered", "safe handover", "沟通", "吵架", "争吵", "冲突", "矛盾", "伴侣", "情侣", "夫妻"], "children": ["faq-063", "faq-033"], "cluster": 0}, {"id": "faq-261", "q": {"zh": "情感困扰已经影响工作或学习时，可以采取哪些现实措施？", "en": "What practical steps can help when emotional distress affects work or study?"}, "a": {"zh": "先把任务缩小为维持基本功能：列出当天最重要的一至三项，使用短时专注与休息，暂缓非必要承诺，并向可信赖的主管、教师或支持部门只披露完成安排所需的信息。可询问合法可用的假期、弹性、辅导或无障碍支持，同时保护关系隐私。若功能持续明显下降、无法睡眠进食或出现严重情绪症状，应咨询合资格医疗或心理健康专业人员；存在自伤或他伤危险时，应立即联系当地紧急服务和可信赖的人。", "en": "First reduce demands to basic functioning: choose one to three essential tasks for the day, use short focus and rest periods, postpone nonessential commitments, and disclose only what is needed to a trusted manager, teacher, or support office to arrange help. Ask about lawful leave, flexibility, counseling, or accessibility support while protecting relationship privacy. Persistent substantial decline, inability to sleep or eat, or severe emotional symptoms warrants a qualified medical or mental-health professional. Danger of self-harm or harm to others requires immediate local emergency services and a trusted person."}, "keywords": ["工作学习", "功能恢复", "合理支持", "work and study", "functional recovery", "reasonable support"], "children": ["faq-074", "faq-251"], "cluster": 6}, {"id": "faq-262", "q": {"zh": "争吵后把聊天记录发到社交媒体“让大家评理”有什么风险？", "en": "What are the risks of posting private messages on social media after an argument to “let everyone judge”?"}, "a": {"zh": "公开截图可能泄露双方及第三人的身份、健康、工作、住址或亲密信息，扩大羞辱和网络围攻，并影响后续修复、就业、监护或法律程序；删除也不保证副本消失。不同地区对隐私、诽谤、影像和通信内容有不同法律规则。情绪激动时可先保存私密草稿、向一位可信赖且守密的人求助，必要时咨询合资格法律人士。若记录涉及威胁或暴力，应安全保存证据并联系当地专业机构，而非公开刺激对方。", "en": "Public screenshots may expose identities and third-party information, health, work, addresses, or intimate details, intensify humiliation and online harassment, and affect repair, employment, custody, or legal proceedings. Deletion does not ensure copies disappear. Privacy, defamation, image, and communications laws differ by location. While activated, save a private draft, speak with one trusted and discreet person, and obtain qualified legal advice if needed. If messages contain threats or violence, preserve evidence safely and contact local specialist organizations rather than provoking the person publicly."}, "keywords": ["社交媒体", "聊天隐私", "网络围攻", "social media", "message privacy", "online harassment", "沟通", "吵架", "争吵", "冲突", "矛盾"], "children": ["faq-254", "faq-139"], "cluster": 55}, {"id": "faq-263", "q": {"zh": "伴侣对宠物归属和照护产生冲突时，如何讨论？", "en": "How can partners discuss conflict over a pet’s care or future home?"}, "a": {"zh": "可把宠物视为有稳定照护需要的生命，而非争夺关系输赢的工具。双方可记录谁能持续提供住房、时间、医疗、费用、日常陪伴和熟悉环境，并考虑宠物的健康、依恋与变化承受度。共同照护只有在沟通安全、地点可行且不会延长控制时才适合；书面约定费用、交接和重大医疗决定可减少冲突。宠物的法律地位因地区而异，争议严重时应咨询兽医、动物福利或合资格法律专业人员。", "en": "Treat the pet as a living being with stable care needs, not a tool for winning the breakup. Consider who can consistently provide housing, time, medical care, costs, daily companionship, and a familiar environment, together with the animal’s health, attachments, and tolerance for transitions. Shared care only fits when communication is safe, logistics work, and exchanges do not extend control. A written agreement on costs, handovers, and major veterinary decisions can reduce conflict. Legal treatment of pets varies, so serious disputes may require veterinary, animal-welfare, or qualified legal advice."}, "keywords": ["宠物照护", "分手安排", "共同责任", "pet care", "breakup arrangements", "shared responsibility", "沟通", "吵架", "争吵", "冲突", "矛盾", "伴侣", "情侣", "夫妻"], "children": ["faq-039", "faq-059"], "cluster": 56}, {"id": "faq-264", "q": {"zh": "“独立”是否意味着关系中不应该需要对方？", "en": "Does being “independent” mean people should not need their partner?"}, "a": {"zh": "健康关系通常包含相互依赖：可以需要安慰、合作和亲近，同时仍保有个人决定、朋友、兴趣、基本生活能力与说不的权利。完全不需要任何人和把所有需要交给一个人都可能让关系失去弹性。可观察的平衡包括能够提出请求而非命令、接受对方有时无法满足，并拥有其他支持来源。若一方通过金钱、社交隔离或威胁让另一方无法离开，那不是普通依赖差异，应寻求当地安全和专业支持。", "en": "Healthy relationships often involve interdependence: people can need comfort, cooperation, and closeness while retaining personal decisions, friends, interests, basic functioning, and the right to say no. Needing nobody and assigning every need to one person can both reduce resilience. Balance looks like making requests rather than demands, accepting that a partner cannot always provide, and maintaining other sources of support. If one person uses money, isolation, or threats to make leaving impossible, this is not an ordinary difference in dependence and calls for local safety and specialist support."}, "keywords": ["相互依赖", "个人自主", "关系弹性", "interdependence", "autonomy", "relationship resilience"], "children": ["faq-048", "faq-068"], "cluster": 0}, {"id": "faq-265", "q": {"zh": "长期孤独时，怎样避免因为害怕独处而进入不安全关系？", "en": "During prolonged loneliness, how can someone avoid entering an unsafe relationship mainly to escape being alone?"}, "a": {"zh": "可先承认孤独是真实需要，而不是缺陷，同时把连接来源扩展到朋友、家人、兴趣团体、志愿活动和专业支持。约会时放慢重大承诺与金钱往来，保留独立生活和定期与可信赖的人核对感受；把“有人陪”与“这个人尊重我”分开评估。预先写下红旗和退出计划能在情绪强烈时提供参照。若对方推动隔离、财务控制、威胁或暴力，应联系当地专业机构、可信赖的人及必要的紧急服务。", "en": "Recognize loneliness as a real need, not a defect, while widening connection through friends, family, interest groups, volunteering, and professional support. In dating, slow major commitments and money transfers, maintain an independent routine, and check perceptions with trusted people. Evaluate “I have company” separately from “this person respects me.” A written list of warning signs and an exit plan provides a reference when emotions are intense. If someone pushes isolation, financial control, threats, or violence, contact local specialist organizations, trusted people, and emergency services where needed."}, "keywords": ["孤独", "安全约会", "社会支持", "loneliness", "safe dating", "social support", "焦虑", "不安", "患得患失", "安全", "紧急", "自伤", "自杀", "家暴"], "children": ["faq-248", "faq-050"], "cluster": 0}, {"id": "faq-266", "q": {"zh": "纪念日、节日或旧地点触发分手悲伤时，可以怎么应对？", "en": "How can someone cope when anniversaries, holidays, or familiar places trigger breakup grief?"}, "a": {"zh": "提前预期触发能减少措手不及。可为当天安排较轻任务、可信赖陪伴、替代路线或新的小仪式，并允许自己同时有悲伤和正常生活。使用感官落地、短时写作或运动帮助情绪经过，而非强迫删除所有回忆。若需要，可暂时限制社交媒体提醒。持续强烈痛苦、明显功能受损或创伤反应可由合资格心理健康人员评估；出现自伤风险时立即联系当地紧急或危机机构及可信赖的人。", "en": "Anticipating a trigger can make it less destabilizing. Plan a lighter schedule, trusted company, an alternate route, or a small new ritual, while allowing grief and ordinary life to coexist. Sensory grounding, brief writing, or movement can help emotion pass without forcing every memory to disappear. Social-media reminders may be limited temporarily. Persistent intense distress, marked functional impairment, or trauma responses may warrant assessment by a qualified mental-health professional. Self-harm risk requires immediate contact with local emergency or crisis services and a trusted person."}, "keywords": ["分手哀伤", "纪念日触发", "情绪应对", "breakup grief", "anniversary trigger", "emotional coping", "breakup", "break", "up", "separation", "split", "分手", "离开", "结束"], "children": ["faq-073", "faq-033"], "cluster": 0}, {"id": "faq-267", "q": {"zh": "如何判断一本情感书籍、课程或网络博主是否可靠？", "en": "How can someone judge whether a relationship book, course, or online creator is reliable?"}, "a": {"zh": "查看作者是否准确公开资质与利益关系，观点是否引用可核验的研究或专业指南，是否承认个体差异与局限，以及是否把相关性夸大为因果。警惕保证复合、操控他人、贬低某个性别、鼓励跟踪测试、伪造稀缺名额或以羞耻恐惧催促高额消费的内容。可靠资源不会替读者诊断，也会在危机、暴力和医疗问题上指向适当专业支持。可交叉核对多方权威来源，并把建议先作为低风险实验而非绝对真理。", "en": "Check whether the author accurately discloses credentials and conflicts, cites verifiable research or professional guidance, acknowledges individual differences and limitations, and     const b = h('button', 'esi-key' + (k === '=' ? ' eq' : /[÷×%^+()\-]|⌫|C/.test(k) ? ' op' : ''), esc(k));
    b.onclick = () => {
      if (k === 'C') disp.value = '';
      else if (k === '⌫') disp.value = disp.value.slice(0, -1);
      else if (k === '=') { const v = evalExpr(disp.value); disp.value = v === null ? 'Error' : String(Math.round(v * 1e10) / 1e10); }
      else disp.value += k;
    };
    grid.append(b);
  });
  card.append(disp, grid, h('div', 'esi-meta', esc(T[LOC].calcTip)));
  return card;
}
function toolJson() {
  const card = h('div', 'esi-card'); card.append(h('div', 'esi-card-title', esc(T[LOC].toolJson)));
  const ta = h('textarea', 'esi-ta'); ta.rows = 4; ta.placeholder = '{"a": 1}';
  const out = h('pre', 'esi-hash'); out.style.display = 'none';
  const btn = h('button', 'esi-btn pri', esc(T[LOC].jsonBtn));
  btn.onclick = () => { out.style.display = 'block'; try { out.textContent = JSON.stringify(JSON.parse(ta.value), null, 2); out.style.color = ''; } catch (e) { out.textContent = '✗ ' + e.message; out.style.color = '#dc2626'; } };
  card.append(ta, btn, out); return card;
}
function toolTs() {
  const card = h('div', 'esi-card'); card.append(h('div', 'esi-card-title', esc(T[LOC].toolTs)));
  const inp = h('input', 'esi-ti'); inp.value = String(Math.floor(Date.now() / 1000));
  const out = h('div', 'esi-row'); const meta = h('span', 'esi-meta');
  const upd = () => { const n2 = /^\d{13}$/.test(inp.value.trim()) ? Number(inp.value) / 1000 : Number(inp.value); if (isFinite(n2) && n2 > 0 && n2 < 4e12) { const d = new Date(n2 * 1000); meta.textContent = d.toISOString().replace('T', ' ').replace(/\..+/, ' UTC · ') + d.toLocaleString(); } else meta.textContent = '—'; };
  inp.oninput = upd; upd(); out.append(h('span', '', 'UTC/Local'), meta);
  const nowB = h('button', 'esi-btn', esc(T[LOC].now)); nowB.onclick = () => { inp.value = String(Math.floor(Date.now() / 1000)); upd(); };
  card.append(inp, out, nowB); return card;
}
function toolUnits() {
  const card = h('div', 'esi-card'); card.append(h('div', 'esi-card-title', esc(T[LOC].toolUnits)));
  const inp = h('input', 'esi-ti'); inp.value = '1';
  const sel = h('select', 'esi-ti'); ['eth', 'gwei', 'wei'].forEach(u => { const o = h('option', '', u); o.value = u; sel.append(o); });
  const rows = h('div');
  const pow = { wei: 0, gwei: 9, eth: 18 };
  const upd = () => { rows.innerHTML = ''; const n2 = Number(inp.value); ['wei', 'gwei', 'eth'].filter(u => u !== sel.value).forEach(u => { const v = n2 * Math.pow(10, pow[sel.value] - pow[u]); const r = h('div', 'esi-row'); r.append(h('span', '', u.toUpperCase()), h('span', 'esi-meta', !isFinite(v) ? '—' : Math.abs(v) >= 1e15 || (v !== 0 && Math.abs(v) < 1e-6) ? v.toExponential(4) : v.toLocaleString('en-US', { maximumFractionDigits: 9 }))); rows.append(r); }); };
  inp.oninput = upd; sel.onchange = upd; upd();
  card.append(inp, sel, rows); return card;
}
function toolStats() {
  const card = h('div', 'esi-card'); card.append(h('div', 'esi-card-title', esc(T[LOC].toolStats)));
  const ta = h('textarea', 'esi-ta'); ta.rows = 3;
  const out = h('div', 'esi-row'); const meta = h('span', 'esi-meta');
  const upd = () => { const s2 = ta.value; const cjk = (s2.match(/[一-鿿]/g) || []).length; meta.textContent = s2.length + ' / ' + ((s2.match(/[a-zA-Z0-9]+/g) || []).length + cjk) + ' / ' + (s2 ? s2.split('\n').length : 0) + ' / ' + new TextEncoder().encode(s2).length; };
  ta.oninput = upd; upd(); out.append(h('span', '', 'chars/words/lines/bytes'), meta);
  const hres = h('div', 'esi-hash'); hres.style.display = 'none';
  const btn = h('button', 'esi-btn pri', esc(T[LOC].statsBtn));
  btn.onclick = async () => { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ta.value)); hres.style.display = 'block'; hres.textContent = '0x' + [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join(''); };
  card.append(ta, out, btn, hres); return card;
}
function showTool(k) {
  const map = { calculator: toolCalc, json: toolJson, timestamp: toolTs, units: toolUnits, textstats: toolStats };
  const label = { calculator: T[LOC].toolCalc, json: T[LOC].toolJson, timestamp: T[LOC].toolTs, units: T[LOC].toolUnits, textstats: T[LOC].toolStats }[k];
  botSay(label + ':', [anchorChip()], map[k]());
}
function reset() { S.visited = []; S.depth = 0; S.fallbackIdx = 0; build(); botSay(PACK.brand.welcome[LOC] || PACK.brand.welcome.en, welcomeChips()); }
build();
botSay(PACK.brand.welcome[LOC] || PACK.brand.welcome.en, welcomeChips());

</script>
