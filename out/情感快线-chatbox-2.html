<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>情感快线 · Assistant</title>
<style>
:root {
  --accent: #C96A8E; --accent-d: color-mix(in srgb, var(--accent) 78%, #000);
  --accent-l: color-mix(in srgb, var(--accent) 8%, #fff); --accent-m: color-mix(in srgb, var(--accent) 27%, #fff);
  --stone: color-mix(in srgb, var(--accent) 14%, #fff);
  --bg: #F6F9FD; --white: #fff; --off: #f1f7fc; --off2: #e8f2fb; --line: #d9e8f4; --line2: #c7dcea;
  --ink: #101827; --ink2: #243044; --ink3: #5f6b82; --ink4: #8d98aa; --ink5: #b7c2d0;
  --mono: ui-monospace, "SF Mono", Menlo, monospace; --sans: -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif;
  --sh-sm: 0 10px 26px color-mix(in srgb, var(--accent) 6%, transparent), 0 1px 3px rgba(16,24,39,.04);
  --sh-md: 0 18px 44px color-mix(in srgb, var(--accent) 10%, transparent), 0 2px 8px rgba(16,24,39,.05);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body { background: var(--bg); font-family: var(--sans); color: var(--ink); line-height: 1.6; }
.esi-app { max-width: 1280px; margin: 0 auto; padding: 14px 28px 22px; height: 100vh; display: flex; flex-direction: column; gap: 12px; }
.esi-header { flex: 0 0 auto; display: flex; align-items: center; gap: 9px; padding: 6px 14px 7px 22px; background: rgba(248,251,255,.92); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 26px color-mix(in srgb, var(--accent) 8%, transparent); backdrop-filter: blur(14px); }
.esi-header > svg { width: 12px; height: 12px; color: var(--accent); flex: 0 0 auto; }
.esi-brand { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--ink2); letter-spacing: .01em; white-space: nowrap; }
.esi-tag { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: var(--stone); border-radius: 3px; padding: 2px 6px; font-weight: 600; line-height: 1.2; }
.esi-tagline { font-size: 10.5px; color: var(--ink4); margin-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.esi-spacer { flex: 1; }
.esi-orb { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line2); background: var(--white); color: var(--ink3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all .15s; font-family: var(--mono); font-size: 8.5px; font-weight: 600; }
.esi-orb svg { width: 11px; height: 11px; }
.esi-orb:hover { color: var(--accent); border-color: var(--accent-m); background: var(--accent-l); transform: translateY(-1px); }
.esi-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 14px; }
.esi-left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.esi-chat { flex: 1; min-height: 0; overflow-y: auto; padding: 22px; background: linear-gradient(180deg, var(--accent-l) 0%, color-mix(in srgb, var(--accent-l) 55%, transparent) 100%); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--sh-sm); scroll-behavior: smooth; }
.esi-chat::-webkit-scrollbar { width: 8px; }
.esi-chat::-webkit-scrollbar-thumb { background: var(--accent-m); border-radius: 8px; }
.esi-msg { display: flex; margin-bottom: 14px; }
.esi-msg.user { justify-content: flex-end; }
.esi-bubble { max-width: 78%; padding: 12px 16px; font-size: 14px; line-height: 1.65; color: var(--ink2); white-space: pre-wrap; word-break: break-word; }
.esi-msg.bot .esi-bubble { background: var(--white); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; box-shadow: var(--sh-sm); }
.esi-msg.user .esi-bubble { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 72%, #7fe3ff) 0%, var(--accent) 100%); color: #fff; border-radius: 16px 4px 16px 16px; box-shadow: 0 10px 26px color-mix(in srgb, var(--accent) 18%, transparent); }
.esi-avatar { flex: 0 0 26px; width: 26px; height: 26px; margin-right: 10px; border-radius: 8px; background: var(--white); border: 1px solid var(--accent-m); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 10px; font-weight: 600; align-self: flex-start; margin-top: 2px; }
.esi-chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 2px 0 16px 36px; }
.esi-chip { font-family: var(--mono); font-size: 11px; padding: 5px 13px; border-radius: 20px; border: 1px solid var(--line2); color: var(--ink3); background: var(--white); cursor: pointer; transition: all .12s; }
.esi-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-l); transform: translateY(-1px); }
.esi-widget { margin: 2px 0 14px 36px; max-width: 78%; }
.esi-card { background: var(--white); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; box-shadow: var(--sh-sm); padding: 12px 14px 13px; }
.esi-card-title { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; color: var(--ink3); border-bottom: 1px solid var(--off2); padding-bottom: 8px; margin-bottom: 9px; }
.esi-composer { flex: 0 0 auto; background: var(--white); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--sh-md); padding: 12px 14px 10px; }
.esi-composer:focus-within { border-color: var(--accent-m); }
.esi-inrow { display: flex; align-items: flex-end; gap: 10px; }
.esi-input { flex: 1; min-height: 24px; max-height: 160px; resize: none; border: 0; outline: none; background: transparent; font-family: var(--sans); font-size: 14px; line-height: 1.6; color: var(--ink); padding: 4px 2px; }
.esi-input::placeholder { color: var(--ink4); }
.esi-send { flex: 0 0 38px; width: 38px; height: 38px; border: 0; border-radius: 12px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, #7ff3ff) -52%, var(--accent) 13%, color-mix(in srgb, var(--accent) 45%, #8fe6ff) 91%); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 28%, transparent); transition: all .18s; }
.esi-send svg { width: 16px; height: 16px; }
.esi-send:hover { transform: translateY(-1px); box-shadow: 0 14px 30px color-mix(in srgb, var(--accent) 36%, transparent); }
.esi-foot { display: flex; align-items: center; gap: 7px; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--off2); }
.esi-mini { font-family: var(--mono); font-size: 10px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--off); color: var(--ink3); cursor: pointer; transition: all .12s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
.esi-mini:hover { color: var(--accent); border-color: var(--accent-m); background: var(--accent-l); }
.esi-ver-wrap { position: relative; margin-left: auto; display: inline-flex; }
.esi-version { font-family: var(--mono); font-size: 10px; color: var(--ink4); letter-spacing: .05em; display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; padding: 3px 6px; border-radius: 6px; cursor: pointer; transition: all .12s; }
.esi-version:hover { color: var(--ink2); background: var(--off); }
.esi-verdot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: esiblink 1.5s infinite; }
@keyframes esiblink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.esi-caret { width: 10px; height: 10px; opacity: .7; }
.esi-ver-backdrop { position: fixed; inset: 0; z-index: 80; }
.esi-ver-menu { position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 90; min-width: 128px; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--white); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--sh-md); }
.esi-ver-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--ink2); padding: 6px 9px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; text-align: left; }
.esi-ver-item svg { width: 11px; height: 11px; color: var(--accent); }
.esi-ver-item:hover { background: var(--accent-l); }
.esi-ver-item.on { color: var(--accent); font-weight: 600; }
.esi-ver-item:disabled { color: var(--ink5); cursor: default; }
.esi-ver-item:disabled:hover { background: transparent; }
.esi-rail { min-height: 0; display: grid; grid-template-rows: 1fr 1fr; gap: 12px; }
.esi-panel { min-height: 0; display: flex; flex-direction: column; background: var(--white); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--sh-sm); overflow: hidden; }
.esi-phead { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; padding: 9px 13px 8px; border-bottom: 1px solid var(--off2); font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; color: var(--ink3); }
.esi-phead svg { width: 12px; height: 12px; color: var(--accent); flex: 0 0 auto; }
.esi-pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 9px 11px; }
.esi-pbody::-webkit-scrollbar { width: 6px; }
.esi-pbody::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; }
.esi-qq { display: block; width: 100%; text-align: left; font-family: var(--sans); font-size: 12.5px; color: var(--ink2); background: var(--off); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; margin-bottom: 7px; cursor: pointer; transition: all .12s; line-height: 1.45; }
.esi-qq:hover { border-color: var(--accent-m); background: var(--accent-l); color: var(--ink); transform: translateX(2px); }
.esi-tool { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font-family: var(--sans); font-size: 12.5px; color: var(--ink2); background: var(--off); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; margin-bottom: 7px; cursor: pointer; transition: all .12s; }
.esi-tool:hover { border-color: var(--accent-m); background: var(--accent-l); transform: translateX(2px); }
.esi-tool.dis { opacity: .45; cursor: default; }
.esi-tool.dis:hover { border-color: var(--line); background: var(--off); transform: none; }
.esi-tool-ico { font-size: 13px; width: 18px; text-align: center; }
.esi-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border: 1px solid var(--off2); background: var(--off); border-radius: 8px; margin-bottom: 6px; font-size: 12px; }
.esi-meta { font-family: var(--mono); font-size: 10px; color: var(--ink4); }
.esi-ti { width: 100%; font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--off); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; margin-bottom: 7px; }
.esi-ti:focus { border-color: var(--accent-m); }
.esi-ta { width: 100%; font-family: var(--mono); font-size: 11px; color: var(--ink2); background: var(--off); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; resize: vertical; margin-bottom: 7px; }
.esi-ta:focus { border-color: var(--accent-m); }
.esi-btn { font-family: var(--sans); font-size: 11px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--off); color: var(--ink3); cursor: pointer; margin-right: 5px; transition: all .12s; }
.esi-btn:hover { color: var(--accent); border-color: var(--accent-m); }
.esi-btn.pri { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 78%, #6fe0ff), var(--accent)); color: #fff; border: 0; font-weight: 600; box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 22%, transparent); }
.esi-hash { font-family: var(--mono); font-size: 10px; color: var(--accent-d); word-break: break-all; background: var(--white); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; margin-top: 5px; }
.esi-grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.esi-key { font-family: var(--mono); font-size: 13px; padding: 9px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--white); color: var(--ink2); cursor: pointer; transition: all .1s; }
.esi-key:hover { border-color: var(--accent-m); background: var(--accent-l); transform: translateY(-1px); }
.esi-key.op { background: var(--off); color: var(--accent-d); }
.esi-key.eq { grid-column: span 2; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 78%, #6fe0ff), var(--accent)); color: #fff; border: 0; font-weight: 700; }
.esi-linkcard { display: flex; gap: 10px; align-items: center; }
.esi-linkcard img { width: 22px; height: 22px; }
.esi-lc-body { flex: 1; min-width: 0; }
.esi-lc-d { font-size: 11.5px; color: var(--ink3); line-height: 1.5; }
.esi-lc-q { font-family: var(--mono); font-size: 10px; color: var(--accent-d); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; }
.esi-open { flex: 0 0 auto; font-family: var(--sans); font-size: 11.5px; font-weight: 600; color: #fff; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 78%, #6fe0ff), var(--accent)); border: 0; border-radius: 9px; padding: 8px 13px; cursor: pointer; box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 22%, transparent); }
.esi-dark { --bg: #0b1322; --white: #111a2c; --off: #0d1524; --off2: #1c2740; --line: #223353; --line2: #2e4468; --ink: #e9f1fc; --ink2: #d2deee; --ink3: #94a6c2; --ink4: #687a9b; --ink5: #495b78; --accent-l: #11233b; --accent-m: #1e4b75; --stone: #16283f; }
.esi-dark .esi-header { background: rgba(13,21,37,.92); }
.esi-dark .esi-chat { background: linear-gradient(180deg, #0f1c31 0%, rgba(12,20,35,.72) 100%); }
@media (max-width: 860px) { .esi-app { height: auto; } .esi-main { grid-template-columns: 1fr; } .esi-chat { min-height: 420px; } .esi-rail { grid-template-rows: none; grid-template-columns: 1fr 1fr; } .esi-panel { min-height: 220px; max-height: 320px; } }
@media (max-width: 560px) { .esi-app { padding: 10px 14px 18px; } .esi-rail { grid-template-columns: 1fr; } .esi-bubble { max-width: 90%; } .esi-widget { max-width: 94%; margin-left: 12px; } }
</style>

<script type="application/json" id="esi-pack">{"brand": {"name": "情感快线", "tagline": {"zh": "关系教育 · 情绪支持 · 沟通成长", "en": "Relationship education · Emotional support · Communication growth"}, "accent": "#C96A8E", "langs": ["zh", "en"], "welcome": {"zh": "你好，这里是情感快线。你可以点下方常见问题，或直接说说你的困扰。本服务提供一般性关系教育与情绪支持，不替代医疗、心理治疗或紧急救援。", "en": "Hi, this is Emotional Express. Tap a question below or just tell me what's on your mind. This service offers general relationship education and emotional support — it does not replace medical care, therapy, or emergency services."}, "anchor": {"label": {"zh": "常见问题 ↗", "en": "Popular questions ↗"}, "action": "faq", "target": "faq-001"}}, "faq": [{"id": "faq-001", "q": {"zh": "情感快线是一家什么样的公司？", "en": "What kind of company is Emotional Express (情感快线)?"}, "a": {"zh": "情感快线是一家围绕亲密关系、个人情绪困扰与关系成长提供咨询、教育和信息支持的情感咨询公司。服务旨在帮助来访者梳理处境、理解需求并制定可执行的沟通与自我照顾方案，不替代医疗诊断、心理治疗、法律服务或紧急救援。", "en": "Emotional Express is an emotional counseling company that offers consultation, education, and informational support for intimate relationships, emotional concerns, and relational growth. Its services help clients clarify their situations, understand their needs, and develop practical communication and self-care plans; they do not replace medical diagnosis, psychotherapy, legal services, or emergency response."}, "keywords": ["公司简介", "服务定位", "company overview", "service scope"], "children": ["faq-002", "faq-004"], "cluster": 0}, {"id": "faq-002", "q": {"zh": "情感快线主要提供哪些服务？", "en": "What services does Emotional Express mainly provide?"}, "a": {"zh": "常见服务方向可包括一对一关系咨询、伴侣沟通支持、分手适应、个人情绪梳理、关系教育课程及主题工作坊。具体项目、提供方式和适用范围可能调整，请以情感快线官方渠道当期确认的信息为准。", "en": "Common offerings may include one-to-one relationship consultations, couple communication support, breakup adjustment, individual emotional reflection, relationship education, and themed workshops. Programs, delivery formats, and eligibility may change, so please confirm current details through Emotional Express's official channels."}, "keywords": ["服务项目", "一对一咨询", "工作坊", "services", "consultation", "workshops"], "children": ["faq-004", "faq-001"], "cluster": 0}, {"id": "faq-003", "q": {"zh": "哪些人适合使用情感快线的服务？", "en": "Who may benefit from Emotional Express's services?"}, "a": {"zh": "希望改善沟通、理解关系模式、适应关系变化或提升自我觉察的个人与伴侣，都可能从服务中获益。若存在严重精神或身体症状、暴力风险、自伤风险或其他紧急情况，应优先联系当地急救、警方、危机干预热线或具备相应资质的医疗和心理健康专业人员。", "en": "Individuals and couples who want to improve communication, understand relationship patterns, adjust to relational changes, or build self-awareness may benefit. If there are severe mental or physical symptoms, violence, self-harm risk, or another emergency, contact local emergency services, police, a crisis line, or an appropriately qualified medical or mental health professional first."}, "keywords": ["适用人群", "风险分流", "clients", "eligibility", "crisis referral"], "children": ["faq-002", "faq-250"], "cluster": 0}, {"id": "faq-004", "q": {"zh": "情感快线采用什么业务模式？", "en": "What business model does Emotional Express use?"}, "a": {"zh": "情感快线通常以按次或按方案提供咨询与关系教育服务，并可能提供课程、工作坊等产品；实际模式以官方公布为准。公司收取的是约定服务的费用，不以操控第三方、保证复合或承诺某种关系结果为商业前提。", "en": "Emotional Express generally provides consultations and relationship education by session or service plan and may also offer courses or workshops; the current model should be confirmed officially. Fees cover the agreed service, not control over another person, a guaranteed reconciliation, or any promised relationship outcome."}, "keywords": ["业务模式", "服务方案", "不保证结果", "business model", "service plans", "no guarantee"], "children": ["faq-002", "faq-001"], "cluster": 0}, {"id": "faq-005", "q": {"zh": "服务是线上还是线下进行？", "en": "Are services provided online or in person?"}, "a": {"zh": "服务可能通过线上语音、视频、文字或符合条件的线下方式提供。具体渠道、地点、技术要求与可预约时段会因项目和地区而异，请在预约前通过官方渠道确认。", "en": "Services may be delivered by online voice, video, text, or eligible in-person formats. Channels, locations, technical requirements, and appointment availability vary by program and region, so confirm them through official channels before booking."}, "keywords": ["线上咨询", "线下咨询", "服务方式", "online counseling", "in-person", "delivery format"], "children": ["faq-011", "faq-023"], "cluster": 1}, {"id": "faq-006", "q": {"zh": "我该如何开始咨询？", "en": "How do I begin a consultation?"}, "a": {"zh": "可先通过情感快线的官方渠道提交基本需求，例如困扰主题、希望改善的目标、偏好的服务方式与可预约时间。工作人员通常会说明服务边界、可选方案和下一步；在付款或提供敏感信息前，请核对渠道真实性与适用条款。", "en": "Start through an official Emotional Express channel and share basic needs such as the concern, desired goals, preferred format, and availability. Staff will generally explain service boundaries, available options, and next steps; verify the channel and applicable terms before paying or sharing sensitive information."}, "keywords": ["开始咨询", "预约", "官方渠道", "getting started", "booking", "official channel", "book", "appointment", "schedule", "session", "start", "get", "started", "sign", "up"], "children": ["faq-007", "faq-011"], "cluster": 0}, {"id": "faq-007", "q": {"zh": "情感快线如何为我匹配咨询人员？", "en": "How does Emotional Express match me with a consultant?"}, "a": {"zh": "匹配通常会参考你的咨询主题、目标、语言、时间、服务形式偏好及当前人员的可用性。你可在开始前询问咨询人员的相关背景、工作方式与服务边界；具体匹配机制和人员信息以官方确认及适用法律要求为准。", "en": "Matching generally considers your topic, goals, language, schedule, preferred format, and staff availability. Before starting, you may ask about the consultant's relevant background, approach, and service boundaries; the exact matching process and provider information are subject to official confirmation and applicable law."}, "keywords": ["咨询匹配", "咨询人员", "背景核验", "consultant matching", "provider background"], "children": ["faq-239", "faq-006"], "cluster": 0}, {"id": "faq-008", "q": {"zh": "咨询人员都具备哪些资历？", "en": "What qualifications do the consultants have?"}, "a": {"zh": "不同岗位和服务项目所需的教育、培训、经验或专业资质可能不同，不应仅凭“情感咨询师”等称谓推定某项法定执业资格。预约前可向官方渠道索取与你所选服务相关的背景说明；如需诊断或治疗，应另行寻找当地依法具备资质的医疗或心理健康专业人员。", "en": "Education, training, experience, and professional credentials may differ by role and service, and a title such as “relationship consultant” should not be assumed to confer a regulated clinical license. Ask an official channel for background information relevant to your chosen service; for diagnosis or treatment, use a locally licensed medical or mental health professional."}, "keywords": ["人员资历", "资质核验", "执业边界", "qualifications", "credential verification", "scope of practice"], "children": ["faq-227", "faq-002"], "cluster": 0}, {"id": "faq-009", "q": {"zh": "情感咨询与心理治疗有什么区别？", "en": "How is emotional counseling different from psychotherapy?"}, "a": {"zh": "情感咨询通常聚焦当前关系困扰、沟通技巧、目标澄清与行动支持；心理治疗则可能涉及精神健康评估、诊断与有临床依据的治疗，并受当地专业法规约束。两者可能有部分主题重叠，但不能互相替代；不确定时可先接受适当的专业评估。", "en": "Emotional counseling usually focuses on current relationship concerns, communication skills, goal clarification, and practical support. Psychotherapy may involve mental health assessment, diagnosis, and clinically grounded treatment under local professional regulation. Topics may overlap, but the services are not interchangeable; seek an appropriate professional assessment if unsure."}, "keywords": ["情感咨询", "心理治疗", "服务边界", "emotional counseling", "psychotherapy", "distinction"], "children": ["faq-232", "faq-247"], "cluster": 0}, {"id": "faq-010", "q": {"zh": "情感快线能保证复合、结婚或挽回成功吗？", "en": "Can Emotional Express guarantee reconciliation, marriage, or winning someone back?"}, "a": {"zh": "不能。关系结果取决于多方意愿、行为和现实条件，任何咨询都无法控制他人的决定；服务可以帮助你看清选择、改善可控的沟通行为并为不同结果做好准备。对“百分百成功”或要求操纵、骚扰他人的承诺应保持警惕。", "en": "No. Relationship outcomes depend on multiple people's choices, behavior, and circumstances, and no consultation can control another person's decision. The service can help clarify options, improve communication within your control, and prepare for different outcomes. Be cautious of “100% success” claims or tactics involving manipulation or harassment."}, "keywords": ["结果预期", "复合", "反操控", "outcomes", "reconciliation", "no guarantee", "reconcile", "get", "back", "together", "win", "marriage", "divorce", "wedding"], "children": ["faq-234", "faq-179"], "cluster": 0}, {"id": "faq-011", "q": {"zh": "情感快线提供哪些语言的服务？", "en": "Which languages are available for services?"}, "a": {"zh": "可用语言取决于当期团队配置和具体项目，不能从本知识库推定实时可用情况。请在预约时说明你的语言需求，并以官方确认的匹配结果为准；如需翻译或无障碍沟通，也可提前提出。", "en": "Language availability depends on current staffing and the specific program and cannot be inferred from this knowledge base. State your language needs when booking and rely on official confirmation of a suitable match; request interpretation or communication accommodations in advance if needed."}, "keywords": ["服务语言", "翻译", "语言偏好", "service languages", "interpretation", "language preference"], "children": ["faq-006", "faq-017"], "cluster": 0}, {"id": "faq-012", "q": {"zh": "情感快线可以服务哪些地区的客户？", "en": "In which regions can Emotional Express serve clients?"}, "a": {"zh": "服务覆盖范围可能受人员配置、平台能力、跨境数据规则和当地法律限制。请提供你实际所在的国家或地区，由官方渠道确认是否可服务、适用何种条款以及紧急资源如何衔接。", "en": "Service coverage may be limited by staffing, platform capability, cross-border data rules, and local law. Share the country or region where you are physically located so an official channel can confirm eligibility, applicable terms, and how local emergency resources would be accessed."}, "keywords": ["服务地区", "跨境服务", "适用法律", "service regions", "cross-border", "applicable law"], "children": ["faq-006", "faq-218"], "cluster": 0}, {"id": "faq-013", "q": {"zh": "未成年人可以使用情感快线的服务吗？", "en": "Can minors use Emotional Express's services?"}, "a": {"zh": "未成年人是否可使用服务，以及是否需要监护人同意，取决于年龄、服务类型、所在地法律与公司的未成年人保护政策。应由官方渠道逐案确认；若涉及虐待、性侵、自伤或即时危险，应优先联系可信赖的成年人、当地儿童保护机构或紧急服务。", "en": "Whether a minor may use a service, and whether guardian consent is required, depends on age, service type, local law, and the company's child-safeguarding policy. Official confirmation is required case by case. For abuse, sexual violence, self-harm, or immediate danger, contact a trusted adult, local child protection service, or emergency service first."}, "keywords": ["未成年人", "监护人同意", "儿童保护", "minors", "guardian consent", "safeguarding"], "children": ["faq-214", "faq-219"], "cluster": 0}, {"id": "faq-014", "q": {"zh": "可以一个人咨询伴侣关系问题吗？", "en": "Can I seek help about a couple issue on my own?"}, "a": {"zh": "可以。即使伴侣暂时不愿参与，你仍可梳理自己的感受、边界、沟通选择与下一步行动；但咨询人员无法替缺席的一方下结论，也不能保证对方改变。", "en": "Yes. Even if your partner does not wish to participate, you can explore your feelings, boundaries, communication choices, and next steps. The consultant cannot draw conclusions for the absent partner or guarantee that person will change."}, "keywords": ["个人咨询", "伴侣问题", "可控行动", "individual consultation", "couple concerns", "agency", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-062", "faq-079"], "cluster": 2}, {"id": "faq-015", "q": {"zh": "情感快线支持多元性别与性取向的客户吗？", "en": "Does Emotional Express support clients of diverse genders and sexual orientations?"}, "a": {"zh": "服务应以尊重、自愿和不歧视为基本原则，并避免把性别认同或性取向本身病理化。若你有称谓、代词、隐私或匹配偏好，可在预约时说明；具体可用人员与服务安排以官方确认和适用法律为准。", "en": "Services should be grounded in respect, consent, and non-discrimination, without pathologizing gender identity or sexual orientation. Share preferences regarding names, pronouns, privacy, or provider matching when booking; staffing and service arrangements remain subject to official confirmation and applicable law."}, "keywords": ["多元性别", "性取向", "包容服务", "LGBTQ+", "inclusion", "non-discrimination"], "children": ["faq-231", "faq-154"], "cluster": 0}, {"id": "faq-016", "q": {"zh": "异地或跨国伴侣可以一起咨询吗？", "en": "Can long-distance or international couples consult together?"}, "a": {"zh": "在平台、时区、语言和当地规则允许的情况下，可能可以通过线上方式共同参与。预约时应说明双方所在地、可用时间与隐私条件，由官方确认服务资格、数据处理方式和可行安排。", "en": "Joint online participation may be possible when platform, time-zone, language, and local rules permit. At booking, disclose both locations, availability, and privacy conditions so the company can confirm eligibility, data handling, and a workable arrangement."}, "keywords": ["异地伴侣", "跨国咨询", "时区", "long-distance couples", "international service", "time zones", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-011", "faq-249"], "cluster": 0}, {"id": "faq-017", "q": {"zh": "一次咨询通常多长时间？", "en": "How long does a consultation usually last?"}, "a": {"zh": "时长会因服务形式、咨询人数和所选项目而异，本知识库不设定固定分钟数。请在预约前查看官方服务说明，并确认开始与结束时间、迟到处理及是否允许延时。", "en": "Length varies by format, number of participants, and selected program; this knowledge base does not establish a fixed duration. Review the official service description before booking and confirm start and end times, late-arrival rules, and whether extensions are possible."}, "keywords": ["咨询时长", "预约规则", "session length", "booking terms"], "children": ["faq-011", "faq-233"], "cluster": 0}, {"id": "faq-018", "q": {"zh": "我需要咨询多少次？", "en": "How many consultations will I need?"}, "a": {"zh": "次数取决于问题复杂度、目标、双方投入与实际变化，没有适用于所有人的固定答案。可先设定一个短期目标和复盘节点，再与咨询人员共同评估继续、暂停、转介或结束；不应因已购买方案而忽视自身意愿和需要。", "en": "The number depends on complexity, goals, engagement, and real-world change, so there is no universal answer. Set a short-term goal and review point, then decide with the consultant whether to continue, pause, refer, or finish; a purchased plan should not override your consent or needs."}, "keywords": ["咨询次数", "目标评估", "结束咨询", "number of sessions", "goal review", "ending services"], "children": ["faq-020", "faq-073"], "cluster": 0}, {"id": "faq-019", "q": {"zh": "如果我和咨询人员不合适，可以更换吗？", "en": "Can I change consultants if the match does not feel right?"}, "a": {"zh": "可以向官方服务团队说明不匹配的具体原因，例如沟通风格、专业方向、时间或边界问题，并询问更换或转介选项。能否更换、剩余服务如何处理及是否产生费用，应以预约时适用的官方条款为准。", "en": "You may tell the official service team why the fit is not working, such as communication style, topic expertise, scheduling, or boundary concerns, and ask about reassignment or referral. Availability, handling of unused services, and any fees depend on the official terms applicable to your booking."}, "keywords": ["更换咨询人员", "匹配度", "转介", "changing consultants", "fit", "referral"], "children": ["faq-007", "faq-006"], "cluster": 0}, {"id": "faq-020", "q": {"zh": "第一次咨询前需要准备什么？", "en": "How should I prepare for my first consultation?"}, "a": {"zh": "可简要写下最困扰你的事件、希望获得的帮助、已经尝试过的方法以及一个可观察的短期目标。选择私密且网络稳定的环境，并提前阅读服务说明；无需准备“完美叙述”，不知道从哪里说起也可以直接告诉咨询人员。", "en": "Briefly note the main concern, the help you want, what you have tried, and one observable short-term goal. Choose a private setting with a stable connection and read the service information in advance. You do not need a perfect story; it is fine to say you do not know where to begin."}, "keywords": ["首次咨询", "咨询准备", "目标设定", "first session", "preparation", "goal setting"], "children": ["faq-242", "faq-006"], "cluster": 0}, {"id": "faq-021", "q": {"zh": "预约时需要提供哪些个人信息？", "en": "What personal information is required when booking?"}, "a": {"zh": "通常只应收集完成预约、联系、支付、风险评估和依法合规所必需的信息，具体字段以官方隐私告知为准。提供前可询问用途、保存期限、访问权限及是否为必填；不要通过无法核验的账号发送身份证件、财务密码或其他非必要敏感信息。", "en": "Only information necessary for booking, contact, payment, risk screening, and legal compliance should generally be collected; exact fields are governed by the official privacy notice. Before sharing, ask about purpose, retention, access, and whether each field is mandatory. Do not send identity documents, financial passwords, or unnecessary sensitive data to an unverified account."}, "keywords": ["个人信息", "数据最小化", "预约资料", "personal data", "data minimization", "booking information", "book", "booking", "appointment", "schedule", "session", "start", "get", "started"], "children": ["faq-225", "faq-211"], "cluster": 0}, {"id": "faq-022", "q": {"zh": "咨询会被录音、录像或保存聊天记录吗？", "en": "Are consultations recorded or are chat logs retained?"}, "a": {"zh": "是否记录取决于服务形式、明确告知、你的有效同意、公司政策与适用法律，不应默认秘密录音或录像。开始前应确认记录类型、用途、保存期限、访问者和撤回同意方式；你也应先取得相关人员同意，再自行录制。", "en": "Recording depends on the format, clear notice, valid consent, company policy, and applicable law; covert audio or video recording should not be assumed. Before starting, confirm the record type, purpose, retention period, access, and how to withdraw consent. Obtain all required consent before making your own recording as well."}, "keywords": ["录音录像", "聊天记录", "知情同意", "recording", "chat logs", "informed consent"], "children": ["faq-216", "faq-219"], "cluster": 0}, {"id": "faq-023", "q": {"zh": "咨询结束后会有跟进支持吗？", "en": "Is follow-up support available after a consultation?"}, "a": {"zh": "部分服务可能包含总结、练习建议或约定范围内的后续沟通，但并非所有项目都提供随时回复。请在购买前确认跟进内容、渠道、期限和响应边界；若出现紧急风险，不要等待普通咨询回复，应立即使用当地紧急资源。", "en": "Some services may include a summary, suggested exercises, or follow-up communication within agreed limits, but not every program offers on-demand replies. Confirm content, channel, duration, and response boundaries before purchase. In an emergency, do not wait for routine consultation messages; use local emergency resources immediately."}, "keywords": ["跟进支持", "响应边界", "紧急资源", "follow-up", "response limits", "emergency resources", "分手", "离开", "结束"], "children": ["faq-005", "faq-006"], "cluster": 1}, {"id": "faq-024", "q": {"zh": "情感快线会使用人工智能提供服务吗？", "en": "Does Emotional Express use artificial intelligence in its services?"}, "a": {"zh": "人工智能可能被用于常见问题检索、内容辅助、预约分流或其他明确说明的场景，实际用途以官方告知为准。AI输出可能不完整或出错，不应独立用于诊断、危机判断或重大人生决定；涉及个人数据时，应查看相关隐私说明并保留人工复核渠道。", "en": "AI may be used for FAQ retrieval, content assistance, intake routing, or other disclosed purposes, subject to official notice. AI output can be incomplete or wrong and should not independently determine diagnosis, crisis response, or major life decisions. Review the relevant privacy notice when personal data is involved and retain access to human review."}, "keywords": ["人工智能", "人工复核", "AI风险", "artificial intelligence", "human review", "AI limitations"], "children": ["faq-027", "faq-013"], "cluster": 0}, {"id": "faq-025", "q": {"zh": "如果我对服务不满意，如何反馈或投诉？", "en": "How can I give feedback or complain about a service?"}, "a": {"zh": "请通过可核验的官方客服或投诉渠道，提供订单或预约信息、发生时间、事实经过和希望得到的处理，并保留相关记录。处理流程、时限及申诉方式以公司公布和适用法律为准；如涉及违法、歧视、骚扰或人身安全，可同时向当地有权机构求助。", "en": "Use a verifiable official customer-service or complaint channel and provide booking or order details, timing, a factual account, and the resolution sought; keep relevant records. Procedures, timelines, and appeals follow published terms and applicable law. For suspected illegality, discrimination, harassment, or safety threats, you may also contact the appropriate local authority."}, "keywords": ["投诉", "服务反馈", "申诉", "complaints", "feedback", "escalation"], "children": ["faq-240", "faq-211"], "cluster": 3}, {"id": "faq-026", "q": {"zh": "情感快线是否提供企业、学校或社区合作项目？", "en": "Does Emotional Express offer programs for companies, schools, or communities?"}, "a": {"zh": "可能可提供关系沟通、压力与边界教育等讲座、工作坊或定制内容，但具体主题、讲师、受众保护措施和交付方式需另行确认。合作方应在签约前核对内容性质、人员背景、隐私安排、未成年人保护要求及适用法律。", "en": "Lectures, workshops, or tailored content on relationship communication, stress, and boundaries may be available, but topics, facilitators, audience safeguards, and delivery require confirmation. Before contracting, organizations should verify the nature of the content, provider background, privacy arrangements, child safeguards, and applicable law."}, "keywords": ["机构合作", "讲座", "社区教育", "organizational programs", "lectures", "community education"], "children": ["faq-002", "faq-004"], "cluster": 0}, {"id": "faq-027", "q": {"zh": "情感快线会发布关系教育内容吗？", "en": "Does Emotional Express publish relationship education content?"}, "a": {"zh": "公司可能通过文章、短视频、直播或课程提供一般性关系教育，具体平台和更新安排以官方渠道为准。公开内容面向一般信息场景，无法考虑个人全部背景，不应作为诊断、治疗、法律意见或紧急处置方案。", "en": "The company may provide general relationship education through articles, short videos, livestreams, or courses; platforms and schedules are subject to official confirmation. Public content cannot account for an individual's full circumstances and is not diagnosis, treatment, legal advice, or an emergency response plan."}, "keywords": ["科普内容", "关系教育", "内容边界", "educational content", "relationship education", "disclaimer"], "children": ["faq-004", "faq-001"], "cluster": 0}, {"id": "faq-028", "q": {"zh": "有听力、视力、行动或其他无障碍需求时怎么办？", "en": "What if I have hearing, vision, mobility, or other accessibility needs?"}, "a": {"zh": "请在预约前说明你需要的合理便利，例如文字沟通、字幕、陪同安排或场地无障碍信息。团队会根据服务形式、资源和法律要求确认可行性；如当前无法满足，也可请求合适的替代方案或转介。", "en": "Before booking, describe any reasonable accommodation you need, such as text communication, captions, support-person arrangements, or venue accessibility information. The team will confirm feasibility based on format, resources, and legal requirements; if a need cannot be met, ask about an appropriate alternative or referral."}, "keywords": ["无障碍", "合理便利", "服务可及性", "accessibility", "accommodations", "inclusive access"], "children": ["faq-223", "faq-019"], "cluster": 4}, {"id": "faq-029", "q": {"zh": "如何辨别情感快线的官方账号和服务人员？", "en": "How can I verify Emotional Express's official accounts and service staff?"}, "a": {"zh": "应从公司已核验的官方网站、应用内入口或正式公布的联系方式交叉确认账号、收款主体和人员身份。不要仅凭头像、群聊邀请或私人转账要求判断真伪；对索要验证码、账户密码、裸照或大额紧急汇款的请求，应立即停止互动并向官方核实。", "en": "Cross-check accounts, payment recipients, and staff identities through a verified company website, in-app entry, or formally published contact method. Do not rely only on an avatar, group invitation, or private transfer request. Stop and verify any request for verification codes, passwords, intimate images, or an urgent large payment."}, "keywords": ["官方账号", "防诈骗", "身份核验", "official accounts", "fraud prevention", "identity verification"], "children": ["faq-027", "faq-006"], "cluster": 0}, {"id": "faq-030", "q": {"zh": "情感快线能处理紧急危机吗？", "en": "Can Emotional Express handle an emergency crisis?"}, "a": {"zh": "普通情感咨询不是全天候紧急服务，也不能替代急救、警方、医院或专业危机干预。若你或他人正面临自伤、他伤、暴力、失踪或其他即时危险，请立即联系所在地紧急服务或危机热线，前往安全地点，并在可行时通知可信赖的人；之后再考虑非紧急咨询支持。", "en": "Routine emotional counseling is not a 24/7 emergency service and cannot replace emergency medical care, police, hospitals, or specialist crisis intervention. If you or someone else faces immediate risk of self-harm, harm to others, violence, disappearance, or another urgent danger, contact local emergency services or a crisis line now, move to a safer place, and alert a trusted person when possible; non-emergency consultation can follow later."}, "keywords": ["紧急危机", "安全计划", "紧急服务", "emergency crisis", "safety plan", "emergency services ================================================================================", "safety", "crisis", "emergency", "self", "harm", "suicide", "domestic", "violence"], "children": ["faq-166", "faq-270"], "cluster": 0}, {"id": "faq-031", "q": {"zh": "一段出现问题的关系还能修复吗？", "en": "Can a troubled relationship still be repaired?"}, "a": {"zh": "有些关系能在双方自愿、持续投入并承担责任的前提下改善，但没有人能保证结果。可先评估安全、尊重、信任、改变意愿与现实条件，再设定具体可观察的小目标；若存在暴力、胁迫或持续伤害，安全与边界应优先于维持关系。", "en": "Some relationships improve when both people participate voluntarily, remain engaged, and take responsibility, but no outcome can be guaranteed. Assess safety, respect, trust, willingness to change, and practical circumstances, then set small observable goals. When violence, coercion, or ongoing harm is present, safety and boundaries take priority over preserving the relationship."}, "keywords": ["关系修复", "双方意愿", "安全优先", "relationship repair", "mutual willingness", "safety first"], "children": ["faq-046", "faq-249"], "cluster": 5}, {"id": "faq-032", "q": {"zh": "刚分手时，我应该先做什么？", "en": "What should I do first after a breakup?"}, "a": {"zh": "先照顾基本状态：保持饮水和进食、尽量规律睡眠、减少酒精或冲动行为，并联系一位可信赖的人。暂缓在情绪高峰时做重大决定或连续联系对方，把注意力放在接下来二十四小时能完成的小事；若无法维持日常功能或出现自伤想法，应及时寻求专业或紧急支持。", "en": "Begin with basic care: drink water, eat, maintain sleep as best you can, limit alcohol and impulsive behavior, and contact one trusted person. Delay major decisions and repeated messages during an emotional peak, focusing instead on manageable tasks for the next 24 hours. Seek professional or emergency support if you cannot function or have thoughts of self-harm."}, "keywords": ["分手", "急性情绪", "自我照顾", "breakup", "acute distress", "self-care", "break", "up", "separation", "split", "离开", "结束"], "children": ["faq-246", "faq-074"], "cluster": 6}, {"id": "faq-033", "q": {"zh": "分手后一定要“断联”吗？", "en": "Is “no contact” always necessary after a breakup?"}, "a": {"zh": "不一定。短期减少联系可能帮助情绪稳定和恢复边界，但共同育儿、财务或工作往来可能需要有限而清晰的沟通；可根据安全、恢复目标和现实责任决定，并约定渠道、频率与话题。断联不应被用作惩罚、操控或逼迫复合的策略。", "en": "Not always. Temporarily reducing contact may support emotional stability and boundaries, while co-parenting, finances, or work may require limited, clear communication. Decide based on safety, recovery goals, and practical duties, with agreed channels, frequency, and topics. No contact should not be used as punishment, manipulation, or pressure to reconcile."}, "keywords": ["断联", "分手恢复", "沟通边界", "no contact", "breakup recovery", "communication boundaries", "breakup", "break", "up", "separation", "split", "分手", "离开", "结束"], "children": ["faq-236", "faq-060"], "cluster": 0}, {"id": "faq-034", "q": {"zh": "我想复合，应该怎样判断是否值得尝试？", "en": "How can I decide whether reconciliation is worth trying?"}, "a": {"zh": "可区分“想念熟悉感”和“关系条件真的改变”，回顾分手原因、双方责任、具体改变证据、信任和安全状况。若双方都能自由表达意愿，可先进行一次低压力对话并设定观察期；如果对方明确拒绝，应尊重决定，停止施压、追踪或反复联系。", "en": "Distinguish missing familiarity from genuine change in relationship conditions. Review the reasons for the breakup, each person's responsibility, evidence of change, trust, and safety. If both can freely express consent, consider one low-pressure conversation and an observation period. If the other person clearly declines, respect the decision and stop pressure, monitoring, or repeated contact."}, "keywords": ["复合评估", "尊重拒绝", "改变证据", "reconciliation", "respecting refusal", "evidence of change", "reconcile", "get", "back", "together", "win", "复合", "挽回", "和好"], "children": ["faq-162", "faq-127"], "cluster": 7}, {"id": "faq-035", "q": {"zh": "信任破裂后可以重建吗？", "en": "Can trust be rebuilt after it has been broken?"}, "a": {"zh": "信任可能通过诚实、可验证的一致行为、承担影响和足够时间逐步重建，而不是靠一次保证恢复。双方可明确需要修复的具体行为、合理透明度、隐私边界和复盘节点；受伤一方有权不原谅或不继续关系。", "en": "Trust may be rebuilt gradually through honesty, verifiable consistency, accountability for impact, and time—not through a single promise. Clarify the behaviors needing repair, reasonable transparency, privacy boundaries, and review points. The hurt partner retains the right not to forgive or continue the relationship."}, "keywords": ["信任重建", "责任承担", "一致行动", "rebuilding trust", "accountability", "consistency", "trust", "jealousy", "checking", "phone", "insecure", "信任", "安全感", "查手机"], "children": ["faq-259", "faq-127"], "cluster": 8}, {"id": "faq-036", "q": {"zh": "发现伴侣出轨后该怎么办？", "en": "What should I do after discovering a partner's infidelity?"}, "a": {"zh": "先确保当下安全并给自己时间稳定，不必立即决定留下或离开。可获取与健康、财务和共同生活有关的必要事实，同时避免报复、公开羞辱或非法获取信息；如涉及性健康、财产或法律权益，可分别咨询合格的医疗或法律专业人员，情感咨询可辅助梳理感受与选择。", "en": "First ensure immediate safety and allow time to stabilize; you do not have to decide at once whether to stay or leave. Gather facts necessary for health, finances, and shared life without retaliation, public humiliation, or unlawful access to information. Consult qualified medical or legal professionals for sexual health, property, or legal rights; emotional counseling can help process feelings and choices."}, "keywords": ["出轨", "背叛创伤", "决策支持", "infidelity", "betrayal", "decision support", "cheating", "affair", "unfaithful", "外遇", "背叛", "劈腿", "第三者", "小三"], "children": ["faq-177", "faq-033"], "cluster": 0}, {"id": "faq-037", "q": {"zh": "我总是吃醋，怎样改善？", "en": "How can I manage frequent jealousy?"}, "a": {"zh": "先识别触发事件、身体反应、自动想法和冲动，把“我感到不安”与“对方一定做错了”区分开。待情绪下降后，用具体事实和请求沟通，并建立双方同意的边界；查看手机、限制社交或威胁对方不是健康的安全感来源。", "en": "Identify triggers, bodily reactions, automatic thoughts, and urges, separating “I feel insecure” from “my partner must be doing something wrong.” When calmer, communicate using specific facts and requests and agree on mutual boundaries. Checking devices, restricting social contact, or making threats is not a healthy route to security."}, "keywords": ["嫉妒", "情绪识别", "控制行为", "jealousy", "emotional awareness", "controlling behavior", "trust", "checking", "phone", "insecure"], "children": ["faq-186", "faq-066"], "cluster": 9}, {"id": "faq-038", "q": {"zh": "我在关系中很焦虑、总怕被抛弃，怎么办？", "en": "What can I do if I feel anxious and fear abandonment in relationships?"}, "a": {"zh": "可记录哪些情境触发担忧，练习延迟反复确认的冲动，并用清晰请求替代猜测，例如约定何时回复而非要求随时在线。同时维持朋友、兴趣、睡眠和个人目标，扩大安全感来源；若焦虑持续严重、伴有惊恐或显著影响生活，可寻求具备资质的心理健康评估与治疗。", "en": "Track situations that trigger worry, practice delaying repeated reassurance-seeking, and replace guessing with clear requests, such as agreeing on response expectations rather than demanding constant availability. Maintain friendships, interests, sleep, and personal goals to diversify sources of security. If anxiety is severe, persistent, includes panic, or significantly impairs life, seek assessment and treatment from a qualified mental health professional."}, "keywords": ["依恋焦虑", "害怕被抛弃", "安全感", "attachment anxiety", "abandonment fear", "security", "anxiety", "anxious", "insecurity", "worry", "overthinking", "焦虑", "不安", "患得患失"], "children": ["faq-196", "faq-054"], "cluster": 10}, {"id": "faq-039", "q": {"zh": "伴侣一有矛盾就回避，我该怎么沟通？", "en": "How should I communicate with a partner who withdraws during conflict?"}, "a": {"zh": "可在平静时讨论“暂停规则”：任何一方需要空间时说明原因、预计恢复时间和重新沟通的具体时点。降低追问强度，一次只谈一个问题，同时区分短暂调节与长期冷暴力；如果对方持续拒绝任何沟通，你可以明确自己的底线和可接受期限。", "en": "During a calm moment, agree on a pause rule: when either person needs space, they state why, estimate the break, and name a specific time to resume. Reduce pursuit, discuss one issue at a time, and distinguish temporary regulation from prolonged silent treatment. If the partner consistently refuses all dialogue, clarify your own limits and acceptable timeframe."}, "keywords": ["回避沟通", "暂停规则", "冷处理", "conflict withdrawal", "time-out", "silent treatment", "沟通", "吵架", "争吵", "冲突", "矛盾", "伴侣", "情侣", "夫妻"], "children": ["faq-040", "faq-042"], "cluster": 11}, {"id": "faq-040", "q": {"zh": "我们总在重复同一种争吵，如何打破循环？", "en": "How can we break a recurring argument cycle?"}, "a": {"zh": "把焦点从“谁对谁错”转向循环本身，画出触发点、各自解读、反应及后果，例如一方追问、另一方退缩。双方各选择一个能打断循环的小动作，如降低音量、复述对方重点或暂停二十分钟后回来，并在事后复盘哪些做法有效。", "en": "Shift attention from who is right to the cycle itself by mapping the trigger, each interpretation, response, and consequence—for example, one pursues while the other withdraws. Each person can choose one small interruption, such as lowering their voice, reflecting the other's point, or returning after a 20-minute break, then review what helped."}, "keywords": ["争吵循环", "互动模式", "冲突复盘", "conflict cycle", "interaction pattern", "debrief", "沟通", "吵架", "争吵", "冲突", "矛盾"], "children": ["faq-039", "faq-157"], "cluster": 11}, {"id": "faq-041", "q": {"zh": "怎样表达感受而不让对方觉得被指责？", "en": "How can I express feelings without sounding accusatory?"}, "a": {"zh": "可使用“当具体事情发生时，我感到……，因为我需要……，我希望我们能……”的结构，并只描述可观察的行为。避免“你总是”“你从不”以及揣测动机，表达后邀请对方复述和回应；温和表达能提高对话机会，但不能保证对方同意。", "en": "Try: “When this specific thing happens, I feel…, because I need…, and I would like us to…,” describing only observable behavior. Avoid “you always,” “you never,” and assumed motives, then invite the other person to reflect and respond. A gentle approach improves the chance of dialogue but cannot guarantee agreement."}, "keywords": ["非指责沟通", "感受表达", "具体请求", "non-blaming communication", "feelings", "clear requests"], "children": ["faq-096", "faq-101"], "cluster": 12}, {"id": "faq-042", "q": {"zh": "伴侣冷战或拒绝回应时，我该怎么办？", "en": "What should I do when my partner gives me the silent treatment or refuses to respond?"}, "a": {"zh": "先确认对方是在短暂调节，还是以沉默惩罚和控制。可发出一次清晰、低压力的邀请，说明希望讨论的主题和可选时间，然后停止反复追逐；若长期拒绝沟通成为固定模式，可设定边界、寻求共同咨询或评估这段关系是否满足基本尊重。", "en": "First distinguish a temporary regulation break from silence used to punish or control. Make one clear, low-pressure invitation naming the topic and possible times, then stop repeated pursuit. If chronic refusal becomes the norm, set boundaries, consider joint counseling, or assess whether the relationship meets basic standards of respect."}, "keywords": ["冷战", "沉默对待", "沟通邀请", "silent treatment", "nonresponse", "communication invitation", "cold", "war", "silent", "treatment", "stonewalling", "ignored", "冷暴力", "已读不回"], "children": ["faq-176", "faq-039"], "cluster": 11}, {"id": "faq-043", "q": {"zh": "我们经常吵架，是不是说明不适合？", "en": "Does frequent arguing mean we are incompatible?"}, "a": {"zh": "频率本身不足以下结论，更需要看争吵是否安全、能否修复、核心需求是否可协商，以及行为有没有实际改变。没有侮辱、威胁或暴力的分歧也可能是关系的一部分；若冲突持续升级或造成恐惧，应优先评估安全并寻求专业支持。", "en": "Frequency alone is not enough to determine incompatibility. Consider whether conflict remains safe, repair is possible, core needs are negotiable, and behavior actually changes. Disagreement without insults, threats, or violence can be part of relationships; if conflict escalates or creates fear, prioritize safety assessment and professional support."}, "keywords": ["频繁争吵", "关系适配", "冲突安全", "frequent arguments", "compatibility", "conflict safety", "沟通", "吵架", "争吵", "冲突", "矛盾"], "children": ["faq-208", "faq-124"], "cluster": 13}, {"id": "faq-044", "q": {"zh": "生气时怎样避免说出伤人的话？", "en": "How can I avoid saying hurtful things when angry?"}, "a": {"zh": "留意心跳加快、声音变大或想攻击等升级信号，在失控前明确暂停，并约定恢复谈话的时间。暂停期间可离开冲突现场、缓慢呼吸、走动或写下想说的话，但不要用酒精、砸物或危险驾驶泄愤；冷静后对造成的伤害负责并讨论预防方案。", "en": "Notice escalation cues such as a racing heart, raised voice, or urge to attack, and call a clear time-out before losing control, with a time to resume. During the break, leave the immediate conflict, breathe slowly, walk, or write your thoughts; do not use alcohol, property damage, or dangerous driving to discharge anger. Return calmly, take responsibility for harm, and discuss prevention."}, "keywords": ["愤怒管理", "暂停", "伤害修复", "anger management", "time-out", "repair"], "children": ["faq-039", "faq-036"], "cluster": 11}, {"id": "faq-045", "q": {"zh": "怎样才算有效的道歉？", "en": "What makes an apology effective?"}, "a": {"zh": "有效道歉通常包括明确说出行为、承认其影响、不过度辩解、表达歉意，并提出可验证的改进措施。不要要求对方立刻原谅，也不要用礼物替代责任；真正的修复要看之后是否持续改变。", "en": "An effective apology names the behavior, acknowledges its impact, avoids excessive justification, expresses remorse, and proposes verifiable corrective action. Do not demand immediate forgiveness or use gifts as a substitute for accountability. Repair depends on consistent change afterward."}, "keywords": ["道歉", "责任承担", "关系修复", "apology", "accountability", "relational repair"], "children": ["faq-257", "faq-267"], "cluster": 14}, {"id": "faq-046", "q": {"zh": "关系中的“边界”是什么？", "en": "What are boundaries in a relationship?"}, "a": {"zh": "边界是你为保护安全、尊严、时间、身体和价值观而说明自己会接受什么、不会接受什么，以及越界时你会采取的行动。边界不是控制对方的命令，例如“你必须怎样”，而是关于自己的选择；健康边界应清晰、现实并尽量一致执行。", "en": "Boundaries state what you will and will not accept to protect safety, dignity, time, body, and values, and what action you will take if a limit is crossed. They are not commands controlling another person, such as “you must…,” but statements about your own choices. Healthy boundaries are clear, realistic, and applied consistently where possible."}, "keywords": ["关系边界", "自我保护", "一致执行", "boundaries", "self-protection", "consistency", "boundary", "limits", "边界", "底线", "分寸"], "children": ["faq-031", "faq-053"], "cluster": 5}, {"id": "faq-047", "q": {"zh": "我很难拒绝别人，怎样练习说“不”？", "en": "How can I practice saying no when refusal is difficult for me?"}, "a": {"zh": "从低风险情境开始，用简短句子表达：“谢谢你想到我，但我这次不能答应。”避免为了让拒绝显得合理而提供过多解释，并允许对方失望；若担心对方报复，可先准备安全计划、选择有支持的场合或通过更安全的渠道表达。", "en": "Begin in low-risk situations with a brief statement: “Thank you for thinking of me, but I cannot agree this time.” Avoid overexplaining to justify the refusal, and allow the other person to feel disappointed. If retaliation is a concern, prepare a safety plan, choose a supported setting, or communicate through a safer channel."}, "keywords": ["说不", "拒绝技巧", "安全边界", "saying no", "refusal skills", "safe boundaries"], "children": ["faq-162", "faq-051"], "cluster": 15}, {"id": "faq-048", "q": {"zh": "我是不是太依赖伴侣了？", "en": "Am I too dependent on my partner?"}, "a": {"zh": "亲密关系中的相互依靠是正常的，关键在于你是否仍能保有基本选择、其他支持关系、个人兴趣和独立处理部分生活事务的能力。若害怕失去对方而持续放弃安全、尊严或重要价值，可从恢复小范围自主决定和社会支持开始；标签不是目的，改善具体失衡更重要。", "en": "Mutual reliance is normal in intimate relationships. The question is whether you retain basic choice, other supportive relationships, personal interests, and some ability to manage life independently. If fear of loss repeatedly causes you to abandon safety, dignity, or core values, begin by restoring small independent decisions and social support. Improving specific imbalances matters more than adopting a label."}, "keywords": ["情感依赖", "自主性", "支持网络", "emotional dependence", "autonomy", "support network", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-264", "faq-214"], "cluster": 0}, {"id": "faq-049", "q": {"zh": "怎样减少把自我价值建立在伴侣评价上？", "en": "How can I rely less on my partner's approval for self-worth?"}, "a": {"zh": "可列出与伴侣评价无关的能力、价值和贡献，并通过可完成的小目标积累对自己的信任。维持朋友、兴趣、工作或学习等多元身份，在受到评价时区分有用反馈与贬低；若长期自我否定严重影响生活，专业心理支持可能有帮助。", "en": "List abilities, values, and contributions that do not depend on your partner's view, and build self-trust through achievable goals. Maintain diverse identities through friends, interests, work, or study, and distinguish useful feedback from belittling. If persistent self-criticism significantly affects daily life, qualified mental health support may help."}, "keywords": ["自我价值", "自我信任", "多元身份", "self-worth", "self-trust", "identity", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-248", "faq-035"], "cluster": 8}, {"id": "faq-050", "q": {"zh": "单身时经常感到孤独，怎么办？", "en": "What can I do if I often feel lonely while single?"}, "a": {"zh": "孤独是一种需要连接的信号，不等于你失败或必须立刻进入恋爱。可安排规律的低压力社交、参与有共同兴趣的活动，并建立能独处也能求助的日常结构；若孤独伴随持续绝望、失眠或功能下降，应寻求合格的心理健康支持。", "en": "Loneliness signals a need for connection; it does not mean failure or require entering a relationship immediately. Schedule regular, low-pressure contact, join shared-interest activities, and build routines that support both solitude and help-seeking. If loneliness comes with persistent hopelessness, insomnia, or impaired functioning, seek qualified mental health support."}, "keywords": ["单身", "孤独", "社会连接", "single life", "loneliness", "social connection"], "children": ["faq-265", "faq-054"], "cluster": 16}, {"id": "faq-051", "q": {"zh": "喜欢的人不喜欢我，我该如何面对？", "en": "How do I cope when the person I like does not feel the same way?"}, "a": {"zh": "被拒绝会难过，但对方有权选择是否进入关系，你的价值也不由这次回应决定。允许自己失落，减少反复寻找“隐藏信号”，并把精力转回朋友、生活节奏与个人目标；尊重拒绝意味着不持续说服、监视或制造偶遇。", "en": "Rejection hurts, but the other person has the right to choose whether to enter a relationship, and your worth is not determined by that response. Allow disappointment, reduce searching for hidden signs, and return attention to friends, routines, and personal goals. Respecting refusal means not repeatedly persuading, monitoring, or engineering encounters."}, "keywords": ["单恋", "被拒绝", "尊重意愿", "unrequited love", "rejection", "respecting consent"], "children": ["faq-047", "faq-064"], "cluster": 15}, {"id": "faq-052", "q": {"zh": "处在暧昧或“关系未定义”的状态，我该怎么办？", "en": "What should I do in a situationship or undefined relationship?"}, "a": {"zh": "先明确自己希望的关系形式、排他性、联系频率和时间预期，再邀请对方进行一次直接但不施压的对话。关注对方持续行为而非模糊承诺；如果双方需求不一致，你可以选择接受现状、重新设定边界或退出，而不是无限等待。", "en": "Clarify what you want regarding relationship type, exclusivity, contact, and timeframe, then invite one direct, low-pressure conversation. Pay attention to consistent behavior rather than vague promises. If needs differ, you may accept the situation, reset boundaries, or leave instead of waiting indefinitely."}, "keywords": ["暧昧关系", "关系定义", "需求澄清", "situationship", "defining the relationship", "needs clarification"], "children": ["faq-196", "faq-050"], "cluster": 17}, {"id": "faq-053", "q": {"zh": "对方突然消失、不再回复，我该怎么办？", "en": "What should I do if someone suddenly ghosts me?"}, "a": {"zh": "在没有安全担忧的情况下，可发送一次简短信息确认情况并说明你会停止继续联系，之后把沉默视为一种信息。避免跨平台轰炸、联系其亲友施压或追踪行踪；若有客观理由怀疑对方遭遇紧急危险，可通过适当渠道请求安全核查，而不是自行闯入或监控。", "en": "If there is no safety concern, send one brief check-in and state that you will stop further contact, then treat the silence as information. Avoid messaging across platforms, pressuring their friends or family, or tracking them. If objective facts suggest an emergency, request a welfare check through an appropriate channel rather than trespassing or monitoring."}, "keywords": ["突然失联", "尊重边界", "安全核查", "ghosting", "respecting boundaries", "welfare check"], "children": ["faq-078", "faq-042"], "cluster": 11}, {"id": "faq-054", "q": {"zh": "异地恋怎样维持连接？", "en": "How can a long-distance relationship maintain connection?"}, "a": {"zh": "与其要求随时在线，不如共同约定可持续的联系节奏、重要信息的回复预期、探访计划和独处空间。定期讨论信任、财务、未来时间表与关系目标，并允许安排随现实变化；高质量、可预期的连接通常比高频监控更有帮助。", "en": "Rather than requiring constant availability, agree on a sustainable contact rhythm, response expectations for important messages, visit plans, and personal space. Regularly discuss trust, finances, future timelines, and relationship goals, allowing plans to change with circumstances. Predictable, high-quality connection is generally more helpful than frequent monitoring."}, "keywords": ["异地恋", "联系节奏", "未来规划", "long-distance relationship", "communication rhythm", "future planning"], "children": ["faq-108", "faq-016"], "cluster": 0}, {"id": "faq-055", "q": {"zh": "伴侣之间总因钱争吵，怎样处理？", "en": "How can couples handle recurring conflict about money?"}, "a": {"zh": "先把数字和价值观分开讨论：共同列出收入、固定支出、债务、储蓄目标和各自可自由使用的金额，再谈安全感、公平与家庭责任。建立定期而非危机时才开的财务会议，并明确知情与授权边界；涉及复杂债务、税务或法律问题时，应咨询合格的财务或法律专业人员。", "en": "Separate the numbers from the values. List income, fixed expenses, debt, savings goals, and individual discretionary amounts, then discuss security, fairness, and family responsibility. Hold regular money meetings rather than only crisis talks and define consent and authorization boundaries. For complex debt, tax, or legal issues, consult a qualified financial or legal professional."}, "keywords": ["金钱冲突", "财务沟通", "授权边界", "money conflict", "financial communication", "consent", "沟通", "吵架", "争吵", "冲突", "矛盾", "伴侣", "情侣", "夫妻"], "children": ["faq-071", "faq-059"], "cluster": 18}, {"id": "faq-056", "q": {"zh": "家务分配总是不公平，怎样谈才有效？", "en": "How can we address an unfair division of household labor?"}, "a": {"zh": "先把可见家务和“记住、计划、提醒”等隐形劳动全部列出，再根据时间、能力和双方认可的公平标准分配，而不是默认某个人负责。明确任务的完成标准、频率和复盘时间；若一方反复承诺却不行动，应讨论责任后果，而不只是继续提醒。", "en": "List both visible chores and invisible labor such as remembering, planning, and reminding. Divide them by time, ability, and a mutually accepted standard of fairness rather than defaulting to one person. Define completion standards, frequency, and a review date. If promises repeatedly go unfulfilled, discuss accountability and consequences instead of relying only on more reminders."}, "keywords": ["家务分配", "隐形劳动", "公平", "household labor", "mental load", "fairness"], "children": ["faq-193", "faq-055"], "cluster": 18}, {"id": "faq-057", "q": {"zh": "双方性需求或亲密需求不一致怎么办？", "en": "What can couples do when sexual or intimacy needs differ?"}, "a": {"zh": "在没有压力的时刻讨论各自对亲密、频率、拒绝和情感连接的理解，并以每一次都可自由撤回的同意为前提。不要用内疚、威胁、冷落或交易强迫亲密；可共同探索双方都舒适的非性亲密方式。若有疼痛、功能变化或药物影响，应咨询合格的医疗专业人员；创伤或持续困扰可寻求具备相应资质的治疗支持。", "en": "At a low-pressure time, discuss what intimacy, frequency, refusal, and emotional connection mean to each person, with consent that is freely given and reversible every time. Do not use guilt, threats, withdrawal, or bargaining to force intimacy; explore mutually comfortable nonsexual affection as well. Consult a qualified medical professional for pain, functional changes, or medication effects, and appropriately qualified therapeutic support for trauma or persistent distress."}, "keywords": ["亲密需求", "性同意", "医疗转介", "intimacy needs", "sexual consent", "medical referral"], "children": ["faq-185", "faq-089"], "cluster": 19}, {"id": "faq-058", "q": {"zh": "我对结婚很犹豫，这正常吗？", "en": "Is it normal to feel uncertain about marriage?"}, "a": {"zh": "犹豫并不一定代表关系有问题，也不应被忽视。可区分对承诺本身的焦虑、外界压力与对具体关系条件的担忧，并讨论价值观、财务、居住、家庭责任、亲密、孩子和冲突处理；在重大疑问未澄清前，推迟决定通常比被催促着答应更稳妥。", "en": "Uncertainty does not necessarily mean the relationship is wrong, but it should not be ignored. Distinguish anxiety about commitment, outside pressure, and concerns about the actual relationship, then discuss values, finances, living arrangements, family duties, intimacy, children, and conflict. When major questions remain unresolved, delaying the decision is generally safer than agreeing under pressure."}, "keywords": ["婚前犹豫", "婚姻决定", "外界压力", "marriage uncertainty", "marital decision", "external pressure", "marriage", "divorce", "wedding", "remarriage", "复婚", "结婚", "婚姻", "离婚"], "children": ["faq-069", "faq-209"], "cluster": 20}, {"id": "faq-059", "q": {"zh": "婚前咨询通常会讨论什么？", "en": "What topics are usually discussed in premarital counseling?"}, "a": {"zh": "常见主题包括沟通与冲突、财务、家庭边界、家务、亲密关系、生育选择、职业与居住计划、健康信息以及重大价值观。目的不是评判“合不合格”，而是尽早看见差异并形成可协商的安排；涉及婚姻法律后果时，应另行获取当地法律意见。", "en": "Common topics include communication and conflict, money, family boundaries, household labor, intimacy, reproductive choices, career and living plans, health information, and core values. The goal is not to declare a couple “qualified,” but to identify differences early and build workable agreements. Obtain separate local legal advice about the legal effects of marriage."}, "keywords": ["婚前咨询", "核心议题", "婚姻准备", "premarital counseling", "core topics", "marriage preparation"], "children": ["faq-251", "faq-055"], "cluster": 18}, {"id": "faq-060", "q": {"zh": "伴侣和原生家庭边界不清，怎么办？", "en": "What can we do when boundaries with extended family are unclear?"}, "a": {"zh": "伴侣之间先私下确认共同底线，例如探访频率、财务支持、育儿决定、隐私和节日安排，再由与该家庭关系更直接的一方优先沟通。用尊重但明确的语言表达共同决定，并允许家人不满意；若存在控制、经济剥削或威胁，应把安全和独立资源放在首位。", "en": "Partners should privately agree on shared limits for visits, financial support, parenting, privacy, and holidays, with the person more directly connected to that family taking the lead in communication. State joint decisions respectfully and clearly, allowing relatives to be dissatisfied. If control, financial exploitation, or threats are present, prioritize safety and independent resources."}, "keywords": ["原生家庭", "姻亲边界", "共同决定", "extended family", "in-law boundaries", "joint decisions", "boundary", "boundaries", "limits", "边界", "底线", "分寸", "伴侣", "情侣"], "children": ["faq-033", "faq-021"], "cluster": 0}, {"id": "faq-061", "q": {"zh": "我和伴侣的育儿观念不同，怎样协调？", "en": "How can partners reconcile different parenting approaches?"}, "a": {"zh": "先找出共同目标，如孩子的安全、稳定和尊严，再讨论具体行为而非给彼此贴“太严”或“太松”的标签。可对少数高频场景制定一致规则、在孩子面前避免互相拆台，并定期复盘；涉及健康、发展或特殊教育需要时，应咨询相应专业人员。", "en": "Start with shared goals such as the child's safety, stability, and dignity, then discuss specific behaviors rather than labeling each other too strict or too permissive. Agree on consistent rules for a few frequent situations, avoid undermining each other in front of the child, and review regularly. Consult relevant professionals for health, developmental, or special-education needs."}, "keywords": ["育儿分歧", "共同目标", "家庭规则", "parenting differences", "shared goals", "family rules", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-184", "faq-066"], "cluster": 0}, {"id": "faq-062", "q": {"zh": "我在考虑离婚，咨询能帮我什么？", "en": "How can counseling help if I am considering divorce?"}, "a": {"zh": "情感咨询可以帮助你梳理感受、价值观、关系模式、可尝试的改变和不同选择的现实影响，但不替你作决定。可把安全、住房、财务、孩子与支持网络纳入评估；关于财产、监护、移民或程序权利，应咨询所在地合格律师或相关机构。", "en": "Emotional counseling can help clarify feelings, values, relationship patterns, possible changes, and the practical impact of different choices, but it cannot decide for you. Include safety, housing, finances, children, and support networks in the assessment. Consult a qualified local lawyer or agency about property, custody, immigration, or procedural rights."}, "keywords": ["离婚考虑", "决策支持", "法律转介", "considering divorce", "decision support", "legal referral", "marriage", "divorce", "wedding", "remarriage", "复婚", "结婚", "婚姻", "离婚"], "children": ["faq-009", "faq-079"], "cluster": 0}, {"id": "faq-063", "q": {"zh": "分开后怎样进行较健康的共同育儿？", "en": "How can separated parents co-parent more healthily?"}, "a": {"zh": "把孩子的安全和稳定放在伴侣矛盾之前，使用简短、事实化、以安排为中心的沟通，并避免让孩子传话或选边站。可书面明确时间、交接、费用和紧急决策流程；若存在暴力或高控制风险，普通共同育儿建议可能不适用，应寻求法律与安全专业支持。", "en": "Put the child's safety and stability ahead of former-partner conflict. Use brief, factual, logistics-focused communication and do not make the child carry messages or choose sides. Document schedules, handovers, expenses, and emergency decisions. Where violence or coercive control exists, ordinary co-parenting advice may be unsafe; seek legal and safety-specialist support."}, "keywords": ["共同育儿", "儿童利益", "高冲突分离", "co-parenting", "child wellbeing", "high-conflict separation"], "children": ["faq-260", "faq-061"], "cluster": 0}, {"id": "faq-064", "q": {"zh": "工作压力总被带回关系里，怎么办？", "en": "What can we do when work stress spills into the relationship?"}, "a": {"zh": "可设计下班过渡仪式，例如短暂独处、散步或先说明“我需要二十分钟缓冲”，避免把沉默误解为拒绝。讨论彼此需要的是倾听、建议还是实际协助，并保留不谈工作的共同时间；若压力已造成持续失眠、焦虑或功能受损，应寻求职业、医疗或心理健康支持。", "en": "Create an after-work transition ritual, such as brief quiet time, a walk, or saying, “I need 20 minutes to decompress,” so silence is not mistaken for rejection. Ask whether each person wants listening, advice, or practical help, and preserve shared time without work talk. If stress causes persistent insomnia, anxiety, or impairment, seek occupational, medical, or mental health support."}, "keywords": ["工作压力", "情绪转场", "伴侣支持", "work stress", "transition ritual", "partner support"], "children": ["faq-243", "faq-047"], "cluster": 21}, {"id": "faq-065", "q": {"zh": "伴侣之间应该共享手机密码和定位吗？", "en": "Should partners share phone passwords and location data?"}, "a": {"zh": "没有适用于所有关系的规则，关键是双方能否自由同意、随时重新协商，并理解数据用途和风险。共享不应成为忠诚测试，也不应以威胁、内疚或秘密监控取得；即使自愿共享，也可保留合理隐私，并为账户安全设置独立恢复方式。", "en": "There is no universal rule. What matters is free consent, the ability to renegotiate, and understanding how the data will be used and protected. Sharing should not become a loyalty test or be obtained through threats, guilt, or covert surveillance. Even with voluntary sharing, reasonable privacy and independent account-recovery methods can remain."}, "keywords": ["数字隐私", "密码共享", "定位", "digital privacy", "password sharing", "location tracking", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-174", "faq-139"], "cluster": 22}, {"id": "faq-066", "q": {"zh": "社交媒体总引发嫉妒和误会，怎样减少冲突？", "en": "How can couples reduce jealousy and misunderstandings caused by social media?"}, "a": {"zh": "讨论具体行为及其含义，例如公开关系、点赞、私信、发布照片和与前任互动，而不是假设双方标准相同。共同制定对等且可执行的约定，并把算法推荐或在线状态与真实意图区分开；避免通过小号测试、公开羞辱或监控来获得确定感。", "en": "Discuss specific behaviors and meanings, such as relationship visibility, likes, direct messages, photos, and contact with former partners, rather than assuming shared standards. Create reciprocal, workable agreements and distinguish algorithmic recommendations or online status from actual intent. Avoid fake-account tests, public shaming, or surveillance to obtain certainty."}, "keywords": ["社交媒体", "网络嫉妒", "数字边界", "social media", "online jealousy", "digital boundaries", "trust", "jealousy", "checking", "phone", "insecure", "沟通", "吵架", "争吵"], "children": ["faq-186", "faq-061"], "cluster": 0}, {"id": "faq-067", "q": {"zh": "伴侣和前任保持联系，我应该介意吗？", "en": "Should I be concerned if my partner stays in contact with an ex?"}, "a": {"zh": "联系本身不能说明全部问题，要看目的、透明度、频率、共同育儿等现实需要，以及是否违反双方已有约定。可用具体事实表达不安并协商边界，同时避免要求对方与所有过去关系隔绝；若存在欺骗，可讨论修复信任所需的可验证行为。", "en": "Contact alone does not tell the whole story. Consider purpose, transparency, frequency, practical needs such as co-parenting, and whether existing agreements were broken. Express concern using specific facts and negotiate boundaries without demanding isolation from every past connection. If deception occurred, discuss verifiable actions needed to repair trust."}, "keywords": ["前任联系", "信任", "关系约定", "contact with ex", "trust", "relationship agreements", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-195", "faq-043"], "cluster": 13}, {"id": "faq-068", "q": {"zh": "恋爱后还能和朋友保持亲密联系吗？", "en": "Can people maintain close friendships while in a romantic relationship?"}, "a": {"zh": "可以，稳定的友谊和支持网络通常有助于个人与关系健康。可讨论时间分配、隐私、暧昧行为和伴侣共同活动的边界，但不应以恋爱为由要求对方全面孤立；边界应对双方一致，而不是基于性别进行单方面限制。", "en": "Yes. Stable friendships and support networks generally benefit individual and relationship wellbeing. Discuss time, privacy, flirtation, and shared social activities, but a romantic relationship should not require total isolation. Boundaries should be reciprocal rather than one-sided restrictions based on gender."}, "keywords": ["友谊边界", "支持网络", "平等原则", "friendship boundaries", "support network", "reciprocity", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-227", "faq-264"], "cluster": 0}, {"id": "faq-069", "q": {"zh": "一方想结婚、另一方不想，能协调吗？", "en": "Can a couple reconcile when one wants marriage and the other does not?"}, "a": {"zh": "先澄清“不想”是暂时条件、对制度的价值判断，还是长期明确选择，并讨论各自可接受的时间表与替代承诺形式。婚姻意愿可能是不可折中的核心需求，咨询可以帮助诚实决策，但不应把任何一方说服到违背意愿；不一致有时意味着需要体面分开。", "en": "Clarify whether “not wanting marriage” reflects temporary conditions, values about the institution, or a firm long-term choice, and discuss acceptable timelines and alternative forms of commitment. Marriage may be a non-negotiable core need. Counseling can support honest decisions but should not persuade either person to violate their wishes; incompatibility may sometimes require a respectful separation."}, "keywords": ["结婚意愿", "核心需求", "不可调和差异", "marriage goals", "core needs", "incompatibility", "marriage", "divorce", "wedding", "remarriage", "复婚", "结婚", "婚姻", "离婚"], "children": ["faq-070", "faq-058"], "cluster": 20}, {"id": "faq-070", "q": {"zh": "一方想要孩子、另一方不想，怎么办？", "en": "What if one partner wants children and the other does not?"}, "a": {"zh": "生育选择涉及身体自主和长期责任，不能靠施压、拖延或期待对方“以后自然改变”解决。双方应尽早讨论意愿强度、时间、健康、照护与经济现实，并承认这可能是无法折中的差异；医疗信息应咨询合格专业人员，最终决定必须尊重自由同意。", "en": "Reproductive choices involve bodily autonomy and lifelong responsibility and cannot be resolved through pressure, delay, or assuming the other person will change. Discuss the strength of each preference, timing, health, care, and financial realities early, recognizing this may be non-negotiable. Obtain medical information from qualified professionals, and respect free consent in all final decisions."}, "keywords": ["生育选择", "身体自主", "核心差异", "reproductive choice", "bodily autonomy", "core difference", "家庭", "父母", "家长", "青少年", "孩子"], "children": ["faq-069", "faq-204"], "cluster": 20}, {"id": "faq-071", "q": {"zh": "跨文化伴侣怎样处理价值观差异？", "en": "How can intercultural couples handle differences in values?"}, "a": {"zh": "避免把个人行为简单归因于某种文化，分别说明各自家庭传统、宗教、语言、金钱、性别角色和节日对自己的意义。共同决定哪些传统保留、轮流或创新，并给误解留出澄清空间；若涉及移民、婚姻或宗教法律问题，应另行咨询合格专业人员。", "en": "Avoid reducing individual behavior to a cultural stereotype. Explain what family traditions, religion, language, money, gender roles, and holidays mean personally to each of you. Decide together what to preserve, alternate, or create anew, leaving room to clarify misunderstandings. Seek qualified advice for immigration, marriage, or religious-law issues."}, "keywords": ["跨文化关系", "价值观差异", "文化尊重", "intercultural relationships", "values", "cultural respect", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-102", "faq-188"], "cluster": 18}, {"id": "faq-072", "q": {"zh": "性少数或多元性别伴侣面临外界压力时怎么办？", "en": "What can LGBTQ+ or gender-diverse couples do when facing outside pressure?"}, "a": {"zh": "先共同评估公开身份、家庭互动、工作环境与居住地的现实安全，再决定向谁、何时以及披露多少。建立肯定身份的支持网络，并把外界歧视造成的压力与伴侣彼此的问题区分开；若面临威胁、歧视或法律风险，可联系当地可信赖的社群组织及合格法律专业人员。", "en": "Jointly assess the real-world safety of disclosure, family contact, work, and location before deciding whom to tell, when, and how much. Build an identity-affirming support network and distinguish stress caused by discrimination from problems between partners. For threats, discrimination, or legal risk, contact a trusted local community organization and a qualified legal professional."}, "keywords": ["性少数关系", "少数压力", "身份安全", "LGBTQ+ relationships", "minority stress", "disclosure safety", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-189", "faq-249"], "cluster": 23}, {"id": "faq-073", "q": {"zh": "分手后很久仍然难过，是不是不正常？", "en": "Is it abnormal to remain sad long after a breakup?"}, "a": {"zh": "关系结束后的悲伤没有统一时间表，纪念日、地点或新消息都可能让感受反复。可以观察总体趋势：是否逐渐恢复日常功能、重新连接生活，而不是要求每天直线上升；若痛苦持续强烈、功能显著下降或出现绝望与自伤想法，应接受合格心理健康专业人员的评估。", "en": "Grief after a relationship has no universal timetable, and anniversaries, places, or new information can reactivate feelings. Look at the overall trend—whether daily functioning and engagement with life are gradually returning—rather than expecting linear improvement every day. Seek assessment from a qualified mental health professional if distress remains intense, functioning declines substantially, or hopelessness or self-harm thoughts emerge."}, "keywords": ["分手哀伤", "恢复节奏", "心理评估", "breakup grief", "recovery pace", "mental health assessment", "breakup", "break", "up", "separation", "split", "分手", "离开", "结束"], "children": ["faq-266", "faq-018"], "cluster": 0}, {"id": "faq-074", "q": {"zh": "情感困扰已经影响睡眠和食欲，我该怎么办？", "en": "What should I do if relationship distress is affecting sleep and appetite?"}, "a": {"zh": "先记录持续时间和严重程度，尽量保持固定起床时间、规律少量进食、减少酒精和深夜刺激，并请可信赖的人提供日常支持。若症状持续、迅速恶化、出现明显体重变化、脱水或无法工作学习，应尽快联系合格的医疗或心理健康专业人员；情感咨询不能替代评估和治疗。", "en": "Track duration and severity, keep a consistent wake time, eat small regular meals, reduce alcohol and late-night stimulation, and ask a trusted person for practical support. If symptoms persist, worsen quickly, cause marked weight change or dehydration, or prevent work or study, promptly contact a qualified medical or mental health professional. Emotional counseling is not a substitute for assessment and treatment."}, "keywords": ["睡眠", "食欲", "功能受损", "sleep", "appetite", "impaired functioning"], "children": ["faq-032", "faq-261"], "cluster": 6}, {"id": "faq-075", "q": {"zh": "情绪突然崩溃或像惊恐发作时，怎样先稳定下来？", "en": "How can I stabilize during an emotional crisis or possible panic attack?"}, "a": {"zh": "若环境安全，可把双脚踩地，缓慢延长呼气，并说出眼前能看到、听到和触到的事物，提醒自己强烈感受会变化。避免独自驾驶、饮酒或做重大决定；首次出现、症状异常或伴随胸痛、晕厥、呼吸严重困难时，应立即寻求医疗急救，因为仅凭感受无法排除身体原因。", "en": "If the setting is safe, place both feet on the ground, lengthen the exhale gently, and name things you can see, hear, and touch, reminding yourself that intense sensations change. Avoid driving alone, alcohol, or major decisions. Seek emergency medical care for a first episode, unusual symptoms, chest pain, fainting, or severe breathing difficulty because physical causes cannot be ruled out by sensation alone."}, "keywords": ["情绪崩溃", "惊恐", "落地练习", "emotional crisis", "panic", "grounding"], "children": ["faq-246", "faq-044"], "cluster": 24}, {"id": "faq-076", "q": {"zh": "我因为感情问题想伤害自己或不想活了，怎么办？", "en": "What should I do if relationship pain makes me want to harm myself or die?"}, "a": {"zh": "现在请把安全放在第一位：不要独处，远离或请他人暂时保管可能用于伤害自己的物品，并立即联系所在地紧急服务、危机热线或前往最近的急诊。直接告诉一位可信赖的人“我现在可能伤害自己，需要你陪我并帮我求助”。情感快线的普通咨询和本知识库都不能处理即时危机；如果已经采取伤害行为或有明确计划，请立刻呼叫急救。", "en": "Put safety first now: do not stay alone, move away from or ask someone to secure anything you might use to hurt yourself, and immediately contact local emergency services, a crisis line, or the nearest emergency department. Tell a trusted person directly, “I may hurt myself and need you to stay with me and help me get support.” Routine Emotional Express services and this knowledge base cannot manage an immediate crisis. If you have already acted or have a specific plan, call emergency services now."}, "keywords": ["自伤风险", "自杀危机", "立即求助", "self-harm risk", "suicide crisis", "immediate help"], "children": ["faq-030", "faq-166"], "cluster": 0}, {"id": "faq-077", "q": {"zh": "伴侣有暴力、威胁或强迫控制行为，我该怎么办？", "en": "What should I do if my partner is violent, threatening, or coercively controlling?"}, "a": {"zh": "这不是普通沟通分歧，你不需要通过更好表达来阻止对方施暴。若有即时危险，尽快到安全地点并联系当地紧急服务；在安全设备上联系家庭暴力支援机构或可信赖的人，制定包含证件、药物、资金、儿童和宠物安排的个别安全计划。活跃的暴力或胁迫控制下，伴侣共同咨询可能增加风险，应先接受专业安全评估；离开可能是高风险时段，请勿在无计划时当面对质。", "en": "This is not an ordinary communication disagreement, and you are not responsible for preventing abuse by communicating better. In immediate danger, move to a safer place and contact local emergency services. From a safe device, reach a domestic-violence service or trusted person and make an individualized plan covering identification, medication, money, children, and pets. Joint counseling may increase risk during active violence or coercive control, so obtain specialist safety assessment first. Leaving can be a high-risk period; avoid an unplanned confrontation."}, "keywords": ["家庭暴力", "强迫控制", "安全计划", "domestic violence", "coercive control", "safety planning", "safety", "crisis", "emergency", "self", "harm", "suicide", "domestic", "violence"], "children": ["faq-112", "faq-030"], "cluster": 0}, {"id": "faq-078", "q": {"zh": "分手后对方持续跟踪、骚扰或威胁我，怎么办？", "en": "What should I do if an ex keeps stalking, harassing, or threatening me?"}, "a": {"zh": "不要把持续跟踪视为浪漫或普通挽回。若安全可行，明确一次停止联系的要求后避免继续争辩，保存带日期的消息、来电、目击和事件记录，并检查账户、设备与定位共享安全；如有即时危险联系当地紧急服务，其他情况下可向当地警方、反骚扰机构或合格律师了解保护措施。取证和应对方式应以所在地法律与安全专业建议为准。", "en": "Do not treat persistent stalking as romance or ordinary reconciliation. If safe, state once that contact must stop, avoid further argument, preserve dated messages, calls, witnesses, and incident records, and review account, device, and location-sharing security. Contact local emergency services for immediate danger; otherwise ask local police, an anti-stalking service, or a qualified lawyer about protective options. Evidence collection and response should follow local law and specialist safety advice."}, "keywords": ["跟踪骚扰", "数字安全", "证据保存", "stalking", "harassment", "digital safety", "breakup", "break", "up", "separation", "split", "分手", "离开", "结束"], "children": ["faq-053", "faq-201"], "cluster": 11}, {"id": "faq-079", "q": {"zh": "朋友因感情问题非常痛苦，我该怎样帮助？", "en": "How can I help a friend who is in severe relationship distress?"}, "a": {"zh": "先倾听并用开放问题了解他们需要陪伴、实际帮助还是专业资源，不急着批评其伴侣或替其做决定。若担心自伤或他伤，可以直接问是否有相关想法、计划和可用手段；有即时风险时不要独自保密，应陪同联系当地紧急服务、危机热线或可信赖的成年人。你也可以设定自己的能力边界，不能成为唯一支持来源。", "en": "Listen first and ask whether your friend needs company, practical help, or professional resources, without rushing to criticize the partner or decide for them. If you are worried about self-harm or harm to others, ask directly about thoughts, plans, and access to means. Do not keep immediate danger secret; stay with them while contacting local emergency services, a crisis line, or a trusted adult. Set limits on your own capacity—you cannot be the only source of support."}, "keywords": ["支持朋友", "危机询问", "支持边界", "helping a friend", "crisis assessment", "support boundaries"], "children": ["faq-248", "faq-062"], "cluster": 0}, {"id": "faq-080", "q": {"zh": "怎样判断情感咨询是否对我有帮助？", "en": "How can I tell whether emotional counseling is helping me?"}, "a": {"zh": "在开始时设定两三个具体指标，例如冲突后恢复更快、能清楚表达一个边界、反复联系次数减少或日常功能改善，并定期回顾。帮助不等于关系一定维持，也可能表现为更清楚地决定暂停或离开；若长期无进展、边界不清或感到被施压，可提出调整目标、更换人员、转介或结束服务。", "en": "At the start, choose two or three concrete indicators, such as recovering faster after conflict, expressing one boundary clearly, reducing repeated contact, or improving daily functioning, and review them regularly. Benefit does not necessarily mean preserving the relationship; it may mean reaching a clearer decision to pause or leave. If progress remains absent, boundaries are unclear, or you feel pressured, discuss changing goals, providers, referral, or ending the service."}, "keywords": ["效果评估", "咨询目标", "结束服务", "measuring progress", "counseling goals", "ending services ======================================================================"], "children": ["faq-269", "faq-175"], "cluster": 0}, {"id": "faq-081", "q": {"zh": "MBTI是什么，它在情感咨询中能做什么？", "en": "What is MBTI, and how can it be used in relationship counseling?"}, "a": {"zh": "MBTI是一套描述信息获取、决策和生活方式偏好的类型框架。在咨询中，它可帮助双方用较中性的语言讨论差异、需求和沟通习惯。MBTI仅是自我反思工具，不是心理诊断，也不能决定一段关系是否成功。", "en": "MBTI is a type framework describing preferences in how people take in information, make decisions, and approach daily life. In counseling, it can provide neutral language for discussing differences, needs, and communication habits. It is a self-reflection tool, not a psychological diagnosis, and it cannot determine whether a relationship will succeed."}, "keywords": ["MBTI基础", "自我反
