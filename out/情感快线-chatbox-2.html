cation", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-176", "faq-190"], "cluster": 11}, {"id": "faq-181", "q": {"zh": "一方自称“回避型”，并以此拒绝所有沟通，另一方该怎么办？", "en": "One partner calls themselves “avoidant” and uses the label to refuse all communication. What can the other partner do?"}, "a": {"zh": "以下为合成、匿名化案例，不对任何人作依恋类型或心理诊断，也不保证关系走向。标签可以帮助描述倾向，却不能免除尊重、协商和责任。咨询师可引导另一方不争论标签，而是描述可观察行为及影响，例如“重要议题被无限期推迟让我无法参与决定”，再提出具体请求和时间界限。若对方始终不愿参与，来访者可评估这段关系是否能满足最低限度的沟通与互惠需要。", "en": "This synthetic, anonymized case does not diagnose anyone’s attachment style or mental health and cannot predict the relationship’s outcome. A label may describe a tendency, but it does not remove responsibility for respect, negotiation, and accountability. Rather than debating the label, the other partner can name observable behavior and impact—for example, “Indefinitely postponing important topics prevents me from sharing in decisions”—then make a specific request with a time boundary. If the partner consistently refuses participation, the client can assess whether the relationship meets their minimum needs for communication and reciprocity."}, "keywords": ["依恋标签", "责任边界", "关系评估", "attachment labels", "accountability", "relationship assessment", "沟通", "吵架", "争吵", "冲突", "矛盾"], "children": ["faq-207", "faq-192"], "cluster": 0}, {"id": "faq-182", "q": {"zh": "婚后双方父母频繁介入生活安排，夫妻怎样建立界限？", "en": "After marriage, both families frequently intervene in daily decisions. How can the couple set boundaries?"}, "a": {"zh": "这是合成且匿名化的情境示例，不诊断家庭成员，也不承诺结果。夫妻可先在私下确认共同立场，区分哪些决定由两人做、哪些可以征求家人意见、哪些涉及照护责任需要共同规划。对外沟通宜由各自主要回应自己的家人，用感谢加清晰界限的表达，并预先约定违反界限后的可执行后果，例如缩短探访或改为预约。文化中的孝道与家庭联结可被尊重，但不等于放弃成年人的自主权。", "en": "This is a synthetic, anonymized scenario; it neither diagnoses family members nor promises an outcome. The couple can first align privately on which decisions belong to them, which invite family input, and which caregiving duties require broader planning. Each partner may take primary responsibility for communicating with their own family, combining appreciation with a clear limit and an enforceable consequence, such as shorter visits or advance scheduling. Cultural values of filial care and family connection can be respected without surrendering adult autonomy."}, "keywords": ["原生家庭", "婚姻界限", "孝道协商", "family of origin", "marital boundaries", "filial values", "伴侣", "情侣", "夫妻", "恋爱", "对象", "家庭", "父母", "家长"], "children": ["faq-195", "faq-189"], "cluster": 0}, {"id": "faq-183", "q": {"zh": "伴侣收入差距大，常因消费和“谁付钱”争执，如何处理？", "en": "Partners with a large income gap argue about spending and who pays. How can they address it?"}, "a": {"zh": "本案例为合成及匿名化素材，不是财务或心理诊断，也不保证结果。双方可先公开可承受范围、债务与必要支出，再讨论“公平”是平均分担、按收入比例，还是按资源与家务贡献综合安排。可分别设共同账户、个人自主额度和需要共同同意的大额支出门槛，并定期复盘。咨询师可促进价值与权力层面的对话；涉及投资、税务、债务或法律责任时，应另咨询具资质的财务或法律专业人士。", "en": "This synthetic, anonymized material is neither financial nor psychological diagnosis and does not guarantee results. The partners can disclose affordability, debts, and essential expenses, then define whether “fair” means equal amounts, income-based proportions, or an arrangement that also recognizes household contributions. They might separate shared funds, personal discretionary amounts, and a threshold for purchases requiring joint agreement, with regular reviews. A counselor can facilitate the values and power conversation; investments, tax, debt, or legal liability should be addressed with qualified financial or legal professionals."}, "keywords": ["金钱冲突", "收入差距", "公平分担", "money conflict", "income gap", "equitable contribution", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-185", "faq-187"], "cluster": 0}, {"id": "faq-184", "q": {"zh": "共同养育中，一方严格、一方宽松，怎样减少孩子被夹在中间？", "en": "In co-parenting, one adult is strict and the other permissive. How can they keep the child out of the middle?"}, "a": {"zh": "以下为合成匿名案例，不对家长或孩子作诊断，也不保证特定效果。照护者可在孩子不在场时选出少量共同底线，如安全、作息和尊重，再允许非核心事项存在风格差异。避免让孩子传话、选边或听到彼此贬低；有分歧时可说“我们会讨论后告诉你”。若涉及分居或离婚，还应遵守有效的监护安排与适用法律。孩子出现持续明显困扰时，可考虑咨询合资格儿童或家庭专业人员。", "en": "This synthetic, anonymized case neither diagnoses caregivers or children nor guarantees a specific effect. Caregivers can agree privately on a small set of shared essentials—such as safety, routines, and respect—while allowing stylistic differences on lower-stakes matters. They should avoid using the child as a messenger, asking the child to choose sides, or criticizing each other within earshot; when they disagree, they can say, “We will discuss it and let you know.” Separated or divorced parents should also follow valid custody arrangements and applicable law. Persistent, marked distress in the child may warrant support from a qualified child or family professional."}, "keywords": ["共同养育", "家庭沟通", "儿童福祉", "co-parenting", "family communication", "child wellbeing", "家庭", "父母", "家长", "青少年", "孩子"], "children": ["faq-061", "faq-206"], "cluster": 0}, {"id": "faq-185", "q": {"zh": "伴侣对亲密频率期待不同，怎样谈而不施压？", "en": "Partners want different levels of physical intimacy. How can they discuss it without pressure?"}, "a": {"zh": "这是合成、匿名化的教育性情境，不构成医疗或心理诊断，也不承诺结果。对话应在非亲密时刻进行，使用“我”的表达说明需要与担忧，同时明确任何亲密行为都需要当下、自愿、可撤回的同意；关系身份、过去同意或礼物都不等于本次同意。双方可探索不以性行为为目标的亲近方式，并讨论压力、健康、药物或关系因素。疼痛、功能变化或创伤反应应由合资格医疗或心理专业人员评估，拒绝同意必须被尊重。", "en": "This synthetic, anonymized educational scenario is not a medical or psychological diagnosis and offers no promised result. The conversation should happen outside an intimate moment, using “I” statements to name needs and concerns while affirming that every intimate act requires present, voluntary, revocable consent. Relationship status, prior consent, or gifts do not equal consent now. The partners can explore affection that is not a pathway to sex and discuss stress, health, medication, or relationship factors. Pain, functional changes, or trauma responses should be assessed by qualified medical or mental-health professionals, and a refusal must always be respected."}, "keywords": ["亲密差异", "自愿同意", "性健康", "intimacy differences", "consent", "sexual health", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-187", "faq-183"], "cluster": 0}, {"id": "faq-186", "q": {"zh": "一方因伴侣点赞前任动态而强烈嫉妒，如何分析这个情境？", "en": "One partner becomes intensely jealous when the other likes an ex’s social-media post. How can this situation be analyzed?"}, "a": {"zh": "本情境为合成与匿名化案例，不诊断嫉妒来源，也不保证结果。咨询可分别检视事实、推测和需求：一次点赞是什么可知事实，对关系含义的解释是什么，真正需要的是透明、安抚还是排他边界。双方可协商与前任互动、公开程度及社交媒体使用规则，但规则应对等、可自愿协商，而非强迫交出密码或切断正常社交。若嫉妒转化为监控、威胁或隔离，应优先识别控制风险并制定安全计划。", "en": "This synthetic, anonymized case neither diagnoses the source of jealousy nor guarantees an outcome. Counseling can separate fact, interpretation, and need: the observable fact may be one “like,” the interpretation concerns what it means, and the underlying need may be transparency, reassurance, or an exclusivity boundary. The couple can negotiate contact with ex-partners, disclosure, and social-media norms, but agreements should be reciprocal and voluntary—not demands for passwords or social isolation. If jealousy becomes surveillance, threats, or isolation, controlling behavior and safety planning take priority."}, "keywords": ["嫉妒", "社交媒体", "数字界限", "jealousy", "social media", "digital boundaries", "trust", "checking", "phone", "insecure", "伴侣", "情侣", "夫妻", "恋爱"], "children": ["faq-066", "faq-037"], "cluster": 0}, {"id": "faq-187", "q": {"zh": "同事之间发展感情，但存在上下级关系，应注意什么？", "en": "Coworkers develop romantic feelings, but one supervises the other. What should they consider?"}, "a": {"zh": "以下是合成、匿名化的教育案例，不作法律判断、心理诊断或结果保证。权力差异可能影响同意的自由度，并带来利益冲突、报复担忧和团队影响。双方应先查阅适用的公司政策、劳动法规与申报要求，必要时向独立的人力资源或法律专业人士咨询；下属不应因拒绝关系而承受任何不利后果。咨询可帮助梳理情感与边界，但不能替代正式合规意见，也不宜协助隐瞒必须披露的关系。", "en": "This is a synthetic, anonymized educational case, not a legal determination, psychological diagnosis, or promised outcome. A power imbalance may affect freedom of consent and create conflicts of interest, fear of retaliation, and team consequences. Both people should review applicable workplace policies, employment law, and disclosure requirements, seeking independent HR or legal advice when needed; the subordinate must face no disadvantage for declining the relationship. Counseling can help clarify feelings and boundaries, but it cannot replace formal compliance advice or support concealing a relationship that must be disclosed."}, "keywords": ["职场关系", "权力差异", "合规边界", "workplace romance", "power imbalance", "compliance"], "children": ["faq-185", "faq-183"], "cluster": 0}, {"id": "faq-188", "q": {"zh": "跨文化伴侣对婚礼、家庭责任和表达爱意的方式不同，如何协商？", "en": "Cross-cultural partners differ on weddings, family duties, and expressions of love. How can they negotiate?"}, "a": {"zh": "这是合成并匿名化的案例，不把文化差异病理化，也不保证结果。双方可避免把个人偏好概括为“你们文化都这样”，转而询问每项传统对个人的意义、哪些是核心价值、哪些可调整。可用“必须、希望、可放弃”三栏分别列出婚礼、节庆、财务与照护期待，再寻找对等交换或新共同仪式。必要时可邀请双方同意、能保持中立的文化知情顾问；最终决定仍属于伴侣双方。", "en": "This synthetic, anonymized case does not pathologize cultural difference or guarantee an outcome. The partners can avoid turning personal preferences into claims such as “your culture always does this” and instead ask what each tradition means personally, which values are essential, and which practices are adaptable. They might sort wedding, holiday, financial, and caregiving expectations into “must have,” “would like,” and “can release,” then seek reciprocal trade-offs or create a new shared ritual. A mutually accepted, culturally informed consultant may help, but final decisions remain with the partners."}, "keywords": ["跨文化关系", "价值协商", "家庭传统", "cross-cultural relationship", "values negotiation", "family traditions", "伴侣", "情侣", "夫妻", "恋爱", "对象", "家庭", "父母", "家长"], "children": ["faq-071", "faq-192"], "cluster": 18}, {"id": "faq-189", "q": {"zh": "LGBTQ+来访者想向家人公开关系，但担心被排斥，咨询应如何支持？", "en": "An LGBTQ+ client wants to disclose a relationship to family but fears rejection. How should counseling support them?"}, "a": {"zh": "以下为合成、匿名化情境，不诊断、不承诺公开后的反应。公开身份或关系应由来访者自主决定，咨询师不能催促。可共同评估住房、经济、学业、工作与人身安全，选择公开对象、地点、时间和备选联络人，并准备暂缓或分阶段公开的方案。也可连接肯定性专业支持与可信赖社群。若当地环境可能带来暴力、强制治疗或法律风险，应优先保护安全，并咨询当地可靠机构了解实际资源。", "en": "This is a synthetic, anonymized scenario; it provides no diagnosis or promise about the family’s reaction. Disclosure of identity or relationship belongs to the client, and a counselor should not pressure them. Together they can assess housing, finances, education, work, and physical safety; choose whom to tell, where, and when; identify a backup contact; and plan for delayed or gradual disclosure. Affirming professional support and trusted community resources may also help. Where disclosure could lead to violence, coercive “treatment,” or legal danger, safety comes first and reliable local organizations should be consulted about practical resources."}, "keywords": ["LGBTQ+", "出柜安全", "肯定性支持", "LGBTQ+", "disclosure safety", "affirming support"], "children": ["faq-072", "faq-179"], "cluster": 23}, {"id": "faq-190", "q": {"zh": "再婚家庭中，继亲急于管教孩子引发冲突，如何调整？", "en": "In a blended family, conflict arises because a stepparent moves quickly into discipline. What adjustment may help?"}, "a": {"zh": "本例为合成、匿名化场景，不对家庭成员作诊断，也不保证结果。初期可优先建立稳定、可信的关系，由亲生父母承担主要纪律执行，继亲支持共同规则而非立即取代父母角色。成年人应私下统一安全与尊重的底线，避免要求孩子立刻称呼特定称谓或把亲近当作忠诚测试。应允许孩子对原家庭变化有复杂情绪。若牵涉监护、探视或重大冲突，需遵守正式安排并考虑合资格家庭专业人员支持。", "en": "This synthetic, anonymized scenario does not diagnose family members or guarantee results. Early on, the stepparent may prioritize a steady, trustworthy relationship while the biological parent takes primary responsibility for discipline and the stepparent supports shared rules. Adults should align privately on safety and respect, avoiding demands for an immediate parental title or treating closeness as a loyalty test. Children need room for mixed feelings about changes to their original family. Custody, visitation, or serious conflict should be handled under formal arrangements, with qualified family support where appropriate."}, "keywords": ["再婚家庭", "继亲关系", "儿童适应", "blended family", "stepparenting", "child adjustment", "沟通", "吵架", "争吵", "冲突", "矛盾", "家庭", "父母", "家长"], "children": ["faq-180", "faq-182"], "cluster": 11}, {"id": "faq-191", "q": {"zh": "一方丧亲后变得沉默，另一方感觉被推开，关系可以怎样获得支持？", "en": "After a bereavement, one partner becomes withdrawn and the other feels pushed away. How can the relationship be supported?"}, "a": {"zh": "这是合成且匿名化的教育案例，不诊断哀伤方式，也不承诺恢复时间。两人的需要可能同时真实：丧亲者需要空间，伴侣也需要基本连接。可约定低压力的陪伴方式，例如每日一次简短询问、一起散步或明确何时暂不谈，并避免规定“应该多久走出来”。伴侣不必独自承担全部支持，可鼓励丧亲者联系亲友、哀伤支持或合资格专业人员。若出现自伤想法、无法维持基本生活或急剧恶化，应立即寻求当地紧急及专业帮助。", "en": "This synthetic, anonymized educational case neither diagnoses a grief response nor promises a recovery timeline. Both needs can be valid: the bereaved partner may need space, while the other needs basic connection. They can agree on low-pressure contact, such as one brief daily check-in, a walk together, or a clear signal for not talking, without imposing when someone “should be over it.” One partner should not carry all support alone; trusted people, grief services, or qualified professionals may be involved. Thoughts of self-harm, inability to meet basic needs, or rapid deterioration require immediate local emergency and professional help."}, "keywords": ["丧亲哀伤", "伴侣支持", "危机识别", "bereavement", "partner support", "crisis recognition"], "children": ["faq-206", "faq-192"], "cluster": 11}, {"id": "faq-192", "q": {"zh": "一方获得外地工作机会，另一方不愿搬迁，如何避免把决定变成忠诚测试？", "en": "One partner receives a job offer elsewhere while the other does not want to move. How can they avoid turning the decision into a loyalty test?"}, "a": {"zh": "以下为合成、匿名化案例，不诊断关系质量，也不保证选择结果。双方可把“爱不爱我”改写为多个实际议题：职业发展、收入、签证或照护责任、社交支持、时间表与可逆性。分别列出接受、拒绝、短期异地和延迟决定的收益与成本，再确认谁承担哪些风险。可设计有期限的试行方案及复盘日期，但不得以威胁、经济控制或牺牲单方全部资源逼迫同意。咨询的作用是提高决策质量，而非选出唯一正确答案。", "en": "This synthetic, anonymized case neither diagnoses relationship quality nor guarantees the outcome of a choice. The partners can replace “If you loved me, you would…” with practical dimensions: career growth, income, visa or caregiving duties, social support, timing, and reversibility. They can compare the benefits and costs of accepting, declining, trying temporary distance, or delaying, then name who bears each risk. A time-limited trial with a review date may help, but consent should not be forced through threats, financial control, or one-sided sacrifice. Counseling improves the decision process rather than declaring one correct answer."}, "keywords": ["搬迁决策", "职业与关系", "共同决策", "relocation", "career and relationship", "joint decision-making"], "children": ["faq-188", "faq-191"], "cluster": 18}, {"id": "faq-193", "q": {"zh": "一方觉得自己承担了所有家务和情绪劳动，如何把不满转成可谈的问题？", "en": "One partner feels responsible for all household and emotional labor. How can resentment become a workable conversation?"}, "a": {"zh": "本场景为合成并匿名化示例，不作人格诊断或效果保证。双方可共同盘点可见家务、计划协调、记忆提醒、照顾亲友和安抚情绪等“看不见的工作”，记录频率、耗时与心理负担。分工不一定机械对半，但应被看见、双方同意并可持续。把“你从不帮忙”改为具体任务的完整所有权，例如从发现需要到执行完成，而非等待指令。设定短期试行与复盘，也要为休息和个人时间保留对等空间。", "en": "This synthetic, anonymized example offers neither a personality diagnosis nor a guaranteed effect. The couple can inventory visible chores and invisible work such as planning, remembering, coordinating, caring for relatives, and regulating the household’s emotions, including frequency, time, and mental load. The split need not be mechanically equal, but it should be visible, mutually agreed, and sustainable. Replace “You never help” with complete ownership of specific tasks—from noticing through completion—rather than waiting for instructions. Use a short trial and review, while protecting equitable rest and personal time."}, "keywords": ["情绪劳动", "家务分工", "心理负担", "emotional labor", "household division", "mental load"], "children": ["faq-056", "faq-178"], "cluster": 18}, {"id": "faq-194", "q": {"zh": "伴侣沉迷游戏导致约会和家务被忽略，咨询会怎样处理？", "en": "Gaming is displacing dates and household responsibilities. How might counseling address it?"}, "a": {"zh": "这是合成、匿名化情境，不凭单一行为诊断“成瘾”，也不保证改变。咨询师可先量化可观察影响，如失约次数、睡眠、支出、家务与工作表现，并了解游戏提供的社交、放松或成就需要。双方可协商不被打扰的游戏时间、共同时间、设备关闭点和未完成责任的处理方式，再定期检视。若游戏使用持续失控、造成显著功能损害或伴随欺骗和财务风险，应建议由合资格专业人员进一步评估。", "en": "This synthetic, anonymized scenario does not diagnose “addiction” from one behavior or guarantee change. A counselor can first quantify observable effects—missed plans, sleep, spending, chores, and work—and understand whether gaming provides social connection, relief, or achievement. The partners can negotiate protected gaming time, shared time, device-off points, and responsibility for unfinished commitments, followed by review. If use remains out of control, causes marked functional impairment, or includes deception or financial risk, assessment by a qualified professional is advisable."}, "keywords": ["游戏使用", "时间分配", "行为界限", "gaming", "time allocation", "behavioral boundaries", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-179", "faq-193"], "cluster": 7}, {"id": "faq-195", "q": {"zh": "伴侣仍与前任保持联系，双方如何讨论边界而不是互相审讯？", "en": "A partner remains in contact with an ex. How can the couple discuss boundaries without interrogation?"}, "a": {"zh": "以下为合成、匿名化教育案例，不诊断动机、不承诺结果。可先明确联系的背景和功能，例如共同养育、共同朋友圈或普通友谊，再让双方表达具体担忧与可接受范围。边界应围绕行为而非思想控制，例如是否提前告知单独见面、是否在共同养育之外深夜密聊，以及如何保护当前关系的优先事项。透明不等于无限查手机，隐私也不等于秘密。若无法达成一致，双方需诚实评估价值是否相容。", "en": "This synthetic, anonymized educational case neither diagnoses motives nor promises an outcome. Start by clarifying the context and function of contact, such as co-parenting, a shared social group, or ordinary friendship, then let both partners name specific concerns and acceptable limits. Boundaries should concern behavior rather than control of thoughts—for example, notice before one-to-one meetings, late-night private chats beyond co-parenting, and protection of current relationship commitments. Transparency is not unlimited phone inspection, and privacy is not secrecy. If no agreement is possible, the partners may need to assess value compatibility honestly."}, "keywords": ["前任联系", "信任边界", "价值相容", "contact with ex", "trust boundaries", "values compatibility", "boundary", "boundaries", "limits", "边界", "底线", "分寸", "伴侣", "情侣"], "children": ["faq-206", "faq-185"], "cluster": 0}, {"id": "faq-196", "q": {"zh": "两人相处像情侣，但一直没有定义关系，一方越来越焦虑，怎么办？", "en": "Two people act like a couple but have not defined the relationship, and one is increasingly anxious. What can they do?"}, "a": {"zh": "本例是合成、匿名化场景，不诊断任何一方，也不保证关系会升级。焦虑的一方可先明确自己需要的是排他性、稳定联系、未来方向还是一个称谓，再发起直接而不逼迫的对话：“我希望了解我们各自如何定义这段关系。”对方有权不承诺，来访者也有权据此决定是否继续投入。可设置自己能够接受的观察期限和行为底线，避免把模糊承诺当成已达成的协议。", "en": "This is a synthetic, anonymized scenario; it neither diagnoses either person nor guarantees that the relationship will progress. The anxious person can first identify whether they need exclusivity, reliable contact, future direction, or simply a label, then begin a direct, non-coercive conversation: “I would like to understand how each of us defines this relationship.” The other person may decline commitment, and the client may decide how much to invest based on that answer. A personal time horizon and behavioral limits can prevent vague promises from being treated as actual agreements."}, "keywords": ["模糊关系", "关系定义", "排他性", "situationship", "relationship definition", "exclusivity", "anxiety", "anxious", "insecurity", "worry", "overthinking", "焦虑", "不安", "患得患失"], "children": ["faq-199", "faq-210"], "cluster": 17}, {"id": "faq-197", "q": {"zh": "新对象快速示爱、要求全天报备并贬低朋友，这是“太爱”还是风险信号？", "en": "A new partner declares love quickly, demands constant check-ins, and belittles friends. Is this “loving too much” or a warning sign?"}, "a": {"zh": "这是合成且匿名化的教育案例，不凭片段诊断对方，也不保证结果。快速亲密本身不能定性，但要求定位、隔离社交、贬低亲友、惩罚拒绝或推动超出意愿的承诺，可能构成控制风险。来访者可放慢节奏、保留独立账户与社交联系、明确拒绝不愿接受的要求，并把情况告知可信赖的人。若出现威胁、跟踪或暴力，不宜单独对质；应联系当地紧急服务、家暴或专业机构及可信赖的人，制定以安全为先的退出计划。", "en": "This synthetic, anonymized educational case does not diagnose the partner from a fragment or guarantee an outcome. Rapid closeness alone is not conclusive, but location demands, social isolation, belittling loved ones, punishing refusal, or pushing unwanted commitment can signal coercive control. The client may slow the pace, keep independent finances and connections, decline unwanted demands, and tell a trusted person what is happening. If threats, stalking, or violence occur, avoid confronting the person alone; contact local emergency services, domestic-violence or specialist organizations, and trusted people to build a safety-first exit plan."}, "keywords": ["快速示爱", "强制控制", "安全计划", "love bombing", "coercive control", "safety planning", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-195", "faq-192"], "cluster": 0}, {"id": "faq-198", "q": {"zh": "来访者透露伴侣曾推搡、掐脖子并威胁再次伤害，首先该做什么？", "en": "A client says a partner has pushed and strangled them and threatened further harm. What should come first?"}, "a": {"zh": "以下是合成、匿名化的危机示例，不作诊断或结果保证。首要任务是即时安全，而不是伴侣沟通技巧；掐脖子可能带来严重且延迟出现的医疗风险。若危险正在发生，应立即联系当地紧急服务并前往安全地点；即使外表无明显伤痕，也应尽快接受医疗评估。可在安全情况下联系可信赖的人和当地家暴/专业机构，制定包括证件、药物、交通、儿童或宠物安排在内的安全计划。不要在可能引发报复时通知施暴者或自行单独对质；是否报警或离开应结合当地专业建议与本人安全自主权。", "en": "This is a synthetic, anonymized crisis example and provides no diagnosis or guaranteed outcome. Immediate safety—not couple communication—comes first; strangulation can cause serious, delayed medical harm. If danger is occurring now, contact local emergency services and move to a safer place. Seek prompt medical assessment even when there are no visible marks. When safe, contact trusted people and local domestic-violence or specialist services to plan for identification, medication, transport, children, and pets. Do not alert or confront the abusive person alone if doing so could trigger retaliation. Reporting or leaving decisions should be guided by local specialist advice, safety, and the survivor’s autonomy."}, "keywords": ["家庭暴力", "掐脖子风险", "紧急安全", "domestic violence", "strangulation risk", "emergency safety", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-199", "faq-177"], "cluster": 0}, {"id": "faq-199", "q": {"zh": "一方提出分手，另一方威胁“你走我就伤害自己”，该如何回应？", "en": "When one person ends a relationship, the other threatens self-harm if they leave. How should they respond?"}, "a": {"zh": "这是合成、匿名化的高风险场景，不作诊断，也不能保证结果。任何自伤威胁都应认真对待，但一个人不必以继续关系作为交换。若威胁具体、正在实施或危险迫近，应联系当地紧急服务或危机机构，并通知能够到场的可信赖亲友；不要独自承担监护责任或承诺保密。可简洁回应：“我关心你的安全，因此会联系能提供帮助的人，但我不能用维持关系来处理危机。”自身若面临报复风险，也要前往安全地点并联系专业机构。", "en": "This is a synthetic, anonymized high-risk scenario, not a diagnosis or guaranteed result. Every self-harm threat should be taken seriously, but no one must remain in a relationship as the price of safety. If the threat is specific, underway, or imminent, contact local emergency or crisis services and alert a trusted person who can be present; do not carry sole responsibility or promise secrecy. A concise response may be: “I care about your safety, so I am contacting people who can help, but I cannot manage this crisis by staying in the relationship.” If retaliation is possible, move to safety and contact specialist support for yourself as well."}, "keywords": ["自伤威胁", "分手安全", "危机转介", "self-harm threat", "breakup safety", "crisis referral", "breakup", "break", "up", "separation", "split", "分手", "离开", "结束"], "children": ["faq-196", "faq-198"], "cluster": 17}, {"id": "faq-200", "q": {"zh": "咨询中来访者说“不想活了”，但没有主动求助，咨询人员应该如何处理？", "en": "During a session, a client says, “I do not want to live,” without directly asking for help. How should staff respond?"}, "a": {"zh": "以下为合成、匿名化的危机教育场景，不是诊断或结果保证。工作人员应平静、直接地询问当前想法、计划、可用手段、时间紧迫性与保护因素，并遵循机构危机流程及适用法律；直接询问不会“诱发”自杀。若存在即时危险，应联系当地紧急服务或危机机构，尽量不让当事人独处，并在安全范围内联络可信赖的人。线上或跨地区服务要先确认所在地。不得仅用聊天建议替代合资格危机评估，事后应如实记录并安排连续支持。", "en": "This synthetic, anonymized crisis-learning scenario is not a diagnosis or outcome guarantee. Staff should respond calmly and ask directly about current thoughts, plan, access to means, urgency, and protective factors, following organizational crisis procedures and applicable law; asking directly does not “plant” suicide. If danger is imminent, contact local emergency or crisis services, avoid leaving the person alone where feasible, and involve a trusted person within safety and legal limits. For remote or cross-region work, first confirm the person’s location. Chat advice must not replace a qualified crisis assessment; document accurately and arrange continuity of support."}, "keywords": ["自杀风险", "危机评估", "紧急转介", "suicide risk", "crisis assessment", "emergency referral"], "children": ["faq-210", "faq-199"], "cluster": 17}, {"id": "faq-201", "q": {"zh": "分手后前任反复堵门、尾随并创建新账号联系，如何处理？", "en": "After a breakup, an ex repeatedly appears at the door, follows the person, and creates new accounts to contact them. What should be done?"}, "a": {"zh": "本场景为合成、匿名化示例，不作法律结论或风险保证。此类重复行为可能涉及跟踪或骚扰，应把安全置于“解释清楚”之前。若危险正在发生，立即联系当地紧急服务并进入有人、可求助的地点；告知可信赖的人、单位或住所安保，并在不增加风险时保存日期、截图、来访记录与证人信息。不要单独见面谈判或透露实时位置。可向当地反跟踪、家暴、法律援助或执法专业渠道了解保护措施，具体选项以当地法律为准。", "en": "This synthetic, anonymized example is not a legal conclusion or risk guarantee. Repeated conduct of this kind may constitute stalking or harassment, so safety comes before “explaining things.” If danger is occurring, contact local emergency services and move to a populated place where help is available. Alert trusted people and workplace or building security, and—only when it does not increase risk—preserve dates, screenshots, visit logs, and witness details. Do not meet alone or share a live location. Local anti-stalking, domestic-violence, legal-aid, or law-enforcement specialists can explain protective options under applicable law."}, "keywords": ["跟踪骚扰", "证据保存", "人身安全", "stalking", "evidence preservation", "personal safety", "breakup", "break", "up", "separation", "split", "分手", "离开", "结束"], "children": ["faq-178", "faq-078"], "cluster": 11}, {"id": "faq-202", "q": {"zh": "网恋对象拒绝视频并以紧急理由借钱，来访者又怕“不帮就是不爱”，怎么办？", "en": "An online romantic interest avoids video calls and requests emergency money, while the client fears that refusing means they do not care. What can they do?"}, "a": {"zh": "这是合成、匿名化案例，不对对方身份下结论，也不保证追回损失。拒绝核验身份、制造紧迫感、要求转账或保密是常见风险信号。来访者可停止付款和提供证件、验证码或私密影像，通过独立渠道核验，而不是点击对方发送的链接。若已转账，应尽快联系银行或支付平台及当地反诈/执法渠道，保存聊天和交易记录，并向可信赖的人求助。羞耻感不应阻止求助；咨询可支持情绪恢复，但不能替代金融或法律处理。", "en": "This synthetic, anonymized case does not determine the other person’s identity or guarantee recovery of losses. Refusing identity verification, creating urgency, requesting transfers, and demanding secrecy are common warning signs. The client can stop payments and stop sharing identification, verification codes, or intimate images, then verify through independent channels rather than links supplied by the person. If money was sent, promptly contact the bank or payment platform and local anti-fraud or law-enforcement channels, preserve messages and transaction records, and seek help from someone trusted. Shame should not prevent help-seeking; counseling can support emotional recovery but cannot replace financial or legal action."}, "keywords": ["网恋诈骗", "金融安全", "身份核验", "romance scam", "financial safety", "identity verification", "safety", "crisis", "emergency", "self", "harm", "suicide", "domestic", "violence"], "children": ["faq-181", "faq-196"], "cluster": 0}, {"id": "faq-203", "q": {"zh": "家长发现青少年恋爱后想没收手机，怎样兼顾安全与信任？", "en": "A parent discovers a teenager is dating and wants to confiscate the phone. How can safety and trust both be considered?"}, "a": {"zh": "以下是合成且匿名化的教育场景，不诊断青少年或家庭，也不保证结果。家长可先控制惊讶与评判，用适龄方式询问关系是否自愿、双方年龄、线上线下安全、避孕与性健康知识，以及是否存在威胁、裸照索取或权力差异。规则应清楚、比例适当并说明理由，同时为青少年保留合理隐私和求助渠道；全面监控可能让风险转入地下。涉及未成年人同意年龄、影像或保护义务时，应依当地法律并咨询合资格专业人士。", "en": "This synthetic, anonymized educational scenario neither diagnoses the teenager or family nor guarantees an outcome. The parent can regulate their initial reaction and ask age-appropriate, nonjudgmental questions about voluntariness, ages, online and offline safety, contraception and sexual health, threats, requests for intimate images, and power differences. Rules should be clear, proportionate, and explained, while preserving reasonable privacy and a route to ask for help; total surveillance may drive risk underground. Age-of-consent, image, and safeguarding duties depend on local law and should be discussed with qualified professionals."}, "keywords": ["青少年恋爱", "家长沟通", "未成年人保护", "teen dating", "parent communication", "safeguarding", "trust", "jealousy", "checking", "phone", "insecure", "信任", "安全感", "查手机"], "children": ["faq-177", "faq-179"], "cluster": 0}, {"id": "faq-204", "q": {"zh": "独居长者开始新的亲密关系，成年子女强烈反对，咨询如何平衡自主与保护？", "en": "An older adult living alone begins a new relationship, and adult children strongly object. How can counseling balance autonomy and protection?"}, "a": {"zh": "本例为合成、匿名化情境，不诊断认知能力，也不保证关系安全或结果。只要成年人具备相应决定能力，其亲密与陪伴选择应被尊重；年龄本身不等于无能力。可在不羞辱或夺权的前提下讨论财务边界、共同居住、医疗授权、网络诈骗和独立法律意见，并鼓励保留社交支持。若出现突然的大额转账、胁迫、隔离或明显认知变化，应由适当的医疗、社会服务或法律专业人员依当地程序评估，而非由家人自行下结论。", "en": "This synthetic, anonymized scenario does not diagnose decision-making capacity or guarantee relationship safety or outcome. An adult who has relevant decision-making capacity retains autonomy over intimacy and companionship; age alone does not establish incapacity. Without shaming or taking over, the family can discuss financial limits, cohabitation, healthcare authority, online scams, independent legal advice, and continued social support. Sudden large transfers, coercion, isolation, or marked cognitive changes warrant assessment by appropriate medical, social-service, or legal professionals under local procedures rather than a family verdict."}, "keywords": ["老年亲密关系", "自主权", "财务保护", "older-adult relationships", "autonomy", "financial safeguarding"], "children": ["faq-234", "faq-070"], "cluster": 20}, {"id": "faq-205", "q": {"zh": "新生儿出生后夫妻频繁争吵，一方持续绝望和失眠，该怎么分层处理？", "en": "After a baby’s birth, a couple argues frequently and one partner has persistent hopelessness and insomnia. How should priorities be set?"}, "a": {"zh": "这是合成、匿名化案例，不据此诊断产后抑郁或其他疾病，也不保证结果。应先评估父母与婴儿的即时安全、自伤或伤人想法、极度混乱及是否能完成基本照护；如有紧迫风险，立即联系当地紧急服务、可信赖的人及医疗专业机构。即使没有危机，持续绝望和严重失眠也应尽快接受合资格医疗或心理健康评估。关系层面可暂时降低非必要标准，安排轮班休息、具体求助和短时沟通；伴侣咨询不能替代产后医疗照护。", "en": "This synthetic, anonymized case does not diagnose postpartum depression or another condition and cannot guarantee results. First assess immediate safety for the adults and baby, including thoughts of self-harm or harm, severe confusion, and ability to provide basic care. Urgent danger requires local emergency services, trusted people, and medical professionals immediately. Even without a crisis, persistent hopelessness and severe insomnia warrant prompt assessment by qualified medical or mental-health providers. At the relationship level, temporarily lower nonessential standards, arrange shifts for rest and concrete help, and use brief check-ins; couple counseling cannot replace postpartum healthcare."}, "keywords": ["产后支持", "新生儿家庭", "医疗转介", "postpartum support", "new parents", "medical referral", "沟通", "吵架", "争吵", "冲突", "矛盾", "伴侣", "情侣", "夫妻"], "children": ["faq-183", "faq-209"], "cluster": 0}, {"id": "faq-206", "q": {"zh": "慢性病让一方成为主要照护者并逐渐耗竭，双方如何谈需要？", "en": "Chronic illness has turned one partner into the main caregiver, who is becoming depleted. How can both discuss their needs?"}, "a": {"zh": "以下是合成、匿名化的教育案例，不诊断病情或照护者状态，也不承诺改善。咨询可承认患者的失落与照护者的疲惫可以同时存在，避免把休息等同于不爱。双方可列出必须由伴侣完成、可由亲友分担及可由专业服务承担的任务，设置休息时段、紧急联系人和医疗信息授权边界。医疗决定应由合资格团队处理。若照护者出现严重耗竭、自伤想法或无法保障基本安全，应立即联系当地紧急服务、可信赖的人和专业机构。", "en": "This synthetic, anonymized educational case neither diagnoses the illness or caregiver condition nor promises improvement. Counseling can validate that the ill partner’s losses and the caregiver’s exhaustion coexist; needing rest is not a lack of love. The couple can sort tasks into those the partner must do, those trusted people can share, and those professional services may provide, while setting respite time, emergency contacts, and boundaries around access to medical information. Qualified healthcare teams should handle medical decisions. Severe depletion, self-harm thoughts, or inability to maintain basic safety requires immediate contact with local emergency services, trusted people, and professional organizations."}, "keywords": ["慢性病", "照护者耗竭", "支持网络", "chronic illness", "caregiver burnout", "support network"], "children": ["faq-191", "faq-195"], "cluster": 11}, {"id": "faq-207", "q": {"zh": "一方怀疑自己是神经多样性人士，双方沟通常常错位，可以如何调整？", "en": "One partner wonders whether they are neurodivergent, and communication often misaligns. What adjustments may help?"}, "a": {"zh": "本场景为合成与匿名化案例，不据此诊断自闭症、ADHD或其他状况，也不保证结果。无需先确定标签，双方即可测试低风险的便利措施，例如把重要安排书面化、一次只谈一个议题、提前告知变化、允许处理信息的暂停时间，并明确表达而非暗示。咨询师应避免把所有冲突归因于某一方的神经类型，也要维护双方界限。若本人希望正式评估，可转介具相关资质与经验的专业人员。", "en": "This synthetic, anonymized case does not diagnose autism, ADHD, or another condition and offers no guaranteed outcome. The couple can test low-risk accommodations without first settling a label: put important plans in writing, discuss one topic at a time, give advance notice of changes, allow processing pauses, and communicate explicitly rather than relying on hints. A counselor should not attribute every conflict to one person’s neurotype and should protect both partners’ boundaries. If the individual wants a formal assessment, referral to an appropriately qualified and experienced professional is suitable."}, "keywords": ["神经多样性", "沟通便利", "非诊断支持", "neurodiversity", "communication accommodations", "non-diagnostic support", "沟通", "吵架", "争吵", "冲突", "矛盾"], "children": ["faq-181", "faq-180"], "cluster": 0}, {"id": "faq-208", "q": {"zh": "伴侣宗教信仰不同，对节日、饮食和孩子教育意见相左，是否注定不合？", "en": "Partners have different faiths and disagree on holidays, food, and children’s education. Are they inevitably incompatible?"}, "a": {"zh": "这是合成、匿名化教育情境，不评判任何信仰，也不预测关系结果。差异本身不等于不相容，关键是能否在不强迫改信或贬低对方的前提下达成可执行安排。双方可分别说明核心教义、文化习惯与个人偏好，具体讨论仪式参与、饮食空间、家庭压力和孩子接触哪些传统，并把未来可能变化纳入计划。若核心要求彼此排斥，应诚实承认，而不是依赖婚后自然解决的假设。可邀请双方认可且尊重多元的宗教或文化顾问参与。", "en": "This synthetic, anonymized educational scenario neither judges any faith nor predicts the relationship’s outcome. Difference alone does not equal incompatibility; the key is whether workable agreements are possible without forced conversion or contempt. Each person can distinguish core doctrine, cultural practice, and personal preference, then discuss participation in rituals, food arrangements, family pressure, and which traditions children may encounter, including how plans could change. Mutually exclusive core requirements should be acknowledged honestly rather than assumed to disappear after marriage. A mutually accepted religious or cultural adviser who respects pluralism may help."}, "keywords": ["跨信仰关系", "宗教差异", "价值规划", "interfaith relationship", "religious difference", "values planning", "伴侣", "情侣", "夫妻", "恋爱", "对象", "家庭", "父母", "家长"], "children": ["faq-043", "faq-185"], "cluster": 13}, {"id": "faq-209", "q": {"zh": "临近婚礼却持续犹豫，是否说明不该结婚？", "en": "Persistent doubts arise close to the wedding. Does that mean the person should not marry?"}, "a": {"zh": "以下为合成、匿名化案例，不诊断焦虑，也不保证任何决定的结果。临近重大承诺出现紧张很常见，但持续疑虑值得认真了解，不能仅因订金、宾客期待或“丢脸”而忽视。可区分一般婚前压力与具体问题，如安全、信任、价值、债务、生育、家庭边界或被迫感；必要时暂停或延期，以获得知情决定的空间。咨询师不会催促结婚或分手。若存在胁迫、威胁或暴力，应联系当地专业机构、可信赖的人及必要的紧急服务。", "en": "This synthetic, anonymized case does not diagnose anxiety or guarantee the result of any decision. Nervousness before a major commitment is common, but persistent doubts deserve attention and should not be dismissed because of deposits, guest expectations, or embarrassment. Separate general wedding stress from concrete concerns involving safety, trust, values, debt, children, family boundaries, or coercion. Pausing or postponing may create room for informed choice. A counselor should not push marriage or separation. Coercion, threats, or violence require contact with local specialist organizations, trusted people, and emergency services when needed."}, "keywords": ["婚前犹豫", "知情决定", "婚礼压力", "premarital doubts", "informed decision", "wedding pressure", "marriage", "divorce", "wedding", "remarriage", "复婚", "结婚", "婚姻", "离婚"], "children": ["faq-058", "faq-205"], "cluster": 20}, {"id": "faq-210", "q": {"zh": "接受几次咨询后感觉没有进展，来访者可以怎样评估是否继续？", "en": "After several sessions with little perceived progress, how can a client assess whether to continue?"}, "a": {"zh": "本案例为合成、匿名化场景，不诊断关系或咨询师，也不保证更换服务就会成功。来访者可与咨询师回到初始目标，询问目前工作假设、衡量进展的方法、已尝试策略和预计复盘节点，并坦诚说明哪些部分无帮助或不安全。咨询师应能接纳反馈、解释方法与限制，并讨论调整频率、方式、转介或结束服务。若出现越界、歧视、强迫保密之外的秘密、财务不透明或依赖操控，可停止服务并依据当地机制寻求第二意见或投诉。", "en": "This synthetic, anonymized scenario neither diagnoses the relationship or counselor nor guarantees success after changing services. The client can revisit the original goals, ask about the current working formulation, how progress is measured, what has been tried, and when review is expected, while naming what feels unhelpful or unsafe. A counselor should be able to receive feedback, explain methods and limits, and discuss changes in frequency or approach, referral, or planned ending. Boundary violations, discrimination, demands for improper secrecy, opaque charges, or dependency manipulation justify stopping and seeking a second opinion or using applicable local complaint channels."}, "keywords": ["咨询评估", "进展复盘", "结束与转介", "counseling review", "progress evaluation", "ending and referral ================================================================================"], "children": ["faq-179", "faq-200"], "cluster": 7}, {"id": "faq-211", "q": {"zh": "情感快线通常为什么需要收集来访者信息？", "en": "Why might Emotional Express collect client information?"}, "a": {"zh": "为提供预约、匹配、咨询、付款、质量与安全支持，服务方可能需要处理联系信息、预约记录、来访者主动提供的背景资料以及必要的服务记录。收集范围应遵循目的明确、最少必要和透明原则，不应因为“以后可能有用”而无限收集。实际收集项目、处理目的、法律依据、共享对象及保存安排，请以情感快线向来访者展示的现行隐私通知、正式服务协议与适用法律为准；来访者可在提交前询问某项信息是否必填及拒绝提供的影响。", "en": "To support booking, matching, counseling, payment, quality, and safety, the service may process contact details, appointment records, background information voluntarily supplied by the client, and necessary service notes. Collection should be purpose-specific, minimal, and transparent rather than unlimited “in case it is useful later.” The actual data fields, purposes, legal bases, recipients, and retention arrangements are governed by Emotional Express’s current privacy notice, formal service agreement, and applicable law. Clients may ask whether a field is required and what happens if they decline before submitting it."}, "keywords": ["信息收集", "数据最小化", "隐私通知", "data collection", "data minimization", "privacy notice"], "children": ["faq-021", "faq-001"], "cluster": 0}, {"id": "faq-212", "q": {"zh": "咨询内容是否绝对保密？", "en": "Is counseling content absolutely confidential?"}, "a": {"zh": "保密是服务的重要原则，但通常不是没有例外的绝对承诺。依法或依专业义务，涉及本人或他人的迫近严重危险、未成年人或弱势人士保护、法院或监管机关的有效要求，以及来访者明确授权等情形，可能需要有限披露。披露应在法律允许范围内尽量只限于必要信息，并尽可能向来访者说明。情感快线的具体保密范围、例外、团队内部督导安排和处理程序，以签署前提供的正式服务协议、隐私通知及适用法律为准。", "en": "Confidentiality is a core service principle, but it is generally not an exception-free promise. Limited disclosure may be required by law or professional duty where there is imminent serious danger to the client or others, safeguarding of minors or vulnerable people, a valid court or regulatory demand, or the client’s explicit authorization. Where legally permitted, disclosure should be limited to what is necessary and explained to the client where feasible. Emotional Express’s exact confidentiality scope, exceptions, internal supervision arrangements, and procedures are governed by the formal service agreement, privacy notice, and applicable law provided before engagement."}, "keywords": ["保密原则", "保密例外", "必要披露", "confidentiality", "exceptions", "necessary disclosure", "confidential", "privacy", "private", "anonymous", "保密", "隐私", "匿名"], "children": ["faq-213", "faq-219"], "cluster": 47}, {"id": "faq-213", "q": {"zh": "若咨询中出现自伤、他伤或暴力风险，情感快线会如何处理信息？", "en": "How may Emotional Express handle information when self-harm, harm to others, or violence risk arises?"}, "a": {"zh": "工作人员应先评估紧迫性、确认当事人所在地，并依据机构危机流程、专业义务与适用法律行动。若危险迫近，可能需要联系当地紧急服务、危机专业机构或能够协助安全的可信赖人士，即使无法维持通常的保密范围；只应披露实现安全目的所必要的信息。聊天或普通咨询不能替代紧急救援。处于即时危险的人应立即联系当地紧急服务、可信赖的人和合资格专业机构。具体联络、记录及告知程序以正式协议和适用法律为准。", "en": "Staff should assess urgency, confirm the person’s location, and act under organizational crisis procedures, professional duties, and applicable law. If danger is imminent, they may need to contact local emergency services, specialist crisis organizations, or a trusted person able to support safety, even when ordinary confidentiality cannot be maintained; only information necessary for the safety purpose should be disclosed. Chat or routine counseling is not emergency response. Anyone in immediate danger should contact local emergency services, trusted people, and qualified professional organizations now. Exact contact, documentation, and notification procedures are governed by formal terms and applicable law."}, "keywords": ["危机保密", "安全披露", "紧急服务", "crisis confidentiality", "safety disclosure", "emergency services", "safety", "crisis", "emergency", "self", "harm", "suicide", "domestic", "violence"], "children": ["faq-166", "faq-030"], "cluster": 0}, {"id": "faq-214", "q": {"zh": "未成年人可以自行预约情感咨询吗？", "en": "May a minor book relationship counseling independently?"}, "a": {"zh": "未成年人能否自行同意、谁可查看记录、何时必须通知监护人，以及机构承担何种保护义务，会因所在地、年龄、服务类型与风险状况而不同。情感快线不应给出一概而论的答案，应在预约前核实适用规则，并以正式未成年人服务说明、监护人同意文件和当地法律为准。即使需要监护人参与，也应向未成年人说明隐私边界并尽量尊重其声音。若存在虐待、性剥削、自伤或即时危险，应联系当地儿童保护、紧急服务、可信赖成年人及合资格专业机构。", "en": "Whether a minor can consent independently, who may access records, when a guardian must be notified, and what safeguarding duties apply vary by location, age, service type, and risk. Emotional Express should not give a one-size-fits-all answer; applicable requirements must be checked before booking and are governed by formal minor-service information, guardian consent documents, and local law. Even where guardian participation is required, the minor should be told the privacy boundaries and have their voice respected as far as possible. Abuse, sexual exploitation, self-harm, or immediate danger requires local child-protection or emergency services, a trusted adult, and qualified professional help."}, "keywords": ["未成年人", "监护同意", "儿童保护", "minors", "guardian consent", "safeguarding", "book", "booking", "appointment", "schedule", "session", "start", "get", "started"], "children": ["faq-013", "faq-219"], "cluster": 0}, {"id": "faq-215", "q": {"zh": "伴侣共同咨询时，一方私下告诉咨询师的内容会对另一方保密吗？", "en": "In joint couple counseling, will information privately shared by one partner be kept from the other?"}, "a": {"zh": "不同服务可能采用“不替任何一方长期保守影响共同工作的秘密”、有限个人会谈或其他模式，因此必须在开始前明确约定，不能临时猜测。咨询师应说明谁是服务对象、记录如何管理、什么信息可能进入共同会谈、风险披露例外及一方退出后的处理。来访者在私下分享前可先询问规则。情感快线实际采用的共同咨询保密政策，以双方确认的正式知情同意书、服务协议及适用法律为准；安全与强制控制风险可能需要另行安排。", "en": "Services may use a “no long-term secrets affecting the joint work” approach, limited individual check-ins, or another model, so the rule must be clarified before work begins rather than assumed later. The counselor should explain who the client is, how records are managed, what may be brought into joint sessions, risk-disclosure exceptions, and what happens if one person withdraws. A participant can ask about the rule before sharing privately. Emotional Express’s actual joint-counseling confidentiality policy is governed by the informed-consent document, formal service agreement accepted by both participants, and applicable law; safety or coercive-control concerns may require a different arrangement."}, "keywords": ["伴侣咨询", "秘密政策", "共同知情同意", "couple counseling", "secrets policy", "joint informed consent", "confidential", "confidentiality", "privacy", "private", "anonymous", "保密", "隐私", "匿名"], "children": ["faq-249", "faq-233"], "cluster": 0}, {"id": "faq-216", "q": {"zh": "来访者或咨询师可以录音、录像或截图吗？", "en": "May clients or counselors record audio, video, or screenshots?"}, "a": {"zh": "未经所有相关人员事先明确同意，不应擅自录音、录像、截屏或传播会谈内容；某些地区即使一方同意也可能受到更严格法律限制。因督导、培训、无障碍或个人复习确需记录时，应提前说明用途、访问者、存储、保存期限、撤回方式及不参加是否影响服务，并取得符合要求的同意。情感快线的具体录制政策以正式协议、单独授权文件和适用法律为准。涉及第三人的资料尤其需要谨慎处理。", "en": "Audio, video, screenshots, or distribution of session content should not occur without advance, explicit consent from all relevant people; some jurisdictions impose stricter legal requirements even when one person consents. If recording is proposed for supervision, training, accessibility, or personal review, the purpose, viewers, storage, retention, withdrawal process, and consequences of declining should be explained in advance, with legally valid consent obtained. Emotional Express’s actual recording policy is governed by formal terms, any separate authorization, and applicable law. Information about third parties requires particular care."}, "keywords": ["会谈录制", "明确同意", "影像隐私", "session recording", "explicit consent", "media privacy"], "children": ["faq-022", "faq-221"], "cluster": 0}, {"id": "faq-217", "q": {"zh": "情感快线使用AI辅助服务时，应向来访者说明什么？", "en": "What should Emotional Express disclose when AI assists the service?"}, "a": {"zh": "应清楚说明AI用于哪些环节，例如一般问答、内容整理或人工服务辅助；哪些环节由人复核；数据是否会发送给第三方；以及AI的局限、错误风险和退出或转人工方式。不得把AI输出冒充临床诊断、法律结论或确定性预测，也不应把敏感内容用于与服务无关的模型训练，除非有明确合法依据和透明同意。实际AI数据处理、供应商、保存和权利安排，以现行隐私通知、正式协议、供应商条款及适用法律为准。", "en": "The service should clearly explain where AI is used—for example, general Q&A, content organization, or support for human-delivered services—what receives human review, whether data goes to third parties, the system’s limitations and error risks, and how to opt out or reach a person where available. AI output must not be presented as a clinical diagnosis, legal conclusion, or certain prediction. Sensitive content should not be used for unrelated model training without a clear lawful basis and transparent consent. Actual AI processing, providers, retention, and rights are governed by the current privacy notice, formal agreement, vendor terms, and applicable law."}, "keywords": ["AI透明度", "人工复核", "数据用途", "AI transparency", "human review", "data use"], "children": ["faq-174", "faq-024"], "cluster": 37}, {"id": "faq-218", "q": {"zh": "线上服务涉及跨境传输数据时，隐私如何保障？", "en": "How is privacy addressed when online services involve cross-border data transfers?"}, "a": {"zh": "数据可能因云服务、支付、客服或专业人员所在地而跨境处理。服务方应说明可能涉及的国家或地区、接收方类别、传输依据与保护措施，以及不同司法辖区的隐私保护可能存在差异。来访者可询问是否有本地化或替代渠道。情感快线是否发生跨境传输、采用何种合同或技术措施及来访者拥有哪些权利，不能在FAQ中预设，须以现行隐私通知、正式协议、供应商安排和适用数据保护法律为准。", "en": "Data may be processed across borders because of cloud, payment, support, or practitioner locations. The service should explain relevant countries or regions, recipient categories, transfer grounds and safeguards, and the possibility that privacy protections differ between jurisdictions. Clients may ask whether a localized or alternative channel is available. Whether Emotional Express transfers data internationally, which contractual or technical safeguards it uses, and what rights apply cannot be presumed in an FAQ; these are governed by its current privacy notice, formal terms, vendor arrangements, and applicable data-protection law."}, "keywords": ["跨境数据", "数据保护", "云服务", "cross-border data", "data protection", "cloud services", "confidential", "confidentiality", "privacy", "private", "anonymous", "保密", "隐私", "匿名"], "children": ["faq-012", "faq-174"], "cluster": 0}, {"id": "faq-219", "q": {"zh": "咨询记录会保存多久，来访者能要求删除吗？", "en": "How long are counseling records retained, and may a client request deletion?"}, "a": {"zh": "保存期限和删除权会受到服务性质、专业记录义务、税务或争议处理需要、未成年人保护及当地法律影响，因此不应虚构统一年限。服务方应公布记录类别、保存标准、到期处置方式及合法保留例外。来访者可以按现行渠道提出删除或限制处理请求，但某些记录可能因法律义务或权利主张而暂不能删除，服务方应说明理由。情感快线的准确期限、身份核验和申请流程，以现行隐私通知、正式服务协议及适用法律为准。", "en": "Retention periods and deletion rights depend on service type, professional record duties, tax or dispute needs, minor safeguarding, and local law, so no universal number should be invented. The service should publish record categories, retention criteria, disposal methods, and lawful retention exceptions. A client may submit a deletion or restriction request through current channels, but some records may need to remain because of legal duties or the establishment or defense of claims; the reason should be explained. Emotional Express’s exact periods, identity checks, and request process are governed by its current privacy notice, formal service agreement, and applicable law."}, "keywords": ["记录保存", "删除请求", "法定保留", "record retention", "deletion request", "legal hold"], "children": ["faq-214", "faq-013"], "cluster": 0}, {"id": "faq-220", "q": {"zh": "来访者可以查看或更正自己的资料吗？", "en": "Can clients access or correct their personal information?"}, "a": {"zh": "在适用法律赋予相关权利的范围内，来访者通常可通过指定渠道申请访问、更正或获取部分个人资料副本。服务方可能需要核验身份，并依法遮蔽他人信息、专业保密内容或受限制材料；访问权不一定意味着可以改写咨询师的专业观察，但可要求纠正客观错误或附上来访者说明。具体可访问范围、回复时限、费用（如法律允许）及申诉路径，以情感快线现行隐私通知、正式协议与适用法律为准。", "en": "To the extent granted by applicable law, clients may generally request access to, correction of, or a copy of certain personal information through a designated channel. The service may verify identity and lawfully redact other people’s data, privileged material, or restricted content. Access does not necessarily permit rewriting a practitioner’s professional observations, but factual errors may be corrected or the client’s statement appended. The accessible scope, response period, any legally permitted charge, and appeal route are governed by Emotional Express’s current privacy notice, formal agreement, and applicable law."}, "keywords": ["访问权", "资料更正", "身份核验", "access rights", "data correction", "identity verification"], "children": ["faq-211", "faq-006"], "cluster": 0}, {"id": "faq-221", "q": {"zh": "情感快线可以把来访者评价或故事用于宣传吗？", "en": "May Emotional Express use a client testimonial or story in marketing?"}, "a": {"zh": "未经独立、明确、知情且可证明的授权，不应把可识别的评价、聊天截图、照片、声音或经历用于宣传。是否同意营销使用不应成为获得核心服务的条件，拒绝或撤回不应受到报复；即使去掉姓名，独特细节也可能重新识别当事人。涉及真实案例时还需考虑专业伦理是否允许。实际授权范围、撤回后对已发布材料的处理及法律限制，以单独同意文件、正式协议和适用法律为准。更安全的做法是优先使用明确标注的合成示例。", "en": "Identifiable testimonials, chat screenshots, images, voices, or experiences should not be used in marketing without separate, explicit, informed, and demonstrable authorization. Consent to marketing should not be a condition of core service, and refusal or withdrawal should not bring retaliation. Removing a name may still leave unique details that identify someone, and professional ethics may further restrict use of real cases. The authorization scope, treatment of published material after withdrawal, and legal limits are governed by a separate consent form, formal terms, and applicable law. Clearly labeled synthetic examples are generally safer."}, "keywords": ["客户评价", "营销同意", "可识别信息", "testimonials", "marketing consent", "identifiable information"], "children": ["faq-216", "faq-167"], "cluster": 0}, {"id": "faq-222", "q": {"zh": "用于培训或知识库的案例怎样才算匿名化？", "en": "What makes a case sufficiently anonymized for training or a knowledge base?"}, "a": {"zh": "仅改姓名通常不足够；应删除或概括日期、地点、职业、家庭结构、罕见事件、原句和其他可组合识别的信息，并评估熟人能否据此认出当事人。可优先使用由多个常见模式重新创作的合成案例，且明确标注为合成，不暗示是真实成功故事。若确需使用真实材料，应确认合法依据、专业伦理和必要授权，并限制访问。具体匿名化标准、复核流程与用途，以情感快线正式数据治理制度、服务协议和适用法律为准。", "en": "Changing a name is rarely enough. Dates, locations, occupations, family structure, rare events, exact wording, and other linkable details should be removed or generalized, followed by an assessment of whether acquaintances could still recognize the person. Prefer synthetic cases rebuilt from multiple common patterns and label them as synthetic rather than implying a true success story. If real material is necessary, confirm the lawful basis, professional ethics, any required authorization, and access controls. Emotional Express’s exact de-identification standard, review process, and permitted uses are governed by its formal data-governance rules, service terms, and applicable law."}, "keywords": ["匿名化", "合成案例", "再识别风险", "anonymization", "synthetic cases", "re-identification risk", "confidential", "confidentiality", "privacy", "private", "anonymous", "保密", "隐私", "匿名"], "children": ["faq-270", "faq-045"], "cluster": 48}, {"id": "faq-223", "q": {"zh": "情感快线如何提高线上咨询的技术安全性？", "en": "How can Emotional Express improve the technical security of online counseling?"}, "a": {"zh": "合理措施可包括选择适合敏感沟通的平台、传输加密、严格账号权限、多因素认证、更新与漏洞管理、安全备份、员工培训和事件响应，但任何系统都不能承诺零风险。服务方应说明平台及重要限制，避免通过不必要的公开渠道传递敏感材料。实际采用的安全控制、认证和责任分配，以情感快线现行安全说明、隐私通知、正式协议及供应商条款为准。来访者发现异常登录或误发信息时，应尽快通过官方渠道报告。", "en": "Reasonable measures may include a platform suitable for sensitive communication, encryption in transit, strict account permissions, multi-factor authentication, updates and vulnerability management, secure backups, staff training, and incident response; no system can promise zero risk. The service should identify the platform and material limitations and avoid unnecessary use of public channels for sensitive content. Controls, certifications, and responsibility allocation actually used are governed by Emotional Express’s current security information, privacy notice, formal terms, and vendor terms. Clients should promptly report suspicious login activity or misdirected information through an official channel."}, "keywords": ["网络安全", "线上咨询", "账号保护", "cybersecurity", "online counseling", "account protection", "安全", "紧急", "自伤", "自杀", "家暴", "危机", "暴力"], "children": ["faq-005", "faq-002"], "cluster": 1}, {"id": "faq-224", "q": {"zh": "来访者在家参加线上咨询时，怎样减少被他人听到的风险？", "en": "How can a client reduce the risk of being overheard during an online session at home?"}, "a": {"zh": "可选择能关门的私密空间、使用耳机、关闭智能音箱或不必要设备通知，并与同住者约定不打扰时段。若无法确保隐私，可与咨询人员商量改用文字、调整时间或在合法安全的其他地点参与；不宜在驾驶或可能被控制者监视时进行敏感会谈。开始时可确认安全用语和意外中断后的联络方式。线上参与的具体技术要求及紧急安排，以情感快线正式服务说明和适用法律为准。", "en": "Choose a private room with a door where possible, use headphones, disable smart speakers and unnecessary device notifications, and agree on an uninterrupted period with housemates. If privacy is not feasible, ask the practitioner about text, a different time, or another lawful and safe location. Do not hold a sensitive session while driving or under observation by a controlling person. At the start, confirm a safety phrase and how contact will resume after an unexpected interruption. Exact technical and emergency arrangements are governed by Emotional Express’s formal service information and applicable law."}, "keywords": ["居家隐私", "线上会谈", "安全用语", "home privacy", "tele-session", "safety phrase"], "children": ["faq-060", "faq-039"], "cluster": 49}, {"id": "faq-225", "q": {"zh": "预约、支付或视频平台等第三方会接触哪些数据？", "en": "What data may third-party booking, payment, or video platforms receive?"}, "a": {"zh": "第三方通常只应获得完成其功能所必要的数据，例如预约联系信息、交易信息或连接会话所需的技术数据，但实际范围取决于供应商配置。情感快线应在隐私通知中列明接收方类别、处理目的、跨境情况及重要风险，并通过合同和权限控制限制使用。支付卡等敏感金融信息是否由服务方直接接触也应说明。准确的数据流、供应商名称与退出选项，以现行隐私通知、供应商条款、正式协议和适用法律为准。", "en": "A third party should generally receive only what is needed for its function, such as booking contact details, transaction information, or technical data required to connect a session, but actual scope depends on vendor configuration. Emotional Express should identify recipient categories, purposes, cross-border implications, and material risks in its privacy notice and limit use through contracts and permissions. It should also explain whether the service itself sees sensitive payment-card data. Exact data flows, vendor names, and opt-out options are governed by the current privacy notice, vendor terms, formal agreement, and applicable law."}, "keywords": ["第三方平台", "数据共享", "支付隐私", "third-party platforms", "data sharing", "payment privacy", "book", "booking", "appointment", "schedule", "session", "start", "get", "started"], "children": ["faq-021", "faq-217"], "cluster": 0}, {"id": "faq-226", "q": {"zh": "如果发生疑似数据泄露，情感快线和来访者分别应做什么？", "en": "If a suspected data breach occurs, what should Emotional Express and the client each do?"}, "a": {"zh": "服务方应立即控制事件、保存调查证据、评估涉及的数据与风险、修复原因，并依适用法律在要求的范围和时限内通知监管机关及受影响人员；通知应包含可执行的防护建议，而非淡化风险。来访者收到通知或发现异常时，可更改独立密码、启用多因素认证、警惕冒充联系，并通过官方渠道核验。不得承诺所有事件都能完全消除影响。实际响应、通知标准和补救措施，以情感快线事件响应制度、正式协议及适用法律为准。", "en": "The service should promptly contain the event, preserve investigative evidence, assess affected data and risk, fix the cause, and notify regulators and affected people within the scope and timing required by applicable law. Notices should offer actionable protective steps rather than minimize risk. A client who receives notice or sees suspicious activity can change unique passwords, enable multi-factor authentication, watch for impersonation, and verify communications through an official channel. No service should promise that every consequence can be eliminated. Actual response, notification thresholds, and remedies are governed by Emotional Express’s incident-response rules, formal terms, and applicable law."}, "keywords": ["数据泄露", "事件响应", "账号安全", "data breach", "incident response", "account security"], "children": ["faq-217", "faq-230"], "cluster": 37}, {"id": "faq-227", "q": {"zh": "咨询人员可以与来访者发展朋友、商业或恋爱关系吗？", "en": "May a practitioner develop a friendship, business relationship, or romance with a client?"}, "a": {"zh": "专业关系存在信任与权力差异，叠加朋友、商业、性或恋爱关系容易造成利益冲突、依赖、剥削或保密混乱，通常应避免，某些关系可能被专业规则明确禁止。咨询人员应在开始时说明界限，必要时进行督导或转介，不应利用来访者的脆弱处境获取私人利益。具体禁止范围、终止服务后的限制和举报渠道，取决于人员资质、情感快线伦理制度、正式协议及适用法律。来访者感到被施压时有权停止并寻求独立意见。", "en": "A professional relationship carries trust and power differences. Adding friendship, business, sexual, or romantic roles can create conflicts, dependency, exploitation, and confidentiality confusion and should generally be avoided; some relationships may be expressly prohibited by professional rules. Practitioners should explain boundaries at the outset, seek supervision or refer when needed, and never use a client’s vulnerability for private benefit. Exact prohibitions, post-termination restrictions, and reporting routes depend on credentials, Emotional Express’s ethics rules, formal terms, and applicable law. A client who feels pressured may stop and seek independent advice."}, "keywords": ["双重关系", "专业界限", "利益冲突", "dual relationships", "professional boundaries", "conflict of interest", "伴侣", "情侣", "夫妻", "恋爱", "对象"], "children": ["faq-068", "faq-008"], "cluster": 0}, {"id": "faq-228", "q": {"zh": "来访者可以给咨询人员送礼或收取其私人礼物吗？", "en": "May a client give a practitioner a gift or accept a personal gift from them?"}, "a": {"zh": "礼物需要结合价值、文化含义、时机、频率、是否期待回报及可能形成的压力评估。昂贵、秘密、带条件或可能影响专业判断的礼物通常不宜接受；咨询人员也不应借礼物建立私人义务或诱导消费。对于象征性物品，可透明讨论其意义并按机构政策记录决定。情感快线的具体礼物标准、金额门槛（如有）和审批要求，不在FAQ中虚构，应以正式伦理政策、服务协议、人员所属专业规范及适用法律为准。", "en": "Gifts require consideration of value, cultural meaning, timing, frequency, expected reciprocity, and possible pressure. Expensive, secret, conditional gifts or those that could influence professional judgment are generally inappropriate; practitioners should not use gifts to create personal obligation or induce purchases. A symbolic item may be discussed transparently and the decision documented under organizational policy. Emotional Express’s exact gift rules, any value threshold, and approval requirements should not be invented in an FAQ and are governed by formal ethics policy, service terms, the practitioner’s professional code, and applicable law."}, "keywords": ["礼物边界", "文化敏感", "专业伦理", "gift boundaries", "cultural sensitivity", "professional ethics"], "children": ["faq-239", "faq-057"], "cluster": 50}, {"id": "faq-229", "q": {"zh": "如果咨询人员认识来访者的家人或另一方，应该怎么办？", "en": "What should happen if a practitioner knows the client’s family member or the other party?"}, "a": {"zh": "咨询人员应尽早评估现实或潜在利益冲突、偏见、保密泄露和角色混乱，并在不泄露第三方隐私的前提下向来访者说明足以做决定的信息。根据风险，可共同同意设立边界、寻求督导或转介给独立人员。不得为了留住业务而淡化冲突，也不能向熟人确认来访者正在接受服务。具体披露、记录和回避要求，以情感快线伦理制度、服务协议、专业规范及适用法律为准。", "en": "The practitioner should promptly assess actual or potential conflicts, bias, confidentiality risk, and role confusion, then disclose enough for informed choice without revealing a third party’s private information. Depending on risk, the parties may agree on safeguards, seek supervision, or refer to an independent practitioner. A conflict should not be minimized to retain business, and the practitioner must not confirm the client’s use of services to acquaintances. Exact disclosure, documentation, and recusal requirements are governed by Emotional Express’s ethics rules, service agreement, professional standards, and applicable law."}, "keywords": ["利益冲突", "回避转介", "熟人关系", "conflict of interest", "recusal", "prior acquaintance"], "children": ["faq-227", "faq-239"], "cluster": 0}, {"id": "faq-230", "q": {"zh": "情感快线遇到超出服务能力的问题时会怎样处理？", "en": "What should Emotional Express do when a concern falls outside its competence or service scope?"}, "a": {"zh": "服务人员应诚实说明能力、资质与服务边界，不应在缺乏训练时处理需要专科医疗、精神健康、法律、财务、家暴安全或其他专业介入的问题。可在来访者同意和隐私允许范围内提供合适的转介方向、交接摘要或并行支持，但不能保证第三方可用性或效果。出现即时危险时，应联系当地紧急服务、可信赖的人和专业机构。具体筛查、转介、费用及资料共享方式，以正式服务协议、隐私规则、当期报价及适用法律为准。", "en": "Staff should state their competence, credentials, and scope honestly and should not handle specialist medical, mental-health, legal, financial, domestic-violence safety, or other needs without appropriate training. With client consent and within privacy limits, the service may offer suitable referral directions, a transfer summary, or parallel support, but it cannot guarantee a third party’s availability or outcome. Immediate danger requires local emergency services, trusted people, and specialist organizations. Screening, referral, charges, and information-sharing methods are governed by the formal service agreement, privacy rules, current quotation, and applicable law."}, "keywords": ["能力边界", "专业转介", "服务范围", "competence", "professional referral", "scope of service"], "children": ["faq-036", "faq-030"], "cluster": 0}, {"id": "faq-231", "q": {"zh": "服务如何尊重不同性别、性取向、文化、宗教和关系形式？", "en": "How should the service respect different genders, sexual orientations, cultures, faiths, and relationship structures?"}, "a": {"zh": "服务应采用尊重、非歧视和文化谦逊的方式，询问而非假定来访者的称谓、家庭结构、价值与关系目标，不以某一种婚恋模式作为唯一标准。工作人员应识别自身偏见，在能力不足时寻求督导或转介，并避免“矫正”身份或强迫符合文化刻板印象。合理便利与语言支持应依实际能力透明说明。情感快线具体的平等政策、可提供语言和申诉机制，以现行正式政策、服务协议及适用反歧视法律为准。", "en": "The service should practice respect, nondiscrimination, and cultural humility by asking rather than assuming a client’s form of address, family structure, values, and relationship goals, without treating one relationship model as universal. Staff should recognize personal bias, seek supervision or refer when competence is limited, and avoid identity “correction” or cultural stereotyping. Available accommodations and language support should be described honestly. Emotional Express’s actual equality policy, available languages, and complaint mechanism are governed by current formal policy, service terms, and applicable anti-discrimination law."}, "keywords": ["多元包容", "文化谦逊", "非歧视", "inclusion", "cultural humility", "nondiscrimination"], "children": ["faq-015", "faq-105"], "cluster": 0}, {"id": "faq-232", "q": {"zh": "情感咨询能否替代心理治疗、医疗、法律或财务建议？", "en": "Can relationship counseling replace psychotherapy, medical care, or legal or financial advice?"}, "a": {"zh": "不能。情感咨询可支持沟通、情绪梳理和关系决策，但不自动等同于由持牌专业人员提供的心理治疗，也不能诊断疾病、开药、出具法律意见或制定投资方案。服务方应如实说明人员资质和工作范围，并在需要时建议合资格的医疗、心理、法律或财务专业人士。若有危机、暴力、自伤或他伤风险，应立即联系当地紧急服务、可信赖的人及专业机构。具体服务定义和责任边界以正式协议与适用法律为准。", "en": "No. Relationship counseling may support communication, emotional reflection, and relationship decisions, but it is not automatically psychotherapy delivered by a licensed professional and cannot diagnose illness, prescribe medication, issue legal advice, or create an investment plan. The service should accurately state practitioner credentials and scope and recommend qualified medical, mental-health, legal, or financial professionals when needed. Crisis, violence, or risk of self-harm or harm to others requires immediate contact with local emergency services, trusted people, and specialist organizations. Exact service definitions and responsibility limits are governed by formal terms and applicable law."}, "keywords": ["非替代声明", "专业边界", "持牌服务", "not a substitute", "professional scope", "licensed services"], "children": ["faq-009", "faq-247"], "cluster": 0}, {"id": "faq-233", "q": {"zh": "情感快线的服务价格如何确定？", "en": "How are Emotional Express service prices determined?"}, "a": {"zh": "价格可能随服务类型、时长、提供人员、个人或共同会谈、语言、时段及配套内容而变化，FAQ不应虚构固定金额。预约确认前，服务方应提供清晰的当期报价，说明币种、税费、包含内容、可能的额外费用、支付时间和取消规则，让来访者在付款前知情选择。任何口头宣传若与正式文件不一致，应先要求书面澄清。最终收费以情感快线出具并由来访者接受的正式报价、订单或服务协议及适用消费者法律为准。", "en": "Pricing may vary by service type, duration, practitioner, individual or joint format, language, time slot, and included materials, so an FAQ should not invent a fixed amount. Before booking is confirmed, the service should provide a clear current quotation stating currency, taxes, inclusions, possible extras, payment timing, and cancellation terms so the client can choose before paying. If verbal promotion conflicts with formal documents, request written clarification first. Final charges are governed by the formal quotation, order, or service agreement issued by Emotional Express and accepted by the client, together with applicable consumer law."}, "keywords": ["服务定价", "正式报价", "费用透明", "service pricing", "formal quotation", "fee transparency", "price", "cost", "fee", "charge", "rates", "pricing", "session", "how"], "children": ["faq-017", "faq-013"], "cluster": 0}, {"id": "faq-234", "q": {"zh": "套餐是否保证在固定次数内复合、脱单或挽回成功？", "en": "Does a package guarantee reconciliation, a new relationship, or “winning someone back” within a set number of sessions?"}, "a": {"zh": "不应作此类保证。关系结果受双方自主选择、环境和众多不可控因素影响，任何服务都不能合法或诚实地承诺他人会复合、爱上来访者或在固定期限内改变。套餐只能明确约定服务次数、形式、期限、包含材料和专业支持范围，并应说明未使用次数、到期、转让、暂停与退款规则。实际套餐内容和费用以当期书面报价及正式服务协议为准；夸大成功率或以恐惧催促付款时，来访者应暂停并要求证据与书面条款。", "en": "No such guarantee should be made. Relationship outcomes depend on both people’s autonomy, circumstances, and many uncontrollable factors; no service can honestly promise that another person will reconcile, fall in love, or change by a deadline. A package may define only the number, format, validity, materials, and scope of professional support, with rules for unused sessions, expiry, transfer, pause, and refunds. Actual inclusions and fees are governed by the current written quotation and formal service agreement. If success claims are exaggerated or fear is used to rush payment, pause and request evidence and written terms."}, "keywords": ["结果不保证", "咨询套餐", "消费者知情", "no outcome guarantee", "counseling package", "informed consumer", "reconcile", "reconciliation", "get", "back", "together", "win", "复合", "挽回"], "children": ["faq-010", "faq-204"], "cluster": 0}, {"id": "faq-235", "q": {"zh": "改期、取消或未到场会怎样收费？", "en": "What charges apply to rescheduling, cancellation, or nonattendance?"}, "a": {"zh": "具体提前通知时间、可免费改期次数和费用比例取决于情感快线当期政策，不能在知识库中杜撰。服务方应在付款或预约前显著告知规则、适用时区、如何提交通知，以及突发疾病、自然灾害或平台故障是否有例外；来访者应通过可留痕的官方渠道尽快通知。双方发生争议时，保存预约确认和沟通记录。最终处理以预约时接受的正式服务协议、取消政策、当期报价及适用消费者法律为准。", "en": "Required notice, the number of permitted changes, and any fee percentage depend on Emotional Express’s current policy and should not be invented in a knowledge base. Before payment or booking, the service should prominently state the rule, applicable time zone, notice method, and any exceptions for sudden illness, disaster, or platform failure. Clients should notify the service promptly through a traceable official channel. If a dispute arises, keep booking confirmations and communications. Final treatment is governed by the cancellation policy, current quotation, and formal service agreement accepted at booking, together with applicable consumer law."}, "keywords": ["取消政策", "改期", "未到场", "cancellation policy", "rescheduling", "no-show", "price", "cost", "fee", "charge", "rates", "pricing", "session", "how"], "children": ["faq-017", "faq-011"], "cluster": 0}, {"id": "faq-236", "q": {"zh": "来访者不满意服务时一定可以退款吗？", "en": "Is a refund always available when a client is dissatisfied?"}, "a": {"zh": "不一定。情感支持的结果不能保证，但服务方仍应按约提供项目并遵守适用消费者法律。是否退款可能取决于服务是否开始、已使用部分、套餐条款、技术故障、取消原因和法定权利。来访者应先查看订单与退款政策，向官方渠道说明具体问题并提供相关记录；服务方应给出可理解的书面回复，不得以“主观服务”排除不可排除的法定权利。最终退款资格、金额和时间以正式协议、当期书面政策及适用法律为准。", "en": "Not necessarily. Emotional-support outcomes cannot be guaranteed, but the provider must still deliver the agreed service and comply with applicable consumer law. Refund eligibility may depend on whether service began, the portion used, package terms, technical failure, cancellation reason, and statutory rights. The client should review the order and refund policy, describe the specific issue through an official channel, and retain relevant records. The service should provide an understandable written response and cannot use the subjective nature of a service to exclude non-waivable legal rights. Final eligibility, amount, and timing are governed by formal terms, the current written policy, and applicable law."}, "keywords": ["退款政策", "服务争议", "消费者权利", "refund policy", "service dispute", "consumer rights", "refund", "money", "back", "reimburse", "退款", "退费", "改期", "取消"], "children": ["faq-033", "faq-005"], "cluster": 0}, {"id": "faq-237", "q": {"zh": "支付时应如何核对费用和收据？", "en": "How should clients verify charges and receipts when paying?"}, "a": {"zh": "付款前应核对服务名称、次数或时长、币种、税费、折扣条件、自动续费（如有）、收款主体和退款规则，只使用情感快线确认的官方渠道，不向个人陌生账户或通过远程控制方式付款。付款后应保存订单、正式收据或发票及沟通记录；发现重复扣款或可疑链接时，应立即联系官方客服和支付机构。可开具何种票据、开具时间及税务处理，以当期报价、正式协议、支付页面和适用税法为准。", "en": "Before paying, verify the service name, number or duration, currency, taxes, discount conditions, any auto-renewal, the receiving entity, and refund terms. Use only an official channel confirmed by Emotional Express; do not pay an unfamiliar personal account or allow remote-control access. Keep the order, official receipt or invoice, and communications. Report duplicate charges or suspicious links promptly to official support and the payment provider. Available receipt or invoice types, issuance timing, and tax treatment are governed by the current quotation, formal agreement, payment page, and applicable tax law."}, "keywords": ["支付安全", "收据发票", "费用核对", "payment safety", "receipt and invoice", "charge verification", "price", "cost", "fee", "charge", "rates", "pricing", "session", "how"], "children": ["faq-235", "faq-017"], "cluster": 0}, {"id": "faq-238", "q": {"zh": "从首次咨询到正式开始服务，一般有哪些步骤？", "en": "What steps generally occur from first inquiry to the start of service?"}, "a": {"zh": "常见流程包括提出需求、基本适配与风险筛查、了解服务人员资质与可选形式、阅读隐私和知情同意文件、确认当期报价、预约与付款，再设定初步目标。筛查不是诊断，也不能保证匹配成功；若需求超出范围，应说明并提供适当转介方向。线上服务还应确认所在地、紧急联系人安排和技术条件。情感快线的实际步骤、所需文件、处理时长和费用以预约时的官方说明、正式服务协议、当期报价及适用法律为准。", "en": "A typical path may include stating the concern, basic fit and risk screening, reviewing practitioner credentials and available formats, reading privacy and informed-consent documents, confirming the current quotation, booking and payment, and setting initial goals. Screening is not diagnosis and cannot guarantee a successful match; needs outside scope should be explained with suitable referral directions where possible. Remote services may also confirm location, emergency-contact arrangements, and technical readiness. Emotional Express’s actual steps, documents, processing time, and charges are governed by official booking information, the formal service agreement, current quotation, and applicable law."}, "keywords": ["服务流程", "初步筛查", "知情同意", "service process", "initial screening", "informed consent", "book", "booking", "appointment", "schedule", "session", "start", "get", "started", "sign", "up"], "children": ["faq-006", "faq-021"], "cluster": 0}, {"id": "faq-239", "q": {"zh": "情感快线如何为来访者匹配合适的咨询人员？", "en": "How might Emotional Express match a client with an appropriate practitioner?"}, "a": {"zh": "匹配可参考需求主题、服务语言、时间、文化偏好、咨询形式、人员训练与利益冲突，但不能承诺某位人员一定合适或产生特定结果。服务方应准确展示人员身份、资质、角色和工作范围，不把“情感导师”等称谓等同于未实际持有的专业执照。来访者可询问经验、方法、督导和转介安排，并在合理流程内提出更换。实际匹配标准、可选人员、换配费用与等待时间，以官方说明、正式协议和当期报价为准。", "en": "Matching may consider the concern, language, schedule, cultural preferences, format, practitioner training, and conflicts of interest, but it cannot promise that one practitioner will be a perfect fit or produce a specific outcome. The service should accurately present identity, credentials, role, and scope and must not equate a title such as “relationship coach” with a professional license the person does not hold. Clients may ask about experience, approach, supervision, and referral options and request a change through a reasonable process. Actual criteria, available practitioners, change fees, and waiting times are governed by official information, formal terms, and the current quotation."}, "keywords": ["咨询匹配", "人员资质", "更换咨询师", "practitioner matching", "credentials", "practitioner change"], "children": ["faq-007", "faq-019"], "cluster": 0}, {"id": "faq-240", "q": {"zh": "来访者如何投诉、提出伦理疑虑或结束服务？", "en": "How can a client complain, raise an ethical concern, or end the service?"}, "a": {"zh": "来访者有权询问、反馈、拒绝不合适的建议并按协议结束服务，不应因投诉受到报复。可通过情感快线公布的官方渠道说明事件、日期、期望处理并保存证据；服务方应确认收悉、由适当人员公正审查并书面回应。若涉及持证专业人员，可按其注册机构机制反映；消费者、隐私或违法疑虑也可向当地主管机关寻求独立意见。处于暴力、自伤或他伤的即时危险时，不要等待投诉流程，应联系当地紧急服务、可信赖的人和专业机构。准确流程、时限、费用结算与记录处理，以正式协议、投诉政策和适用法律为准。", "en": "Clients may ask questions, give feedback, decline unsuitable suggestions, and end service under the agreement without retaliation for complaining. They can use Emotional Express’s published official channel to describe the event, dates, and desired resolution and retain evidence; the service should acknowledge receipt, arrange impartial review by an appropriate person, and respond in writing. Concerns about a licensed professional may also go to the relevant registration body, while consumer, privacy, or legal issues may warrant independent advice from local authorities. Do not wait for a complaint process during immediate violence or risk of self-harm or harm to others; contact local emergency services, trusted people, and specialist organizations. Exact steps, timelines, account settlement, and record handling are governed by formal terms, complaint policy, and applicable law."}, "keywords": ["投诉机制", "伦理疑虑", "结束服务", "complaint process", "ethical concern", "service termination ================================================================================", "分手", "离开", "结束"], "children": ["faq-025", "faq-029"], "cluster": 3}, {"id": "faq-241", "q": {"zh": "哪些关系困扰可以先尝试自助，哪些更适合寻求专业支持？", "en": "Which relationship concerns may be suitable for self-help, and which call for professional support?"}, "a": {"zh": "轻度、短期且双方安全的困扰，如一次沟通误会或共同安排分歧，可先尝试可靠读物、结构化对话和短期复盘。若问题反复、明显影响睡眠工作、涉及创伤、成瘾疑虑、严重心理症状、未成年人保护、强制控制或双方无法安全对话，更适合尽早寻求相应资质的专业人员。暴力、跟踪、自伤或他伤危险不是自助议题：应立即联系当地紧急服务、可信赖的人和家暴、危机或医疗专业机构。选择支持方式不代表关系“严重失败”，而是按风险匹配资源。", "en": "Mild, short-term concerns in a safe relationship—such as one misunderstanding or a scheduling disagreement—may first be addressed with reliable reading, a structured conversation, and a short review period. Repeated problems, substantial effects on sleep or work, trauma, possible addiction, serious mental-health symptoms, safeguarding issues, coercive control, or inability to talk safely call for appropriately qualified support sooner. Violence, stalking, or danger of self-harm or harm to others is not a self-help issue: contact local emergency services, trusted people, and domestic-violence, crisis, or medical specialists immediately. Seeking support is resource matching, not proof that a relationship has “failed.”"}, "keywords": ["自助边界", "专业支持", "风险分层", "self-help limits", "professional support", "risk triage"], "children": ["faq-248", "faq-020"], "cluster": 0}, {"id": "faq-242", "q": {"zh": "第一次情感咨询前可以做哪些准备？", "en": "How can someone prepare for a first relationship-counseling session?"}, "a": {"zh": "可用几句话写下最想改善的问题、最近一个具体例子、已经尝试的方法及希望从咨询获得什么；同时准备服务协议、隐私和费用方面的问题。无需整理出完整人生故事，也不必提前证明谁对谁错。线上会谈可测试设备、确认私密空间和意外中断后的联络方式。若涉及危机或暴力，提前告知服务方并优先联系当地紧急或专业资源。带着“不确定”进入咨询也可以，目标可在过程中共同澄清。", "en": "Write a few sentences about the main concern, one recent example, what has already been tried, and what help would be useful. Also prepare questions about the service agreement, privacy, and fees. There is no need to organize an entire life story or prove who is right. For an online session, test the device, find a private space, and confirm what happens after a dropped connection. If crisis or violence is involved, alert the service and prioritize local emergency or specialist resources. It is acceptable to arrive uncertain; goals can be clarified collaboratively."}, "keywords": ["初次咨询", "会前准备", "咨询目标", "first session", "preparation", "counseling goals"], "children": ["faq-020", "faq-145"], "cluster": 0}, {"id": "faq-243", "q": {"zh": "怎样把“让关系变好”转化为可观察的咨询目标？", "en": "How can “make the relationship better” become observable counseling goals?"}, "a": {"zh": "可把宏大愿望拆成具体行为、情境和时间范围，例如“发生分歧时能在不辱骂的情况下谈十分钟”“每周有一次双方同意的无设备相处时间”或“在一个月内明确是否继续共同规划”。目标应包含双方能控制的行动，而不是“让对方永远不生气”。还可记录频率、强度、恢复时间和主观安全感，并定期复盘。指标帮助观察变化，不是用来羞辱、监控或保证结果；目标也应随新信息调整。", "en": "Break the broad wish into behaviors, situations, and a time frame—for example, “discuss a disagreement for ten minutes without insults,” “have one mutually agreed device-free period each week,” or “clarify within a month whether to keep planning jointly.” Goals should focus on actions each person can control, not “make my partner never angry.” Frequency, intensity, recovery time, and felt safety can also be tracked and reviewed. Measures are for noticing change, not shaming, surveillance, or guaranteeing outcomes, and goals may change as new information emerges."}, "keywords": ["目标设定", "可观察行为", "进展指标", "goal setting", "observable behavior", "progress indicators"], "children": ["faq-145", "faq-061"], "cluster": 36}, {"id": "faq-244", "q": {"zh": "有哪些简单的结构化沟通练习可以在安全关系中尝试？", "en": "What simple structured communication exercise can be tried in a safe relationship?"}, "a": {"zh": "可尝试“说者—听者”练习：先约定一个低到中等强度的议题和短时间；说者只描述一个事实、自己的感受与一个具体请求，听者先复述所听到的内容并确认理解，再交换角色。任何一方情绪过载时可暂停，并约定恢复时间。练习的目标是理解而非当场裁决。它只适用于基本安全、可以自由暂停的关系；若存在恐吓、暴力或强制控制，不要用共同沟通练习代替安全计划，应联系当地专业机构和可信赖的人。", "en": "Try a speaker–listener exercise: agree on one low-to-moderate topic and a short time. The speaker names one observable fact, their feeling, and one specific request; the listener paraphrases and checks understanding before roles switch. Either person may pause when overwhelmed, with a time agreed for resuming. The aim is understanding, not an immediate verdict. This exercise is only for relationships with basic safety and genuine freedom to pause. Where intimidation, violence, or coercive control exists, do not substitute a joint exercise for safety planning; contact local specialist services and trusted people."}, "keywords": ["结构化沟通", "积极倾听", "安全前提", "structured communication", "active listening", "safety prerequisite", "沟通", "吵架", "争吵", "冲突", "矛盾", "安全", "紧急", "自伤"], "children": ["faq-114", "faq-039"], "cluster": 36}, {"id": "faq-245", "q": {"zh": "情绪日记怎样写才不会变成反复钻牛角尖？", "en": "How can an emotion journal avoid becoming repetitive rumination?"}, "a": {"zh": "可限制在短时段，用固定栏目记录：发生了什么可观察事实、身体感觉、情绪强度、自动想法、支持或反对该想法的证据、采取的行动，以及下一步最小可行选择。最后加入一项自我照顾或现实任务，然后结束记录，避免整夜重复分析。日记用于发现模式，不是搜集“伴侣有罪”的档案。若书写后持续恶化、触发创伤或出现自伤想法，应停止练习并联系合资格心理健康专业人员；危险迫近时联系当地紧急服务和可信赖的人。", "en": "Use a limited time and consistent fields: observable event, body sensations, emotion intensity, automatic thought, evidence for and against it, action taken, and the smallest workable next step. End with one act of care or practical task, then close the journal rather than analyzing all night. The journal is for noticing patterns, not building a prosecution file against a partner. If writing consistently worsens distress, triggers trauma, or brings self-harm thoughts, stop and contact a qualified mental-health professional; imminent danger requires local emergency services and a trusted person."}, "keywords": ["情绪日记", "反刍思维", "自我观察", "emotion journal", "rumination", "self-observation"], "children": ["faq-096", "faq-074"], "cluster": 12}, {"id": "faq-246", "q": {"zh": "突然分手后的前72小时，怎样照顾自己？", "en": "How can someone care for themselves during the first 72 hours after an abrupt breakup?"}, "a": {"zh": "优先维持基本安全与功能：联系一两位可信赖的人，按时补水进食，尽量休息，避免酒精或冲动驾驶，并把重大财务、辞职、公开曝光或报复决定暂缓。可暂时静音社交媒体、把想发送的长信息先存草稿，并处理钥匙、住处、药物或宠物等实际事项。强烈情绪并不要求立即“想通”。若出现自伤、他伤、暴力或无法维持安全的风险，应立即联系当地紧急服务、危机或医疗专业机构以及可信赖的人。", "en": "Prioritize basic safety and functioning: contact one or two trusted people, drink and eat regularly, rest where possible, avoid alcohol or impulsive driving, and delay major financial, resignation, public-exposure, or retaliati
